<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리동네 찾기 · 구리시 G-MAP</title>
<meta name="description" content="무더위쉼터부터 공영주차장까지, 우리 동네 생활 시설을 지도에서 찾아보세요.">
<meta property="og:title" content="구리시 G-MAP 우리동네 찾기">
<meta property="og:description" content="무더위쉼터부터 공영주차장까지, 우리 동네 생활 시설을 지도에서 찾아보세요.">
<meta property="og:type" content="website">
<meta property="og:image" content="/images/og-cover.jpg">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="gmap-shared.css">
<script src="gmap-share.js" defer></script>
<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
<style>
:root{
  /* 공용 토큰(gmap-shared.css) 별칭 — 색 자체는 KRDS 토큰에서 온다 */
  --font-brand:var(--gmap-font-brand);
  --brand:var(--krds-color-light-primary-50); --brand-hover:var(--krds-color-light-primary-60); --brand-soft:var(--krds-color-light-primary-5);
  /* 그룹별 강조색 — setGroup() 이 GROUPS[g].accent 로 덮어쓴다. 기본은 primary-50 */
  --accent:var(--krds-color-light-primary-50); --accent-soft:var(--krds-color-light-primary-5);
  --bg:var(--krds-color-light-gray-5); --surface:#FFFFFF; --ink:var(--krds-color-light-gray-90); --sub:var(--krds-color-light-gray-60); --faint:var(--ui-faint,#667570); --line:var(--krds-color-light-gray-10);
  --danger:#E5533C;
  --radius:var(--ui-radius-sm,6px); --shadow:var(--ui-shadow,0 2px 10px rgba(30,50,41,.07)); --shadow-lg:var(--ui-shadow-lg,0 10px 26px rgba(30,50,41,.14));   /* 공통 규격(site-shell.css --ui-*) */
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--krds-font-family-base);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ── 헤더: 상단바는 gmap-shared.css 공용 ── */
.header-right-sep{margin-left:auto}

/* ── 세그먼트 밴드 (그룹 색 배경 + 테마 세그먼트) ── */
.chipbar{position:sticky;top:var(--shell-h,64px);z-index:55;height:76px;color:#fff;
  background-color:var(--accent);
  background-image:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.10)); /* 아주 옅은 명암만 */
  transition:background-color .25s}
.chipbar-in{position:relative;display:flex;align-items:stretch;height:100%;max-width:none;margin:0;padding:0;overflow:hidden}
.chipbar-in::after{content:'';position:absolute;right:0;top:0;bottom:0;width:36px;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.16))} /* 가로 스크롤 힌트 */
/* 그룹 선택 블록 */
.group-sel{flex:none;display:flex;align-items:center;gap:9px;padding:0 16px 0 18px;border-right:1px solid rgba(255,255,255,.18);
  color:#fff;cursor:pointer;user-select:none;transition:background .15s}
.group-sel:hover{background:rgba(255,255,255,.1)}
.group-sel img{width:30px;height:30px;border-radius:6px;background:rgba(255,255,255,.18);display:block}
.group-sel .gs-txt{display:flex;flex-direction:column;line-height:1.15}
.group-sel .gs-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.75}
.group-sel #groupTx{font-size:16.5px;font-weight:800;white-space:nowrap}
.group-sel .ar{width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:5.5px solid #fff;margin-left:4px}
/* 테마 세그먼트 */
.segs{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;min-width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:5px 12px;border:0;border-right:1px solid rgba(255,255,255,.10);border-radius:0;background:transparent;color:#fff;
  font-size:13px;font-weight:700;line-height:1.15;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
.chip:last-child{border-right:0}
.chip:hover{background:rgba(255,255,255,.10)}
.chip img{width:26px;height:26px;border-radius:6px;display:block}
.chip .dot{width:12px;height:12px;border-radius:50%;display:block;margin:7px 0}
.chip .seg-nm{font-size:13px;font-weight:700}
.chip .cnt{font-size:10.5px;font-weight:600;opacity:.72}
.chip.all{flex:0 0 auto;width:88px;min-width:0;max-width:88px;background:rgba(0,0,0,.12)}
.chip.all .seg-nm{font-size:13.5px}
.chip.on,.chip.on:hover{background:#fff;color:var(--accent)}
.chip.on .cnt{color:var(--accent);opacity:.85}
.chip.soon{opacity:.45;border-top:2px dashed rgba(255,255,255,.7)}
.chip.soon .lbl-soon{font-size:10px;font-weight:700;color:#fff;background:rgba(255,255,255,.25);border-radius:6px;padding:1px 7px}
.chip.link .seg-nm{text-decoration:underline;text-underline-offset:2px}
/* 그룹 메뉴 (드롭다운) */
.group-menu{display:none;position:absolute;z-index:80;background:#fff;border:1px solid var(--line);border-radius:var(--ui-radius,10px);
  box-shadow:var(--shadow-lg);padding:6px;min-width:190px;max-height:70vh;overflow:auto;color:var(--ink)}
.group-menu.open{display:block}
.group-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:6px;
  font-size:13.5px;font-weight:700;color:var(--ink);text-align:left}
.group-menu button:hover{background:var(--accent-soft)}
.group-menu button.on{background:var(--accent);color:#fff}
.group-menu img{width:24px;height:24px;border-radius:6px;display:block}
.group-menu .gm-dot{width:9px;height:9px;border-radius:50%;flex:none;margin-left:auto;box-shadow:0 0 0 2px rgba(255,255,255,.6)}

.main{max-width:none;margin:0;display:flex;min-height:calc(100vh - 153px)}
/* ── 좌측 패널 ── */
.panel{width:352px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;
  max-height:calc(100vh - 153px);position:sticky;top:153px}
.panel-head{padding:14px 16px 0}
/* 테마 헤더 */
.theme-head{display:flex;align-items:center;gap:10px;min-height:38px}
.theme-head .th-ic{width:34px;height:34px;border-radius:6px;flex:none;display:block}
.theme-head .th-tx{min-width:0}
.theme-head .th-nm{font-size:17px;font-weight:800;color:var(--krds-color-light-gray-90);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.theme-head .th-n{font-size:14px;font-weight:800;color:var(--accent);margin-left:4px}
.theme-head .th-info{font-size:12.5px;color:var(--krds-color-light-gray-60);margin-top:3px;line-height:1.45;word-break:keep-all}
/* 검색 */
.searchbox{position:relative;display:flex;align-items:center;height:40px;margin:12px 0 10px;border:1px solid var(--krds-color-light-gray-20);border-radius:6px;background:#fff;transition:border-color .13s,box-shadow .13s}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.searchbox .sch-ic{position:absolute;left:11px;display:flex;color:var(--faint);pointer-events:none}
.searchbox input{border:none;outline:none;background:none;width:100%;height:100%;padding:0 34px 0 34px;font-size:13.5px;font-family:inherit;color:var(--ink)}
.searchbox input::placeholder{color:var(--faint)}
.searchbox .sch-clear{position:absolute;right:6px;width:26px;height:26px;display:none;place-items:center;border-radius:4px;color:var(--krds-color-light-gray-50)}
.searchbox .sch-clear:hover{background:var(--krds-color-light-gray-5);color:var(--accent)}
.searchbox.has .sch-clear{display:grid}
/* 도구 줄 */
.sort-row{display:flex;align-items:center;gap:6px;padding:0 16px 10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.sort-row::-webkit-scrollbar{display:none}
.sort-row .n{margin-left:auto;flex:none;font-size:12px;font-weight:600;color:var(--faint);white-space:nowrap;padding-left:6px}
.tool-btn,.tool-sel{flex:none;height:32px;border:1px solid var(--krds-color-light-gray-20);border-radius:6px;background:#fff;color:var(--krds-color-light-gray-60);
  font-size:12px;font-weight:700;font-family:inherit;line-height:1;white-space:nowrap;cursor:pointer;transition:all .13s}
.tool-btn{display:inline-flex;align-items:center;gap:5px;padding:0 10px 0 8px}
.tool-btn.near::before{content:'';width:16px;height:16px;flex:none;background:currentColor;
  -webkit-mask:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'16'%20height%3D'16'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'1.75'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%228%22%2F%3E%3Cpath%20d%3D%22M12%202v2%22%2F%3E%3Cpath%20d%3D%22M12%2020v2%22%2F%3E%3Cpath%20d%3D%22M20%2012h2%22%2F%3E%3Cpath%20d%3D%22M2%2012h2%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;mask:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'16'%20height%3D'16'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'1.75'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%228%22%2F%3E%3Cpath%20d%3D%22M12%202v2%22%2F%3E%3Cpath%20d%3D%22M12%2020v2%22%2F%3E%3Cpath%20d%3D%22M20%2012h2%22%2F%3E%3Cpath%20d%3D%22M2%2012h2%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}
.tool-btn:hover,.tool-sel:hover{border-color:var(--accent);color:var(--accent)}
.tool-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tool-sel{appearance:none;-webkit-appearance:none;padding:0 24px 0 10px;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'16'%20height%3D'16'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'%2358616a'%20stroke-width%3D'1.75'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Cpath%20d%3D%22M6%209l6%206l6%20-6%22%2F%3E%3C%2Fsvg%3E");background-repeat:no-repeat;background-position:right 7px center;background-size:14px}
/* 목록 행 — 카드처럼: 둥근 모서리, 옅은 구분선, 선택은 연한 배경 전체(왼쪽 막대 없음) */
.list{overflow-y:auto;flex:1;padding:2px 0 14px}
.row{position:relative;display:grid;grid-template-columns:34px 1fr auto;gap:0 12px;align-items:center;padding:12px 8px;margin:0 8px;
  border-radius:var(--ui-radius,10px);cursor:pointer;transition:background .12s,box-shadow .12s}
.row+.row::before{content:'';position:absolute;left:8px;right:8px;top:0;height:1px;background:var(--krds-color-light-gray-10)}   /* 행 사이 옅은 선 */
.row:hover{background:color-mix(in srgb,var(--accent) 6%,#fff)}
.row:hover::before,.row:hover+.row::before,.row.sel::before,.row.sel+.row::before{background:transparent}
.row.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 28%,#fff)}
.row .ic{width:32px;height:32px;justify-self:center;display:block}
.row .ic.mono{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--ui-radius-sm,6px);background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:800;letter-spacing:-.02em}
.row.sel .ic.mono{background:var(--accent);color:#fff}
.row .ic.line{width:20px;height:4px;border-radius:2px;background:var(--c)}
.row .tx{min-width:0}
.row .nm{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--krds-color-light-gray-90);line-height:1.3}
.row .nm .nm-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.sel .nm{color:var(--accent)}
.row .ad{font-size:12.5px;color:var(--krds-color-light-gray-60);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;line-height:1.35}
.row .dist{font-size:13px;font-weight:700;color:var(--krds-color-light-gray-90);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:0}
.row .dist small{font-size:11px;font-weight:600;color:var(--faint);margin-left:1px}
/* 상태 배지 — 알약 모양 */
.st{display:inline-flex;align-items:center;flex:none;height:20px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:800;white-space:nowrap}
.st.on{background:#e3f4ea;color:#0c7a45}
.st.pre{background:#FCF1DC;color:#8C5A0A}
.st.off{background:var(--krds-color-light-gray-10);color:var(--krds-color-light-gray-60)}
.st.closed,.st.dead,.st.x,.st.err,.st.stop{background:#fdecea;color:#b3261e}
.st.live{background:#fde8ec;color:#b3234a}.st.soon{background:#FCF1DC;color:#8C5A0A}.st.plan{background:#EEF1F4;color:#5b6770}.st.done{background:var(--krds-color-light-gray-10);color:var(--krds-color-light-gray-60)}
/* 선택 행 행동 줄 */
.row .acts{grid-column:1/-1;display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.row .act{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border:1px solid var(--accent);border-radius:var(--ui-radius-sm,6px);background:#fff;color:var(--accent);
  font-size:12.5px;font-weight:700;font-family:inherit;text-decoration:none;cursor:pointer;white-space:nowrap}
.row .act.fill{background:var(--accent);color:#fff}
.row .act:hover{filter:brightness(.95)}
/* 카드형 목록(운영 정보형) */
.opcard{border:1px solid var(--krds-color-light-gray-20);border-radius:var(--ui-radius,10px);padding:12px 13px;margin:8px 12px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.opcard:hover{border-color:var(--accent)}
.opcard.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.opcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.opcard .nm{font-size:14.5px;font-weight:700;color:var(--krds-color-light-gray-90);word-break:keep-all}
.opcard.sel .nm{color:var(--accent)}
.opcard .meta{font-size:12.5px;color:var(--krds-color-light-gray-60);margin-top:6px;line-height:1.6}
.opcard .meta b{font-weight:700;color:var(--krds-color-light-gray-70)}
/* .empty 는 공통 .gm-empty(site-shell.css)와 함께 쓴다 */
.empty{text-align:center;color:var(--faint);font-size:13px;padding:36px 14px;line-height:1.7;word-break:keep-all}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:var(--krds-color-light-gray-20);border-radius:6px}
.list::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.skel-row{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--krds-color-light-gray-10)}
.skel-row .a{width:30px;height:30px;border-radius:6px;flex:none}
.skel-row .b{flex:1}
.skel-row .b i{display:block;height:11px;border-radius:6px;margin-bottom:7px}
.skel-row .a,.skel-row .b i{background:linear-gradient(90deg,#EDF3EF 25%,#F7FBF8 50%,#EDF3EF 75%);
  background-size:200% 100%;animation:shine 1.2s infinite}
@keyframes shine{to{background-position:-200% 0}}
.copy-btn{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 8px;margin-left:6px;transition:filter .13s}
.copy-btn:hover{filter:brightness(.95)}

/* ── 지도 ── */
.mapwrap{flex:1;position:relative;min-height:420px}
#map{position:absolute;inset:0}
.pin-legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);
  border-radius:6px;padding:7px 12px;font-size:11.5px;color:var(--sub);display:flex;gap:11px;flex-wrap:wrap;z-index:5;max-width:60%}
.pin-legend img{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
.pin-legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}
.map-ctl{position:absolute;right:12px;top:12px;z-index:6;display:flex;flex-direction:column;gap:6px}
.map-ctl button{width:34px;height:34px;border-radius:6px;background:#fff;border:1px solid var(--krds-color-light-gray-20);display:grid;place-items:center;color:var(--krds-color-light-gray-70);box-shadow:var(--shadow);transition:all .13s}
.map-ctl button:hover{color:var(--accent);border-color:var(--accent)}
.map-ctl button svg{width:18px;height:18px}
.map-ctl .sep{height:4px}
.pin-legend.single,.legend-toggle.single{display:none!important}
.locate-hint{position:absolute;right:54px;top:12px;background:var(--accent);border:1px solid var(--accent);
  border-radius:6px;padding:6px 11px;font-size:11.5px;font-weight:700;color:#fff;z-index:5}
.map-toast{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;background:#1E3229;color:#fff;
  font-size:12.5px;border-radius:6px;padding:9px 18px;z-index:12;display:none}

/* 정보 카드 */
.infocard{position:absolute;left:12px;top:12px;width:min(360px,calc(100% - 24px));max-height:calc(100% - 24px);overflow-y:auto;   /* 지도 위 자리 규칙: 왼쪽 위=안내·팝업, 오른쪽 위=컨트롤, 아래=막대·범례 */
  background:#fff;border:1px solid var(--line);border-radius:var(--ui-radius,10px);box-shadow:var(--shadow-lg);z-index:10;display:none}
.infocard.open{display:block;animation:up .2s ease}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
 /* 팝업 머리 — 흰 바탕, 왼쪽 색 띠, 심볼 타일, 분류는 강조색·이름은 검정 (지도 3쪽 공통 모양) */
.infocard .hd{display:flex;align-items:center;gap:11px;padding:13px var(--ui-pad,16px) 12px 18px;position:relative;background:#fff;border-bottom:1px solid var(--krds-color-light-gray-10)}
.infocard .hd::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.infocard .hd .hd-ic{flex:none;width:40px;height:40px;border-radius:var(--ui-radius,10px);background:var(--accent-soft);display:grid;place-items:center}
.infocard .hd .hd-ic img{width:28px;height:28px;display:block}
.infocard .hd .hd-tx{min-width:0;flex:1;padding-right:30px}
.infocard .hd .cat{font-size:11px;font-weight:800;color:var(--accent)}
.infocard .hd .nm{font-size:var(--ui-title,17px);font-weight:800;color:var(--ink);margin-top:1px;line-height:1.3;word-break:keep-all}
.infocard .close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:var(--ui-radius-sm,6px);background:#F1F4F2;color:var(--krds-color-light-gray-70);font-size:13px;display:grid;place-items:center}

/* ── 축제: 상태(진행중·예정·계획·종료) 판정, 기간·시간 표기, 심볼 ── */
const FEST_STYLE={
  live:{c:'#D6455F'}, soon:{c:'#E8940F'}, plan:{c:'#7C8B95'}, done:{c:'#A9B4AE'}
};
function festDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function festState(r,pv){
  const s=toDate(pv(r,['시작일','시작','개최일'])), e=toDate(pv(r,['종료일','종료']))||s;
  const stat=String(pv(r,['상태'])||'');
  const today=festDay(new Date());
  if(s){
    const s0=festDay(s), e0=festDay(e&&e>=s? e : s);
    if(today<s0){ const days=Math.round((s0-today)/864e5);

/* 교통 공사·통제: UTIC 레이어가 발행한 사건유형별 원본 심볼(utic_*) — 레이어 렌더러에서 그대로 가져옴 */
const UTIC_SYM={'사고':'utic_accident','공사':'utic_work','행사':'utic_event','기상':'utic_weather','통제':'utic_control','재난':'utic_disaster','기타':'utic_etc'};
function symKey(themeName,row){
  const t=findTheme(themeName); if(!t) return null;
  if(themeName==='교통 공사·통제'&&row){
    const k=String(pickVal(row,['incidentetype','incidtypenm','유형'])||'').trim();
    return UTIC_SYM[k]||'utic_etc';
  }
  if(themeName==='유기동물 보호현황'&&row){
    const k=String(pickVal(row,['kindfullnm','축종','품종'])||'');
    if(k.indexOf('고양이')>-1) return 'pet_stray_cat';
    if(k.indexOf('개')>-1) return 'pet_stray_dog';
    return 'pet_stray_etc';
  }
  return t.sym||null;
}
function symUrl(themeName,row){
  const t=findTheme(themeName);
  if(t&&t.symUrlFn&&row){ try{ return t.symUrlFn(row,pickVal); }catch(e){} }
  const k=symKey(themeName,row);
  const base=(k&&SYM[k])? SYM[k] : null;
  if(t&&t.symColorBy==='course'&&row){
    const col=courseColor(row,pickVal,t.c);
    return base? tintSym(base,col) : courseDot(col);
  }
  return base || dotSvg((t&&t.c)||'#5F7269');
}
function dotSvg(bg){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="72" height="72"><circle cx="14" cy="14" r="12.9" fill="${bg}" stroke="#fff" stroke-width="1.4"/><circle cx="14" cy="14" r="4.6" fill="#fff"/></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function pinSym(themeName,mode,row){
  const s= mode==='hot'?40 : mode==='dot'?14 : 26;
  return {type:"picture-marker",url:symUrl(themeName,row),width:s+"px",height:s+"px"};
}

const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortAddr=s=>(s||'').replace(new RegExp('^경기도\\s*'+CITY.name+'\\s*'),'').trim();
function haversine(x1,y1,x2,y2){const R=6371000,r=Math.PI/180;
  const a=Math.sin((y2-y1)*r/2)**2+Math.cos(y1*r)*Math.cos(y2*r)*Math.sin((x2-x1)*r/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));}
const fmtDist=m=>m<950?Math.round(m/10)*10+'m':(m/1000).toFixed(1)+'km';
function shade(hex,f){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const d=c=>Math.max(0,Math.round(c*(1-f)));
  return '#'+[d(r),d(g),d(b)].map(c=>c.toString(16).padStart(2,'0')).join('');}
function copyText(text){ /* https면 clipboard API, http면 execCommand 폴백 */
  if(navigator.clipboard&&window.isSecureContext)
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>legacyCopy(text));
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0,text.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); return ok;
}
async function shareUrl(){
  const label=(curCat!=='전체'?curCat+' — ':'')+'구리생활지도 우리동네 찾기';
  const httpish=/^https?:/i.test(location.href);   /* content://·file:// 등은 URL 공유 불가 */
  if(window.gmapShare&&httpish){ await gmapShare({title:label,url:location.href}); return; }   /* 기기 공유창 → 없으면 페이지 안 공유창(gmap-share.js) */
  if(navigator.share){
    try{
      await navigator.share(httpish? {title:label,url:location.href} : {title:label,text:label});
      return;
    }catch(e){ if(e&&e.name==='AbortError') return; /* 사용자가 취소 */ }
  }
  (await copyText(location.href))? toast('링크가 복사되었습니다') : toast('주소창의 링크를 복사해 주세요');
}
async function copyAddr(btn,addr){
  if(await copyText(addr)){ toast('주소가 복사되었습니다');
    btn.textContent='복사됨'; setTimeout(()=>btn.textContent='복사',1500); }

(async function loadDongs(){
  const root=CITY.dongUrl.replace(/\/\d+$/,'');
  const tries=[CITY.dongUrl];
  try{ for(const id of await layerIds(root)){ const u=root+'/'+id; if(tries.indexOf(u)<0) tries.push(u); } }catch(e){}
  const why=[];
  for(const u of tries){
    try{
      /* 동 강조(깜빡임)와 동 필터에 쓰는 도형 — 지도에 그려지는 행정동 점선 경계와 같은 모양이 되도록 단순화를 거의 하지 않는다(≈1m) */
      const res=await fetchT(`${u}/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&maxAllowableOffset=0.00001&f=json`);
      const j=await res.json();
      if(j.error){ why.push(u+' → '+j.error.message); continue; }
      const fs=j.features||[];
      if(!fs.length){ why.push(u+' → 0건'); continue; }
      if(!(fs[0].geometry&&(fs[0].geometry.rings||[]).length)){ why.push(u+' → 도형 없음'); continue; }
      const attrs=fs[0].attributes||{};
      const isName=v=>typeof v==='string'&&/[가-힣]{2,}(동|읍|면)$/.test(v.trim());
      const nameCands=Object.keys(attrs).filter(k=>isName(attrs[k]))
        .sort((a,b)=>String(attrs[a]).length-String(attrs[b]).length);   /* 짧은 쪽이 순수 동 이름 */
      let nameKey=nameCands[0];
      if(!nameKey) nameKey=Object.keys(attrs).find(k=>typeof attrs[k]==='string'&&/[가-힣]/.test(attrs[k]));
      if(!nameKey){ why.push(u+' → 동 이름 필드를 못 찾음: '+Object.keys(attrs).join(', ')); continue; }
      DONGS=fs.map(f=>{
        const rings=(f.geometry&&f.geometry.rings)||[];
        let xmin=180,xmax=-180,ymin=90,ymax=-90;
        rings.forEach(r=>r.forEach(([x,y])=>{xmin=Math.min(xmin,x);xmax=Math.max(xmax,x);
          ymin=Math.min(ymin,y);ymax=Math.max(ymax,y);}));
        return {name:String(f.attributes[nameKey]||''),rings,
          extent:{xmin,xmax,ymin,ymax,spatialReference:{wkid:4326}}};
      }).filter(d=>d.name&&d.rings.length)

      $('dongSel').innerHTML='<option value="">동 전체</option>'+DONGS.map(d=>`<option>${d.name}</option>`).join('');
      $('dongSel').style.display='inline-block';
      $('dongSel').addEventListener('change',ev=>gotoDong(ev.target.value));
      annotateDongs();
      if(DEBUG) console.log('[행정동]',u,DONGS.length,'개 | 이름 필드',nameKey);
      return;
    }catch(e){ why.push(u+' → '+String((e&&e.message)||e)); }
  }
  console.warn('[행정동 로드 실패 — 동 필터 비활성]');

})();
function pip(x,y,rings){ let inside=false;
  for(const ring of rings){ for(let i=0,j=ring.length-1;i<ring.length;j=i++){

  return inside; }

async function resolveLayer(root, li){

    const cand=[].concat(j.layers||[]).concat(j.tables||[]);
    let hit=null;

async function useWebmapAsMap(gName){
  const g=GROUPS[gName];
  if(LOCAL_FILE&&g&&g.webmap){
    console.warn('[웹맵] 로컬 파일(file://)에서는 포털 인증 확인이 막혀 웹맵을 못 읽어요. '
      +'포털에 올려서 같은 주소(www.guri.go.kr)에서 열면 정상 동작합니다.');
    return false;
  }
  for(let i=0;i<60&&(!view||!WebMapCls);i++) await new Promise(r=>setTimeout(r,100));
  if(!view||!WebMapCls) return false;
  if(!g||!g.webmap){                              /* 웹맵 없는 주제는 원래 지도로 */
    if(baseMapObj&&view.map!==baseMapObj){
      myOverlays.forEach(l=>{ if(!baseMapObj.layers.includes(l)) baseMapObj.add(l); });
      view.map=baseMapObj; mapObj=baseMapObj;
      console.log('[웹맵] 기본 지도로 복귀');
    }
    return false;
  }
  try{
    const wm=new WebMapCls({portalItem:{id:g.webmap}});
    view.map=wm;                                   /* 여기서 로딩이 시작된다 */
    await withTimeout(wm.when(),10000,'웹맵 when');
    if(!wm.loaded) throw new Error('웹맵을 읽지 못했습니다');
    mapObj=wm;
    if(WM_BASEMAP){ try{ wm.basemap=WM_BASEMAP; }catch(e){} }   /* 모든 배경지도 = 배경 웹맵 베이스맵 */
    myOverlays.forEach(l=>{ try{ wm.add(l); }catch(e){} });   /* 우리 표시들 다시 얹기 */
    Object.values(lineLayers).forEach(l=>{ try{ wm.add(l,2); }catch(e){} });
    const layers=wm.allLayers.toArray().filter(l=>l.type!=='group');
    console.log('[웹맵] 지도 교체 완료',gName,'| 레이어',layers.map(l=>l.title).join(', '));
    Object.entries(g.themes).forEach(([name,t])=>{
      const hit=layers.find(l=>{
        const ti=String(l.title||''), u=decodeURIComponent(String(l.url||''));
        return ti===name||ti.indexOf(name)>-1||u.indexOf(name)>-1
            ||(t.sym&&(ti.indexOf(t.sym)>-1||u.indexOf(t.sym)>-1));
      });
      if(!hit){ console.warn('[웹맵] 짝을 못 찾음:',name); return; }
      hit.popupEnabled=false; hit.legendEnabled=false; hit.outFields=["*"];
      wmLayers[gName+'·'+name]=hit;
      if(hit.url) t.src.url = (hit.layerId!=null&&!/\/\d+$/.test(hit.url))? hit.url+'/'+hit.layerId : hit.url;
      t.useWm=true;
      console.log('[웹맵] 연결',name,'→',t.src.url);
    });
    return true;
  }catch(e){
    console.warn('[웹맵] 지도 교체 실패 — JSON 방식으로 시도',String((e&&e.message)||e));
    if(baseMapObj){ view.map=baseMapObj; mapObj=baseMapObj; }
    return false;
  }
}
async function loadWebmap(gName){
  const g=GROUPS[gName];
  if(!g||!g.webmap||wmLoaded[gName]) return false;
  wmLoaded[gName]=true;
  console.log('[웹맵] 시작',gName,g.webmap);
  for(let i=0;i<60&&(!FLCls||!mapObj);i++) await new Promise(r=>setTimeout(r,100));  /* 지도 준비 대기 */
  if(!FLCls||!mapObj){ console.warn('[웹맵] 지도가 준비되지 않아 건너뜁니다'); wmLoaded[gName]=false; return; }
  try{
    /* 웹맵 정의(JSON)를 그대로 받아서 쓴다 — 포털 세션 확인 절차를 거치지 않음 */
    const url=`${CITY.portalUrl}/sharing/rest/content/items/${g.webmap}/data?f=json`;
    const res=await fetch(url);
    const j=await res.json();
    if(j.error) throw new Error(j.error.message);
    const ops=[].concat(j.operationalLayers||[]);
    const flat=[];
    (function walk(list){ list.forEach(l=>{
      if(l.layerType==='GroupLayer'&&l.layers) walk(l.layers); else flat.push(l); }); })(ops);
    console.log('[웹맵]',gName,g.webmap,'레이어',flat.map(l=>l.title).join(', '));

    Object.entries(g.themes).forEach(([name,t])=>{
      const hit=flat.find(l=>{
        const ti=String(l.title||''), u=decodeURIComponent(String(l.url||''));
        return ti===name || ti.indexOf(name)>-1 || u.indexOf(name)>-1
            || (t.sym&&(ti.indexOf(t.sym)>-1||u.indexOf(t.sym)>-1));
      });
      if(!hit||!hit.url){ console.warn('[웹맵] 짝을 못 찾음:',name); return; }
      const opt={url:hit.url,outFields:["*"],popupEnabled:false,legendEnabled:false,visible:false};
      const rj=hit.layerDefinition&&hit.layerDefinition.drawingInfo&&hit.layerDefinition.drawingInfo.renderer;
      const lyr=new FLCls(opt);
      if(rj&&RendererJU){ try{ lyr.renderer=RendererJU.fromJSON(rj); }
        catch(e){ console.warn('[웹맵] 심볼 적용 실패',name,String((e&&e.message)||e)); } }
      lyr.when(()=>console.log('[웹맵] 표시 준비',name),
               e=>console.warn('[웹맵] 레이어 로드 실패',name,String((e&&e.message)||e)));
      mapObj.add(lyr,3);
      wmLayers[gName+'·'+name]=lyr;
      t.src.url=hit.url;                       /* 목록·팝업도 같은 레이어에서 */
      t.useWm=true;
      console.log('[웹맵] 연결',name,'→',hit.url);
    });
    refresh();
    return true;
  }catch(e){
    console.warn('[웹맵 실패 — 기존 방식 사용]',gName,String((e&&e.message)||e));
    console.warn('   ↳ 이 주소가 콘솔에서 열리는지 확인해 보세요:',
      `${CITY.portalUrl}/sharing/rest/content/items/${g.webmap}/data?f=json`);
    Object.values(g.themes).forEach(t=>{ t.useWm=false; });
    wmLoaded[gName]=false;
    return false;
  }
}

function safetyThemeFor(value,url,field,idx,constFields){
  const v=String(value); let base=null;
  for(const [re,cfg] of SAFETY_RULES){ if(re.test(v)){ base=typeof cfg==='string'? SAFETY_PRESETS[cfg] : (cfg.preset? Object.assign({},SAFETY_PRESETS[cfg.preset],cfg) : cfg); break; } }
  if(base&&base.preset){ base=Object.assign({},base); delete base.preset; }
  const generic={sym:'safety_default',c:SAFETY_COLORS[idx%SAFETY_COLORS.length],guide:'우리 동네 치안·안전 시설이에요',
    pop:[['📌','설치장소',['설치장소','설치위치','위치','장소','상세위치']],['🏛️','관리기관',['관리기관','관리기관명','관리부서','운영기관']],['⏰','운영시간',['운영시간','이용시간']],['ℹ️','상세',['상세정보','비고','설명','내용']]],
    info:'구리시 치안·안전 시설 위치입니다.'};
  const t=Object.assign({},generic,base||{},{type:'list',short:(base&&base.short)||v,src:{url,catField:field,catValue:value}});
  delete t.auto; delete t.alt; delete t.cat; delete t.catFn; delete t.titleFn;   /* 옛 설정의 분류 뱃지(설치목적·구분)는 쓰지 않는다 — safety_all 은 '구분'이 전부 같은 값 */
  const NAMES=['장소','시설명','명칭','시설물명','장소명','설치장소','업소명','상호','상호명','건물명','name'];
  t.fields=Object.assign({},t.fields||{},{name:NAMES});
  t.nameFn=(r,pv)=>{ const n=pv(r,NAMES); return valOK(n)? String(n) : v; };   /* 제목은 장소 이름, 없으면 종류 이름 */
  t.hide=(t.hide||[]).concat(field? [field] : [], constFields||[]);   /* 종류 항목(칩 이름이 대신)과 값이 한 가지뿐인 항목은 팝업에서 숨김 */
  return t;
}
async function buildDynThemes(g,loader){
  const G=GROUPS[g]; if(!G||!G.dyn||G.dynBuilt) return;
  const url=G.dyn.url; const pseudo={src:{url}};
  if(dataCache[url]&&dataCache[url].__failed) delete dataCache[url];
  try{ await loader(pseudo); }catch(e){ dataCache[url]=[]; dataCache[url].__failed=true; console.warn('[치안안심] 불러오기 실패',String((e&&e.message)||e)); }
  const rows=dataCache[url]||[]; G.dynBuilt=rows.length>0;   /* 0건이면 다음에 다시 만든다 */
  const rank=v=>{ const i=SAFETY_ORDER.findIndex(s=>String(v).toUpperCase().indexOf(s.toUpperCase())>-1); return i<0? 99 : i; };
  /* 종류별 칩과 고정 테마(안심귀갓길 등)를 매번 새로 깔아 순서를 지킨다: 종류 칩 → 고정 테마 */
  Object.keys(G.themes).forEach(k=>{ if(G.themes[k].placeholder||(G.dyn.extra&&G.dyn.extra[k])) delete G.themes[k]; });
  const addExtra=()=>{ Object.assign(G.themes,G.dyn.extra||{}); };
  if(!rows.length){ console.warn('[치안안심] 자료 0건 — 레이어 공개(모든 사용자) 설정과 주소를 확인:',url);
    dataCache[url]=[]; dataCache[url].__failed=true;   /* 실패 표시(다음 진입 때 다시 받음). 지우면 아래 jobs 가 같은 주소를 한 번 더 요청한다 */
    /* 자료가 없어도 알려진 12종을 0건 칩으로 깔아 둔다 — 다른 주제처럼 전체 옆에 시설 칩이 보이게 */
    SAFETY_KNOWN.slice().sort((a,b)=>rank(a)-rank(b)).forEach((v,i)=>{ const t=safetyThemeFor(v,url,'시설물',i,G.dyn.hide||[]); t.placeholder=true; G.themes[v]=t; });
    addExtra();
    G.dynRetry=(G.dynRetry||0)+1;
    if(G.dynRetry<=2) setTimeout(()=>{ if(curGroup===g&&!G.dynBuilt) setGroup(g,curCat,false); },3000);   /* 첫 요청이 실패하면 3초 뒤 조용히 다시(최대 2번) */
    return; }
  const keys=Object.keys(rows[0]).filter(k=>!/^__/.test(k)); const norm=k=>String(k).toLowerCase().replace(/[_\s]/g,''); const low=keys.map(norm);
  let field=null; const nDistinct=k=>new Set(rows.map(r=>r[k]).filter(v=>v!=null&&String(v).trim())).size;
  const usable=k=>k&&nDistinct(k)>=2;   /* 값이 한 가지뿐인 항목(예: 구분=구리시시설물)은 건너뛴다 */
  for(const c of G.dyn.field){ const i=low.indexOf(norm(c)); if(i>-1&&usable(keys[i])){ field=keys[i]; break; } }
  if(!field){ for(const c of G.dyn.field){ const i=low.findIndex(k=>k.indexOf(norm(c))>-1); if(i>-1&&usable(keys[i])){ field=keys[i]; break; } } }
  if(!field){ let best=null; keys.forEach(k=>{ const vals=new Set(rows.map(r=>r[k]).filter(v=>typeof v==='string'&&v.trim())); if(vals.size>=2&&vals.size<=30&&vals.size<=Math.max(2,rows.length/2)&&(!best||vals.size<best.n)) best={k,n:vals.size}; }); field=best? best.k : null; }   /* 2~30가지(행 수의 절반 이하) 값을 가진 글자 항목 중 가짓수가 가장 적은 것 — 이름 항목은 거의 다 달라서 걸러진다 */
  if(!field){ console.warn('[치안안심] 시설 종류 항목을 못 찾음:',keys.join(',')); const t=safetyThemeFor('치안안심 시설',url,null,0); t.src={url}; G.themes['치안안심 시설']=t; addExtra(); return; }
  const counts={}; rows.forEach(r=>{ const v=r[field]; if(v!=null&&String(v).trim()) counts[v]=(counts[v]||0)+1; });
  const vals=Object.keys(counts).sort((a,b)=>rank(a)-rank(b)||counts[b]-counts[a]);
  const constFields=keys.filter(k=>k!==field&&nDistinct(k)<=1);   /* 예: 구분='구리시시설물' */
  vals.forEach((v,i)=>{ G.themes[v]=safetyThemeFor(v,url,field,i,constFields.concat(G.dyn.hide||[])); });
  addExtra(); G.dynField=field;
  console.info('[치안안심] 시설 종류 항목 "'+field+'" → '+vals.length+'가지: '+vals.join(', '));
}
/* 보고 있는 동안 자료를 조용히 다시 받는다(autoRefresh 테마가 있는 그룹만, EV_SYNC_EVERY_MIN 분마다). 팝업은 열려 있으면 다시 열 때 새 상태로 */
setInterval(async()=>{
  if(document.hidden) return;
  const ts=Object.values(groupThemes(curGroup)).filter(t=>t.autoRefresh&&t.src&&dataCache[t.src.url]&&!dataCache[t.src.url].__failed);
  if(!ts.length) return;
  ts.forEach(t=>delete dataCache[t.src.url]);
  try{ await loadGroupData(true); renderChips(); refresh(); }catch(e){ console.warn('[배경 갱신 실패]',e); }
},EV_SYNC_EVERY_MIN*60000);
function retryGroup(){
  const G=GROUPS[curGroup]; if(!G) return;
  Object.values(G.themes).forEach(t=>{ if(t.src) delete dataCache[t.src.url]; });
  if(G.dyn){ delete dataCache[G.dyn.url]; G.dynBuilt=false; G.dynRetry=0; }
  toast('다시 불러오는 중이에요'); setGroup(curGroup,curCat,false);
}
async function loadGroupData(quiet){   /* quiet: 배경 갱신 — 자리표시·'불러오는 중' 없이 */
  Object.values(groupThemes(curGroup)).forEach(t=>{ if(t.src&&dataCache[t.src.url]&&dataCache[t.src.url].__failed) delete dataCache[t.src.url]; });   /* 실패했던 자료는 다시 받는다 */
  const themes=Object.values(groupThemes(curGroup)).filter(t=>t.src);
  const jobs=[];   /* url별 1회 로드 */
  const seen=new Set();
  themes.forEach(t=>{ if(!seen.has(t.src.url)){ seen.add(t.src.url); jobs.push(t); } });
  if(!quiet) $('statusHint').textContent='불러오는 중…';
  if(!quiet&&jobs.some(t=>!dataCache[t.src.url]))
    $('list').innerHTML=Array(6).fill('<div class="skel-row"><span class="a"></span><span class="b"><i style="width:62%"></i><i style="width:84%"></i></span></div>').join('');

  const qsOf=(t,lu)=>`${lu}/query?where=${encodeURIComponent(t.where||'1=1')}`
    +`&outFields=*&returnGeometry=true&outSR=4326&resultRecordCount=2000&f=json`
    + (t.bbox? `&geometry=${encodeURIComponent(JSON.stringify({xmin:t.bbox[0],ymin:t.bbox[1],
        xmax:t.bbox[2],ymax:t.bbox[3],spatialReference:{wkid:4326}}))}`
      +`&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects` : '');

  /* 한 레이어 불러오기 — 먼저 바로 질의하고, 실패할 때만 메타를 뒤진다 */
  let srvDown=false;   /* 한 번이라도 응답 없음이면 같은 서버의 나머지 요청은 기다리지 않는다(총 대기 = FETCH_MS 한 번) */
  async function loadOne(t){
    const url=t.src.url;
    if(dataCache[url]) return;
    const why=[]; let timedOut=false;
    if(srvDown){ loadWhy[url]=[url+' → 응답 없음(서버에 연결되지 않음)']; dataCache[url]=[]; dataCache[url].__failed=true; return; }   /* 응답 없음(시간 초과)이면 서버에 못 닿는 상태 — 메타 조회로 더 기다리지 않는다 */
    const tryQuery=async cand=>{
      try{
        const res=await fetchT(qsOf(t,cand));
        const jj=await res.json();
        if(jj.error){ why.push(cand+' → '+(jj.error.message||JSON.stringify(jj.error))); return null; }
        if(!(jj.features||[]).length){ why.push(cand+' → 0건'); return null; }
        return {lu:cand, j:jj};
      }catch(e){ const to=e&&e.name==='AbortError'; if(to) timedOut=srvDown=true; why.push(cand+' → '+(to? '응답 없음('+Math.round(FETCH_MS/1000)+'초)' : String((e&&e.message)||e))); return null; }
    };

    let hit=null;
    const direct = /\/\d+$/.test(url)? url : (layerUrl[url]||url+'/0');
    hit=await tryQuery(direct);                       /* 1) 곧바로 질의 (가장 빠른 길) */

    if(!hit&&!timedOut){                               /* 2) 안 되면 그때 메타를 확인(응답 없음이면 생략) */
      const tries=[];
      const first=await resolveLayer(url, t.src.li);
      if(first&&first!==direct) tries.push(first);
      for(const c of await layerIds(url)){ const u=url+'/'+c;
        if(u!==direct&&tries.indexOf(u)<0) tries.push(u); }
      for(const au of [].concat(t.src.alt||[])){
        const a=await resolveLayer(au); if(a&&tries.indexOf(a)<0) tries.push(a);
        for(const c of await layerIds(au)){ const u=au+'/'+c; if(tries.indexOf(u)<0) tries.push(u); }
      }
      for(const cand of tries){ hit=await tryQuery(cand); if(hit) break; }
    }

    if(!hit){
      console.warn('[데이터 없음]',url); loadWhy[url]=why.slice();
      why.forEach(w=>console.warn('   ↳',w));
      dataCache[url]=[]; dataCache[url].__failed=true; return;   /* 실패 표시: 다음 그룹 진입 때 다시 받는다 */
    }

    const lu=hit.lu, j=hit.j, feats=j.features;
    layerUrl[url]=lu;
    if(DEBUG) console.log('[레이어 확정]',lu,feats.length,'건');
    const oidF=j.objectIdFieldName||'objectid';
    const gt=j.geometryType||'esriGeometryPoint';
    const shape = gt!=='esriGeometryPoint';
    t.kind = shape? (gt==='esriGeometryPolyline'?'line':'poly') : 'point';
    geomKind[url]=t.kind; oidField[url]=oidF;
    dataCache[url]=feats.map(f=>{
      const r=f.attributes;
      r.__oid=r[oidF];
      if(shape){ r.__line=true; return r; }
      let x=NaN, y=NaN;
      if(f.geometry&&isFinite(f.geometry.x)&&isFinite(f.geometry.y)){
        x=f.geometry.x; y=f.geometry.y;
      }else{
        x=parseFloat(pickVal(r,(t.fields&&t.fields.x)||F.x,true));
        y=parseFloat(pickVal(r,(t.fields&&t.fields.y)||F.y,true));
      }
      if(isFinite(x)&&isFinite(y)&&(Math.abs(x)>180||Math.abs(y)>90)){
        const lon=x/20037508.34*180;
        let lat=y/20037508.34*180;
        lat=180/Math.PI*(2*Math.atan(Math.exp(lat*Math.PI/180))-Math.PI/2);
        x=lon; y=lat;
        if(!geomWarned[url]){ geomWarned[url]=1;
          console.log('[좌표 변환]',url.split('/Hosted/')[1],'미터 좌표를 경위도로 변환했어요'); }
      }
      r.__x=x; r.__y=y; return r;
    }).filter(r=>r.__line||(isFinite(r.__x)&&isFinite(r.__y)&&r.__x>124&&r.__x<132&&r.__y>33&&r.__y<39));

    if(!dataCache[url].length){
      console.warn('[0건]',lu,'| 서버가 준 피처',feats.length,'| 좌표 없어 제외',feats.length-dataCache[url].length);
      const f0=feats[0];
      if(f0){
        console.warn('   ↳ 도형 종류:',j.geometryType,'| 첫 피처의 도형:',JSON.stringify(f0.geometry));
        console.warn('   ↳ 필드 이름:',Object.keys(f0.attributes||{}).join(', '));
      }
    }
    annotateDongs(dataCache[url]);
    renderChips();                                   /* 다 기다리지 않고 먼저 보여준다 */
    refresh();
  }

  /* 치안안심: 한 레이어를 받아 종류별 칩으로 (loadOne 은 이 함수 안의 지역 함수라 여기서 넘긴다 — 밖에서 부르면 ReferenceError 로 조용히 0건이 됨) */
  if(GROUPS[curGroup]&&GROUPS[curGroup].dyn) await buildDynThemes(curGroup,loadOne);
  /* 위에서 만든 jobs 는 함수 첫머리 기준이라, buildDynThemes 가 뒤에 붙인 테마(안심귀갓길 등)의 자료는 여기서 불러올 목록에 더한다 */
  Object.values(groupThemes(curGroup)).forEach(t=>{ if(t.src&&!dataCache[t.src.url]&&!jobs.some(j=>j.src.url===t.src.url)) jobs.push(t); });

  /* 여러 레이어를 동시에 (한 번에 최대 6개) */
  const queue=jobs.slice();
  const workers=Array.from({length:Math.min(6,queue.length)},async()=>{
    while(queue.length){
      const t=queue.shift();
      try{ await loadOne(t); }
      catch(e){ dataCache[t.src.url]=[]; dataCache[t.src.url].__failed=true; console.warn('[실패]',t.src.url,'|',String((e&&e.message)||e)); }
    }
  });
  await Promise.all(workers);

  /* 팝업에서 쓰는 보조 레이어(예: 버스 노선)는 화면을 붙잡지 않게 뒤에서 */
  for(const t of Object.values(themes)){
    if(!t.join||joinCache[t.join.url]) continue;
    (async()=>{
      try{
        const lu=await resolveLayer(t.join.url);
        const res=await fetch(`${lu}/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=4000&f=json`);
        const j=await res.json();
        joinCache[t.join.url]=(j.features||[]).map(f=>f.attributes);
        if(DEBUG) console.log('[조인]',lu,joinCache[t.join.url].length,'건');
      }catch(e){ joinCache[t.join.url]=[]; console.warn('[조인 실패]',t.join.url,String((e&&e.message)||e)); }
    })();
  }
  annotateDongs();
}

/* 칩·전체 건수 — 목록과 같은 기준: dedupeBy 가 있으면 대표 한 건씩만 센다(전기차: 충전기 수가 아니라 충전소 수) */
function countFor(t){
  const rows=rowsFor(t); if(!t.dedupeBy) return rows.length;
  const seen=new Set(); rows.forEach(r=>seen.add(String(pickVal(r,t.dedupeBy)||r.__oid))); return seen.size;
}
function rowsFor(t){
  if(!t.src||!dataCache[t.src.url]) return [];
  let rows=dataCache[t.src.url];
  if(t.bbox){ const b=t.bbox;
    rows=rows.filter(r=>r.__line||(r.__x>=b[0]&&r.__x<=b[2]&&r.__y>=b[1]&&r.__y<=b[3])); }
  if(!t.src.catField) return rows;
  const cv=t.src.catValue;
  return Array.isArray(cv)? rows.filter(r=>cv.includes(r[t.src.catField]))
                          : rows.filter(r=>r[t.src.catField]===cv);
}
function themeOf(r){ /* 행이 속한 테마명 (현재 그룹 기준) */
  for(const [k,t] of Object.entries(groupThemes(curGroup))){
    if(!t.src) continue;
    if(t.src.catField? r[t.src.catField]===t.src.catValue : dataCache[t.src.url]?.includes(r)) return k;
  } return null;
}

/* ════════ 칩 ════════ */
function renderChips(){
  const themes=groupThemes(curGroup);
  const readyTotal=Object.values(themes).filter(t=>t.src)
    .reduce((s,t)=>s+countFor(t),0);
  let html=`<button class="chip all ${curCat==='전체'?'on':''}" data-k="전체"><span class="seg-nm">전체</span><span class="cnt">${readyTotal||''}</span></button>`;
  html+=Object.entries(themes).filter(([k,t])=>!t.chipHide).map(([k,t])=>{
    const on=k===curCat, n=t.src?countFor(t):null;
    if(t.type==='link')
      return `<button class="chip link" data-k="${k}"><span class="dot" style="background:${t.c}"></span><span class="seg-nm">${t.short||k} ↗</span></button>`;
    if(!t.src)
      return `<button class="chip soon" data-k="${k}"><span class="dot" style="background:${t.c}"></span><span class="seg-nm">${t.short||k}</span><span class="lbl-soon">준비중</span></button>`;
    return `<button class="chip ${on?'on':''}" data-k="${k}"><img src="${symUrl(k)}" alt=""><span class="seg-nm">${t.short||k}</span><span class="cnt">${n??''}</span></button>`;
  }).join('');
  $('chips').innerHTML=html;
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>setCat(b.dataset.k));
  /* 범례 */
  $('pinLegend').innerHTML=Object.entries(themes).filter(([k,t])=>t.src&&!t.chipHide).map(([k,t])=>
    `<span><img src="${symUrl(k)}" alt="">${t.short||k}</span>`).join('');
}

/* ════════ 목록 ════════ */
function activeRows(forMap){
  const themes=groupThemes(curGroup);
  let out=[];
  const cur=curCat!=='전체'? themes[curCat] : null;
  const pair=cur? cur.pair : null;                 /* 목록·지도 모두 함께 */
  const mapPair=(forMap&&cur)? cur.mapPair : null; /* 지도에서만 함께 */
  Object.entries(themes).forEach(([k,t])=>{
    if(!t.src) return;
    if(curCat!=='전체'&&curCat!==k&&k!==pair&&k!==mapPair) return;
    rowsFor(t).forEach(r=>out.push({r,theme:k,t}));
  });
  const seen={};                                  /* dedupeBy가 있으면 대표 한 건만 */
  out=out.filter(o=>{
    const f=o.t.dedupeBy; if(!f) return true;
    const k=o.theme+'|'+String(pickVal(o.r,f)||o.r.__oid);
    if(seen[k]) return false; seen[k]=1; return true;
  });
  if(curDong) out=out.filter(o=>o.r.__line||o.r._dong===curDong);
  if(curQ){const q=curQ.toLowerCase();
    out=out.filter(o=>[NM(o.r,o.t),AV(o.r,o.t,'addr'),o.theme].join(' ').toLowerCase().includes(q));}
  return out;
}
function sortedRows(){
  const L=activeRows();
  const grp=o=>(curCat!=='전체'&&o.theme!==curCat)?1:0;                 /* 짝 테마는 뒤로 */
  const thin=o=>(valOK(NM(o.r,o.t))||valOK(AV(o.r,o.t,'addr')))?0:1;   /* 이름·주소 없는 건 뒤로 */
  const dateKey=o=>{ if(!o.t.sortKey) return null;
    const d=toDate(pickVal(o.r,o.t.sortKey)); return d? d.getTime() : null; };
  const rankOf=o=>{ try{ return o.t.sortRank? Number(o.t.sortRank(o.r,pickVal))||0 : 0; }catch(e){ return 0; } };
  if(sortMode==='dist'&&myLoc) L.sort((a,b)=>grp(a)-grp(b)||thin(a)-thin(b)||(a.r._d??1e12)-(b.r._d??1e12));
  else L.sort((a,b)=>{
    const g0=grp(a)-grp(b); if(g0) return g0;
    const t0=thin(a)-thin(b); if(t0) return t0;
    const r0=rankOf(a)-rankOf(b); if(r0) return r0;                  /* 테마가 정한 순서(예: 축제 진행중→예정→종료) */
    const ka=dateKey(a), kb=dateKey(b);
    if(ka!=null&&kb!=null&&ka!==kb) return kb-ka;                     /* 최신순 */
    return String(NM(a.r,a.t)||'').localeCompare(String(NM(b.r,b.t)||''),'ko');
  });
  return L;
}
function updateHint(){
  const n = activeRows().length;
  document.querySelectorAll('#pinLegend,.legend-toggle').forEach(el=>el.classList.toggle('single',curCat!=='전체'));
  $('statusHint').textContent = curCat==='전체'
    ? `${curGroup} ${n}곳`
    : `${curGroup} · ${curCat} ${n}곳`;
}

}

      +esc(String((e&&e.message)||e))+'</span></div>'; }

function syncLineLayers(){
  if(!FLCls||!mapObj) return;
  /* 웹맵에서 가져온 레이어 켜고 끄기 */
  Object.entries(wmLayers).forEach(([key,lyr])=>{
    const [gName,tName]=key.split('·');
    if(gName!==curGroup){ lyr.visible=false; return; }
    const cur=curCat!=='전체'? groupThemes(curGroup)[curCat] : null;
    const pair=cur?cur.pair:null, mp=cur?cur.mapPair:null;
    lyr.visible=(curCat==='전체'||curCat===tName||tName===pair||tName===mp);
  });
  const themes=groupThemes(curGroup);
  const cur=curCat!=='전체'? themes[curCat] : null;
  const pair=cur? cur.pair : null, mapPair=cur? cur.mapPair : null;
  Object.entries(themes).forEach(([name,t])=>{
    if(!t.src) return;
    if(t.overlay&&t.overlay.url){               /* 지도에만 깔리는 배경 폴리곤 (목록·팝업과 무관) */
      const on=t.overlay.url+'#ov';
      if(!lineLayers[on]){
        const ovRenderer = t.overlay.renderer || {type:"simple",
          symbol:{type:"simple-fill",color:hexA(t.c,.18),outline:{color:t.c,width:1.6}}};
        lineLayers[on]=new FLCls({url:t.overlay.url+'/0',
          outFields:t.overlay.field? [t.overlay.field] : [],
          popupEnabled:false,legendEnabled:false,renderer:ovRenderer});
        mapObj.add(lineLayers[on],1);
        clipToCity(lineLayers[on], t.overlay.url+'/0');   /* 전국 자료는 구리시 범위만 */
      }
      lineLayers[on].visible=(curCat==='전체'||curCat===name);
    }
    const kind=geomKind[t.src.url];
    const svc=!!t.svcSym;
    if(kind!=='line'&&kind!=='poly'&&!svc) return;
    if(!lineLayers[name]){
      const url=layerUrl[t.src.url]||(t.src.url+'/0');
      const opt={url,outFields:["*"],popupEnabled:false,legendEnabled:false};
      if(!svc){                                   /* 우리 색으로 그리는 선·면 */
        opt.renderer={type:"simple",symbol: kind==='line'
          ? {type:"simple-line",color:t.c,width:4,cap:"round",join:"round"}
          : {type:"simple-fill",color:hexA(t.c,.22),outline:{color:t.c,width:1.8}}};
        if(t.colorBy==='course'&&kind==='line'){    /* 코스마다 다른 색 */
          const fld=(oidField[t.src.url]&&null);    /* 실제 필드명은 아래에서 찾음 */
          const rows=rowsFor(t);
          const cand=['둘레길','코스','코스명','코스번호','노선번호','둘레길이름','길이름','노선명','명칭'];
          let useF=null;
          if(rows[0]){ const m=keysOf(rows[0]);
            for(const c of cand){ const n=c.toLowerCase().replace(/[_\s]/g,'');
              if(m[n]){ useF=m[n]; break; } } }
          if(useF){
            const seen={};
            rows.forEach(r=>{ const v=r[useF];
              if(valOK(v)&&!(v in seen)) seen[v]=courseColor(r,pickVal,t.c); });
            const infos=Object.keys(seen).map(v=>({value:v,label:String(v),
              symbol:{type:"simple-line",color:seen[v],width:4.5,cap:"round",join:"round"}}));
            if(infos.length) opt.renderer={type:"unique-value",field:useF,
              defaultSymbol:{type:"simple-line",color:t.c,width:4,cap:"round",join:"round"},
              uniqueValueInfos:infos};
          }
        }
      }else{                                      /* 레이어에 발행된 원래 심볼 사용 */
        const f=oidField[t.src.url]||'OBJECTID';
        const ids=rowsFor(t).map(r=>r.__oid).filter(v=>v!==undefined&&v!==null).slice(0,900);
        opt.definitionExpression = ids.length? `${f} IN (${ids.join(',')})` : `${f} < 0`;
      }
      lineLayers[name]=new FLCls(opt);
      if(svc){                                     /* 원본 심볼이 안 뜨면 우리 심볼로 대체 */
        lineLayers[name].when(()=>{ if(DEBUG) console.log('[원본 심볼 로드]',name); },
          e=>{ console.warn('[원본 심볼 실패 — 기본 심볼로 표시]',name,e);
               t.svcSym=false; lineLayers[name].visible=false; syncMap(); });
      }
      if(t.bbox&&!svc){                              /* 불러온 것만 그리기 */
        const ids=rowsFor(t).map(r=>r.__oid).filter(v=>v!==undefined&&v!==null).slice(0,1500);
        lineLayers[name].definitionExpression = ids.length? `OBJECTID IN (${ids.join(',')})` : 'OBJECTID < 0';
      }
      mapObj.add(lineLayers[name],2);
    }
    lineLayers[name].visible=(curCat==='전체'||curCat===name||name===pair||name===mapPair);
  });
  const ovUrls=new Set(Object.values(themes).filter(x=>x.overlay).map(x=>x.overlay.url+'#ov'));
  Object.keys(lineLayers).forEach(name=>{
    if(!themes[name]&&!ovUrls.has(name)) lineLayers[name].visible=false;
  });
}
/* 전국 단위 레이어를 구리시 범위 안으로 한정 */
async function clipToCity(layer,url){
  try{
    const rings=await getCityRings();
    let params;
    if(rings){
      params=`geometry=${encodeURIComponent(JSON.stringify({rings,spatialReference:{wkid:4326}}))}`
        +`&geometryType=esriGeometryPolygon`;
    }else{
      const e=CITY.extent;
      params=`geometry=${encodeURIComponent(JSON.stringify({xmin:e.xmin,ymin:e.ymin,xmax:e.xmax,ymax:e.ymax,
        spatialReference:{wkid:4326}}))}&geometryType=esriGeometryEnvelope`;
    }
    const res=await fetch(`${url}/query?${params}&inSR=4326&spatialRel=esriSpatialRelIntersects`
      +`&returnIdsOnly=true&f=json`);
    const j=await res.json();
    if(j.error) throw new Error(j.error.message);
    const f=j.objectIdFieldName||'OBJECTID';
    const ids=(j.objectIds||[]).slice(0,2000);
    layer.definitionExpression = ids.length? `${f} IN (${ids.join(',')})` : `${f} < 0`;
    if(DEBUG) console.log('[구리 범위 한정]',url,ids.length,'건');
  }catch(err){
    console.warn('[범위 한정 실패 — 레이어를 숨깁니다]',url,String((err&&err.message)||err));
    layer.visible=false;                            /* 전국이 다 뜨는 것보다 안 보이는 편이 낫다 */
  }
}

/* 선택한 코스·구역을 몇 번 깜박여 준다 */
/* 서버가 outSR을 무시하고 미터 좌표로 줄 때를 대비한 변환 */
function normGeom(geom){
  if(!geom) return geom;
  const parts=geom.paths||geom.rings;
  if(!parts||!parts.length) return geom;
  let big=false;
  outer: for(const part of parts){ for(const p of part){
    if(Math.abs(p[0])>180||Math.abs(p[1])>90){ big=true; break outer; } } }
  if(!big) return geom;
  const conv=p=>{
    const lon=p[0]/20037508.34*180;
    let lat=p[1]/20037508.34*180;
    lat=180/Math.PI*(2*Math.atan(Math.exp(lat*Math.PI/180))-Math.PI/2);
    return [lon,lat];
  };
  const out=parts.map(part=>part.map(conv));
  console.log('[좌표 변환] 미터 좌표 → 경위도로 변환했어요');
  return geom.paths? {paths:out} : {rings:out};
}
/* 구리시 경계 전체가 보이도록 되돌리기 */
async function resetView(why){
  for(let i=0;i<20&&!view;i++) await new Promise(r=>setTimeout(r,100));
  if(!view){ console.warn('[전체보기] 지도가 준비되지 않았어요',why); return false; }
  try{ await view.when(); }catch(e0){}               /* 준비 전 goTo 는 animation 오류를 낸다 */
  /* 구리시 범위(extent)를 지도에 맞춘다. 줌 숫자로 계산하면 배경 타일 체계(브이월드/바로e맵)에 따라 배율이 달라져
   * 구리시가 잘리므로, 범위 기준으로 맞추고(소수점 배율 허용) 실패할 때만 예전 줌 계산을 쓴다 */
  try{ await view.goTo(fitExtent(),{duration:600});
       console.log('[전체보기]',why,'배율',+view.zoom.toFixed(2),'| 축척 1:'+Math.round(view.scale)); return true; }
  catch(err){ console.warn('[전체보기] 범위 맞춤 실패',String((err&&err.message)||err)); }
  const f=cityFit(), cx=f.center[0], cy=f.center[1], z=f.zoom;
  try{ await view.goTo({center:[cx,cy],zoom:z},{duration:600});
       console.log('[전체보기]',why,'배율(줌 계산)',z); return true; }
  catch(err){ console.warn('[전체보기] 실패',String((err&&err.message)||err)); }
  try{ view.center=[cx,cy]; view.zoom=z; console.log('[전체보기] 직접지정',why); return true; }catch(e2){}
  return false;
}
/* 구리시 범위 + 여백 5% — 시작 화면·전체보기·동 전체가 함께 쓴다 (배경 타일 체계와 무관하게 범위를 맞춘다) */
function fitExtent(){
  const e=CITY.extent, mx=(e.xmax-e.xmin)*0.05, my=(e.ymax-e.ymin)*0.05;
  return asExtent({xmin:e.xmin-mx,xmax:e.xmax+mx,ymin:e.ymin-my,ymax:e.ymax+my});
}
/* goTo 에 넘길 실제 Extent 도형 — 일반 객체는 goTo 가 이동 대상으로 인식하지 않아 지도가 움직이지 않는다 */
function asExtent(o){
  if(!ExtentCls) throw new Error('Extent 모듈이 아직 없음');
  return new ExtentCls({xmin:o.xmin,ymin:o.ymin,xmax:o.xmax,ymax:o.ymax,spatialReference:{wkid:4326}});
}
/* 구리시 경계가 지도에 여유 있게 들어오는 중심·배율 (줌 계산 — 범위 맞춤이 실패할 때의 예비) */
function cityFit(){
  const e=CITY.extent;
  const cx=(e.xmin+e.xmax)/2, cy=(e.ymin+e.ymax)/2;
  const dx=Math.max(e.xmax-e.xmin,1e-4), dy=Math.max(e.ymax-e.ymin,1e-4);
  const W=(view&&view.width)||1200, H=(view&&view.height)||800, M=1.10;   /* 여백 10% */
  const cos=Math.cos(cy*Math.PI/180);
  const zx=Math.log2(360*W/(256*dx*M));
  const zy=Math.log2(360*H*cos/(256*dy*M));
  return {center:[cx,cy], zoom:Math.max(10,Math.min(15,Math.min(zx,zy)))};
}

}
function flashShape(geom,color){

function pickRow(el){

async function pick(row,fromMap){
  selectedRow=row; renderList(); syncMap();
  if(row.__line){ /* 선·면: 범위로 이동한 뒤 깜박임 */
    const t=themeOfRow(row);
    const lu=t&&layerUrl[t.src.url];
    if(!t||!lu){ console.warn('[선택 이동] 레이어 주소를 못 찾음',t&&t.short); }
    else{
      let done=false;
      try{
        const res=await fetch(`${lu}/query?objectIds=${row.__oid}&returnGeometry=true&outSR=4326&f=json`);
        const j=await res.json();
        if(j.error) throw new Error(j.error.message);
        const f=(j.features||[])[0];
        if(f&&f.geometry){
          const g=normGeom(f.geometry);
          const pts=[].concat(...(g.paths||g.rings||[]));
          if(pts.length){
            let xmin=180,xmax=-180,ymin=90,ymax=-90;
            pts.forEach(p=>{xmin=Math.min(xmin,p[0]);xmax=Math.max(xmax,p[0]);
              ymin=Math.min(ymin,p[1]);ymax=Math.max(ymax,p[1]);});
            const px=(xmax-xmin)*.25+.0015, py=(ymax-ymin)*.25+.0015;
            const ext={xmin:xmin-px,xmax:xmax+px,ymin:ymin-py,ymax:ymax+py,spatialReference:{wkid:4326}};
            const cx=(xmin+xmax)/2, cy=(ymin+ymax)/2;
            const span=Math.max(xmax-xmin,(ymax-ymin)*1.3,1e-4);
            /* 긴 코스는 전체를 다 담으면 너무 멀어 보여서 조금 더 당겨 본다 */
            let z=Math.log2(360/span)-0.4;
            if(span>0.02) z+=1.3;                       /* 2km 넘는 코스 */
            if(span>0.05) z+=0.7;                       /* 5km 넘는 코스 */
            z=Math.max(13,Math.min(17,Math.round(z)));
            console.log('[선택 이동]',t.short||'',{중심:[cx,cy],배율:z,
              원본SR:(f.geometry.spatialReference||j.spatialReference||{}).wkid});
            try{ await view.goTo({center:[cx,cy],zoom:z},{duration:600}); done=true; }
            catch(e0){ console.warn('[이동] 중심 실패',String((e0&&e0.message)||e0)); }
            if(!done) done=await moveToGeom(g,'코스 선택') || await moveTo(ext,'코스 선택');
          }
          setTimeout(()=>flashShape(g,t.c),120);
        }
      }catch(e){ console.warn('[선택 이동] 도형 조회 실패',String((e&&e.message)||e)); }
      if(!done){                                   /* 도형을 못 받으면 범위만이라도 */
        try{
          const r2=await fetch(`${lu}/query?objectIds=${row.__oid}&returnExtentOnly=true&outSR=4326&f=json`);
          const j2=await r2.json();
          let e2=j2.extent;
          if(e2&&Math.abs(e2.xmin)>180){                 /* 미터 좌표면 변환 */
            const cv=(x,y)=>{ const lon=x/20037508.34*180;
              let lat=y/20037508.34*180;
              lat=180/Math.PI*(2*Math.atan(Math.exp(lat*Math.PI/180))-Math.PI/2);
              return [lon,lat]; };
            const a=cv(e2.xmin,e2.ymin), b=cv(e2.xmax,e2.ymax);
            e2={xmin:a[0],ymin:a[1],xmax:b[0],ymax:b[1]};
            console.log('[좌표 변환] 범위도 경위도로 변환했어요');
          }
          if(e2&&isFinite(e2.xmin)){
            const px=(e2.xmax-e2.xmin)*.25+.0015, py=(e2.ymax-e2.ymin)*.25+.0015;
            const ext={xmin:e2.xmin-px,xmax:e2.xmax+px,ymin:e2.ymin-py,ymax:e2.ymax+py,
                       spatialReference:{wkid:4326}};
            await moveTo(ext,'코스 범위');
          }else console.warn('[선택 이동] 범위 조회도 실패');
        }catch(e5){ console.warn('[선택 이동] 범위 조회 오류',String((e5&&e5.message)||e5)); }
      }
    }
  }else{
    const cz=view&&isFinite(view.zoom)?view.zoom:13;
    await view.goTo({center:[row.__x,row.__y],zoom:Math.max(cz,17)},{duration:550}).catch(()=>{});
    pulseAt(row.__x,row.__y);
  }
  showInfo(row);
  if(!fromMap&&isMobile()) setSheet('peek');
}

function routeLabel(row,t,name,addr){

/* ── 요일별 운영시간(약국식 필드: 월요일_시작 / 월요일_종료) ── */
const DAYNM=['일','월','화','수','목','금','토'];
function tMin(v){
  if(!valOK(v)) return null;
  const s=String(v).replace(/[:\s]/g,'');
  if(s==='휴무'||s.length<3) return null;
  const n=Number(s);
  if(!isFinite(n)) return null;
  return Math.floor(n/100)*60+(n%100);
}
function tFmt(m){ return m==null? '' : String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function tRange(r,pv,day){
  const a=tMin(pv(r,[day+'요일_시작',day+'요일시작'],true)),
        b=tMin(pv(r,[day+'요일_종료',day+'요일종료'],true));
  return (a==null||b==null)? '휴무' : tFmt(a)+' ~ '+tFmt(b);
}
function holRange(r,pv){
  const a=tMin(pv(r,['공휴일_시작','공휴일시작'],true)), b=tMin(pv(r,['공휴일_종료','공휴일종료'],true));
  return (a==null||b==null)? '휴무' : tFmt(a)+' ~ '+tFmt(b);
}
/* 오늘 기준 영업 상태 */
function weekStatus(r,pv){
  const now=new Date(), wd=now.getDay(), cur=now.getHours()*60+now.getMinutes();
  const d=DAYNM[wd];
  const s=tMin(pv(r,[d+'요일_시작',d+'요일시작'],true)), e=tMin(pv(r,[d+'요일_종료',d+'요일종료'],true));
  if(s==null||e==null) return {k:'off',t:'오늘('+d+') 휴무'};
  const open = e>=s ? (cur>=s&&cur<e) : (cur>=s||cur<e);
  if(open) return {k:'on',t:'지금 영업중 · '+tFmt(e)+' 까지'};
  if(cur<s) return {k:'pre',t:tFmt(s)+' 영업 시작'};
  return {k:'off',t:'오늘 영업 종료'};
}
/* 주말·공휴일·야간 마크 */
function weekChips(r,pv){

/* 요일별 시간표 (평일이 모두 같으면 한 줄) */
function weekTable(r,pv,c){
  const wd=new Date().getDay();
  const line=(lbl,txt,hl)=>`<div class="kv"><span class="k" style="${hl?`color:${c};font-weight:800`:''}">${lbl}</span>`
    +`<span class="v" style="${txt==='휴무'?'color:var(--faint)':''}${hl?`;color:${c};font-weight:800`:''}">${txt}</span></div>`;
  const wk=tRange(r,pv,'월');
  const same=['화','수','목','금'].every(d=>tRange(r,pv,d)===wk);
  let out='';
  if(same) out+=line('평일',wk,wd>=1&&wd<=5);
  else ['월','화','수','목','금'].forEach((d,i)=>{ out+=line(d,tRange(r,pv,d),wd===i+1); });
  out+=line('토',tRange(r,pv,'토'),wd===6);
  out+=line('일',tRange(r,pv,'일'),wd===0);
  out+=line('공휴일',holRange(r,pv),false);
  return out;
}
/* ── 전기차 충전소: 같은 충전소의 충전기 집계 ── */
function evStat(r,pv,t){
  const sid=pv(r,['충전소id','충전소ID','충전소코드']);
  const sibs=(valOK(sid)? rowsFor(t).filter(b=>String(pv(b,['충전소id','충전소ID','충전소코드']))===String(sid)) : [r]);
  let total=0,avail=0,fastN=0,fastA=0,slowN=0,slowA=0,newest=null;
  const list=[];
  sibs.forEach(b=>{
    total++;
    const st=String(pv(b,['충전상태','상태'])||'');
    const kw=Number(pv(b,['충전용량_kw','충전용량_kW','충전용량','용량'])||0);
    const typ=String(pv(b,['충전기타입','충전방식','기종'])||'');
    const fast= kw>=30 || typ.toUpperCase().indexOf('DC')>-1 || /급속/.test(typ);
    if(fast){ fastN++; if(st==='충전대기') fastA++; } else { slowN++; if(st==='충전대기') slowA++; }
    if(st==='충전대기') avail++;
    const upd=toDate(pv(b,['상태갱신일시']));
    if(upd&&(!newest||upd>newest)) newest=upd;
    list.push({id:pv(b,['충전기id','충전기ID','충전기번호']),fast,kw,st,
               upd:upd, endT:toDate(pv(b,['마지막충전종료'])), nowT:evNowStart(b,pv,st)});
  });
  list.sort((a,b)=>String(a.id).localeCompare(String(b.id),'ko',{numeric:true}));
  return {total,avail,fastN,fastA,slowN,slowA,list,newest};
}
/* 충전중인 충전기의 '언제부터' 시각. 환경부 자료의 '충전중시작'(nowTsdt)은 이전 세션 값이 남거나 9시간 앞선(미래) 값이 섞여 믿기 어려워,
   '마지막충전시작'(lastTsdt — 상태갱신일시와 맞아떨어짐)을 먼저 쓰고 없을 때만 '충전중시작'. 미래이거나 '마지막충전종료'보다 앞이면(이미 끝난 세션) 버린다 */
const EV_NOW_MAX_H=24;   /* 이보다 오래 '충전중'이면 지난 세션 값이 남은 것으로 보고 '몇 시간째'를 숨긴다 */
function evNowStart(b,pv,st){
  if(st!=='충전중') return null;
  const end=toDate(pv(b,['마지막충전종료'])), upd=toDate(pv(b,['상태갱신일시']));
  const cands=[toDate(pv(b,['마지막충전시작'])), toDate(pv(b,['충전중시작']))];
  const ok=d=>{
    if(!d) return false;
    const ms=d.getTime(), now=Date.now();
    if(ms>now+5*60000) return false;                      /* 미래 값(시간대 중복 변환 등) */
    if(end&&ms<end.getTime()) return false;               /* 종료 시각보다 앞 = 지난 세션 */
    if(upd&&ms>upd.getTime()+10*60000) return false;      /* 상태를 받은 시각보다 뒤 = 그 상태와 무관한 값 */
    if(now-ms>EV_NOW_MAX_H*3600000) return false;          /* 하루 넘게 '충전중'은 지난 세션 값일 가능성이 큼 */
    return true;
  };
  const good=cands.filter(ok);
  if(!good.length) return null;
  return good.reduce((a,b)=>b>a? b : a);                  /* 둘 다 맞으면 더 늦은 쪽(현재 세션에 가까운 값) */
}
/* 전기차 자료를 '확인한' 시각: 스케줄 작업이 넣어 주는 수집일시 항목이 있으면 그 최댓값, 없으면 전체 충전기의 상태갱신일시 최댓값
   (322곳 중 어디선가 15분 안에 상태가 바뀌므로 수집 시각과 거의 같다). 자료 묶음마다 한 번만 계산해 둔다 */
const EV_SYNC_FIELDS=['수집일시','수집시각','데이터수집일시','데이터갱신일시','갱신일시','sync_dt','collected_at'];
const _evSync=new WeakMap(), _evSyncKind=new WeakMap();
/* 자료의 시각: 레이어에 수집 시각 항목(EV_SYNC_FIELDS)이 있으면 그것(= 스케줄이 확인한 시각, kind 'sync'),
   없으면 충전기 '상태갱신일시'의 최댓값(= 가장 최근에 상태가 바뀐 시각, kind 'status' — 스케줄이 돌아도 상태가 안 바뀌면 그대로라 '확인'이 아니다) */
function evSyncTime(t){
  const rows=(t&&t.src&&dataCache[t.src.url])||null; if(!rows||!rows.length) return null;
  if(_evSync.has(rows)) return _evSync.get(rows);
  let best=null, viaSync=false;
  rows.forEach(r=>{ const v=pickVal(r,EV_SYNC_FIELDS,true); const d=toDate(v); if(d){ viaSync=true; if(!best||d>best) best=d; } });
  if(!viaSync) rows.forEach(r=>{ const d=toDate(pickVal(r,['상태갱신일시'],true)); if(d&&(!best||d>best)) best=d; });
  _evSync.set(rows,best); _evSyncKind.set(rows,viaSync?'sync':'status'); return best;
}
function evSyncKind(t){ const rows=(t&&t.src&&dataCache[t.src.url])||null; if(!rows) return null; evSyncTime(t); return _evSyncKind.get(rows)||null; }
/* 시각 한 줄: 수집 시각이면 "n분 전 확인", 상태 변경 시각이면 "마지막 상태 변경 n분 전" */
function evWhenTxt(t,long){
  const sync=evSyncKind(t)==='sync';
  if(!sync) return long? `상태는 ${EV_SYNC_EVERY_MIN}분마다 새로 받아요` : null;   /* 상태 변경 시각은 보여 주지 않는다(담당자 요청) */
  const ago=agoTxt(evSyncTime(t)); if(!ago) return null;
  return long? `${ago} 확인 · ${EV_SYNC_EVERY_MIN}분마다 갱신돼요` : `${ago} 확인`;
}
const EV_STALE_MIN=EV_SYNC_EVERY_MIN*3;   /* 스케줄이 세 번 넘게 밀리면 지연 경고(수집 시각이 있을 때만) */
function evStale(d,t){ if(t&&evSyncKind(t)!=='sync') return false; return !!d && (Date.now()-d.getTime())/60000 > EV_STALE_MIN; }   /* 상태 변경 시각으로는 지연을 판단할 수 없다 */
/* 언제부터 계속되는지 사람 말로 (충전중 · 1시간째) */
function sinceTxt(d){
  if(!d) return null;
  const m=Math.round((Date.now()-d.getTime())/60000);
  if(m<1) return '방금 시작';
  if(m<60) return m+'분째';
  const hh=Math.floor(m/60);
  if(hh<24) return hh+'시간째';
  return Math.floor(hh/24)+'일째';
}
/* 몇 분 전인지 사람 말로 */
function agoTxt(d){
  if(!d) return null;
  const m=Math.round((Date.now()-d.getTime())/60000);

      for(const k in row){
        const v=row[k];
        if(typeof v==='string' && /https?:\/\/[^\s;,]+\.(jpg|jpeg|png|gif)/i.test(v)){ raw=v; break; }
      }
    }
    if(valOK(raw)){
      const list=String(raw).split(/[\n;,\s]+/).map(s=>s.trim())
        .filter(s=>/^https?:\/\//.test(s)).slice(0,8)
        .map(u=>location.protocol==='https:'? u.replace(/^http:\/\//,'https://') : u);
      if(list.length)
        photo=`<div class="pgal">`+list.map(u=>
          `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.style.display='none'">`).join('')+`</div>`;
      else if(DEBUG) console.log('[사진] 주소 형식이 아님:',String(raw).slice(0,120));
    }else if(DEBUG) console.log('[사진] 필드를 못 찾음 — 있는 필드:',Object.keys(row).join(', '));
  }
  if(!photo && t.photo){
    const v=pickVal(row,t.photo.f); mark(t.photo.f);
    if(valOK(v)){
      let src=String(v).trim();
      if(!/^https?:\/\//.test(src)) src=(t.photo.base||'')+src;
      if(location.protocol==='https:') src=src.replace(/^http:\/\//,'https://');
      if(src) photo=`<img class="pimg" src="${esc(src)}" alt=""${t.photoH?` style="height:${t.photoH}px"`:''} onerror="this.style.display='none'">`;
    }
  }

  /* 같은 곳의 다른 항목 (예: 충전소의 충전기) */
  let rel='';
  if(t.related){
    const key=pickVal(row,t.related.by); mark(t.related.by);
    if(valOK(key)){
      const sib=rowsFor(t).filter(b=>String(pickVal(b,t.related.by))===String(key));
      if(sib.length>1||t.related.always){
        rel=`<div class="rel"><div class="ttl">${esc(t.related.title||'같은 곳의 다른 항목')}</div>`;
        sib.slice(0,10).forEach(b=>{
          const k=pickVal(b,t.related.cols[0])||'';
          const v=t.related.cols.slice(1).map(c=>pickVal(b,c)).filter(valOK).join(' · ');
          rel+=`<div class="ri"><span class="rk" style="background:var(--accent)">${esc(String(k))}</span><span class="rv">${esc(v)}</span></div>`;
        });
        rel+='</div>';
      }
    }
  }

  /* 다른 레이어와 연결 (예: 정류장 경유 노선) */
  let joined='';
  if(t.join&&!t.join.custom&&joinCache[t.join.url]){
    const key=pickVal(row,t.join.mine); mark(t.join.mine);
    if(valOK(key)){
      const hit=joinCache[t.join.url].filter(b=>String(pickVal(b,t.join.key))===String(key));
      if(hit.length){
        joined=`<div class="rel"><div class="ttl">${esc(t.join.title||'연결 정보')}</div>`;
        hit.slice(0,15).forEach(b=>{
          const k=pickVal(b,t.join.cols[0])||'';
          const v=t.join.cols.slice(1).map(c=>pickVal(b,c)).filter(valOK).join(' · ');
          joined+=`<div class="ri"><span class="rk" style="background:var(--accent)">${esc(String(k))}</span><span class="rv">${esc(v)}</span></div>`;
        });
        joined+='</div>';
      }
    }
  }

  $('infocard').innerHTML=popIconize(`
    <div class="hd">
      ${ic?`<div class="hd-ic"><img src="${ic}" alt=""></div>`:''}
      <div class="hd-tx"><div class="cat">${esc(catTx)}</div><div class="nm">${esc(name)}</div></div>
      <button class="close" onclick="hideInfo()" aria-label="닫기">✕</button>
    </div>
    <div class="bd">
      ${t.photoBelow?'':photo}
      ${st||chips?`<div class="chips">${st?`<span class="st ${st.k}" style="padding:4px 11px">${st.t}</span>`:''}${chips}</div>`:''}
      ${guide?`<div class="guide" style="background:var(--accent-soft);color:var(--accent)">💡 ${guide}</div>`:''}
      ${t.photoBelow?photo:''}
      ${rel}${joined}
      ${hrs?`<div class="pcard hrs">${t.cardTitle===''?'':`<div class="ttl">${esc(t.cardTitle||'⏰ 운영시간')}</div>`}${hrs}</div>`:''}
      ${(addr||tel||kv)?`<div class="pcard">
        ${addr?`<div class="ttl">${esc(t.addrTitle||'📍 주소')}</div>
          <div>${esc(shortAddr(String(addr)))}
            ${looksAddr(addr)?`<button class="copy-btn" onclick="copyAddr(this,'${esc(String(addr)).replace(/'/g,"\\'")}')">복사</button>`:''}</div>
          ${addr2&&String(addr2)!==String(addr)?`<div class="addr2">${esc(shortAddr(String(addr2)))}</div>`:''}`:''}
        ${tel?`<div class="ttl" style="margin-top:${addr?'10px':'0'}">${esc(t.telTitle||'📞 전화')}</div>
          <a class="row-tel" style="color:var(--accent)" href="tel:${telClean}">${esc(String(tel))}</a>`:''}
        ${kv?`<div style="margin-top:${(addr||tel)?'10px':'0'}">${kv}</div>`:''}
      </div>`:''}
      ${!isShape&&myLoc&&isFinite(row.__x)?`<div class="kv" style="margin-bottom:9px"><span class="k">🚶 거리</span><span class="v"><b>${fmtDist(haversine(myLoc.x,myLoc.y,row.__x,row.__y))}</b></span></div>`:''}
      <div class="btnstack">
        ${telClean?`<a class="btn-tel" href="tel:${telClean}">📞 ${esc(t.telLabel||(short+'에 전화하기'))}</a>`:''}
        ${links}
        ${!isShape?`<a class="btn-nv" target="_blank" rel="noopener" href="${nvRoute}">🧭 네이버 지도에서 길찾기</a>`:''}
        ${t.foot?`<div class="foot">${esc(t.foot)}</div>`:''}
      </div>
    </div>`);
  $('infocard').classList.add('open');
  }catch(err){
    console.warn('[팝업 오류]',themeName,err);
    $('infocard').innerHTML=popIconize(`<div class="hd">
      <div class="hd-tx"><div class="cat">${esc(themeName)}</div><div class="nm">${esc(String(NM(row,t)||'-'))}</div></div>
      <button class="close" onclick="hideInfo()" aria-label="닫기">✕</button></div>
      <div class="bd"><div class="line">정보를 표시하는 중 문제가 있었어요.</div></div>`);
    $('infocard').classList.add('open');
  }finally{ _hideKeys=null; }
}
function hexS(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function hideInfo(){ $('infocard').classList.remove('open');
  if(selectedRow){ selectedRow=null; renderList(); syncMap(); } }
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideInfo();});

/* ── 모바일 바텀시트: peek(목록 살짝) / half / full 3단 스냅 ── */
const isMobile=()=>matchMedia('(max-width:900px)').matches;
function setSheet(state){ /* 'min'(손잡이만)|'peek'(목록 살짝)|'half'|'full' */
  const p=$('panel'); if(!isMobile()) return;
  p.classList.remove('min','half','full','dragging'); p.style.transform='';
  if(state==='half') p.classList.add('half');
  else if(state==='full') p.classList.add('full');
  else if(state==='min') p.classList.add('min');
}
(function sheetDrag(){
  const p=$('panel'), h=$('sheetHandle');
  let startY=0, startT=0, cur=0;
  function curTranslate(){
    const m=getComputedStyle(p).transform;
    if(m==='none') return 0;
    return new DOMMatrixReadOnly(m).m42;
  }
  h.addEventListener('touchstart',e=>{
    if(!isMobile()) return;
    startY=e.touches[0].clientY; startT=curTranslate();
    p.classList.add('dragging');
  },{passive:true});
  h.addEventListener('touchmove',e=>{
    if(!isMobile()) return;
    cur=Math.max(0,startT+(e.touches[0].clientY-startY));
    p.style.transform=`translateY(${cur}px)`;
  },{passive:true});
  h.addEventListener('touchend',()=>{
    if(!isMobile()) return;
    const H=p.getBoundingClientRect().height;
    const snaps=[['full',0],['half',H*0.42],['peek',H-206],['min',H-54]];   /* 아래로 더 끌면 손잡이만 남는다 */
    let best='half',bd=1e9;
    snaps.forEach(([k,v])=>{const d=Math.abs(cur-v); if(d<bd){bd=d;best=k;}});
    setSheet(best);
  });
  /* 손잡이 누르기: 최소 ↔ 목록 살짝. 더 보려면 끌어 올린다 */
  h.addEventListener('click',()=>{ if(!isMobile()) return;
    setSheet(p.classList.contains('min')? 'peek' : 'min'); });
})();
</script>
