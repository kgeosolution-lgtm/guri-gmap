<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 지도 · 구리시 G-MAP</title>
<meta property="og:title" content="구리시 G-MAP 3D 지도">
<meta property="og:description" content="건물과 지형을 3D로 돌려 보며 구리의 모습을 입체적으로 살펴보세요.">
<meta property="og:type" content="website">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="gmap-shared.css">
<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
<link rel="stylesheet" href="/styles/site-shell.css">
<style>
:root{
  --brand:var(--krds-color-light-primary-50,#018058); --brand-hover:var(--krds-color-light-primary-60,#01573C); --brand-soft:var(--krds-color-light-primary-5,#edf4f0);
  --accent:var(--krds-color-light-primary-50,#018058);
  --ink:var(--krds-color-light-gray-90,#1e2124); --sub:var(--krds-color-light-gray-60,#58616a); --faint:var(--krds-color-light-gray-40,#8a949e); --line:var(--krds-color-light-gray-10,#e6e8ea);
  --gray20:var(--krds-color-light-gray-20,#cdd1d5); --gray70:var(--krds-color-light-gray-70,#464c53);
  --shadow:0 2px 10px rgba(30,50,41,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#dfe8f2;font-family:var(--krds-font-family-base,'Pretendard GOV',Pretendard,'Noto Sans KR',sans-serif);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.main{position:relative;height:calc(100dvh - 57px);min-height:420px;overflow:hidden}
#map{position:absolute;inset:0}
.esri-view .esri-view-surface--touch-none:focus::after{outline:none}
.esri-ui .esri-attribution{font-size:11px}

/* 우상단 컨트롤 (테마지도·항공사진과 같은 결) */
.map-ctl{position:absolute;right:12px;top:12px;z-index:6;display:flex;flex-direction:column;gap:6px}
.map-ctl button{width:34px;height:34px;border-radius:6px;background:#fff;border:1px solid var(--gray20);display:grid;place-items:center;color:var(--gray70);box-shadow:var(--shadow);transition:all .13s}
.map-ctl button:hover,.map-ctl button.is-on{color:var(--accent);border-color:var(--accent)}
.map-ctl button.is-on{background:var(--brand-soft)}
.map-ctl button svg{width:18px;height:18px}
.map-ctl .sep{height:4px}
.map-toast{position:absolute;left:50%;transform:translateX(-50%);bottom:130px;background:#1E3229;color:#fff;font-size:13px;padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:calc(100% - 32px);text-align:center}
.map-toast.show{opacity:1}

/* 좌상단 안내 배지 */
.hint{position:absolute;left:12px;top:12px;z-index:6;background:rgba(255,255,255,.92);border:1px solid var(--gray20);border-radius:8px;box-shadow:var(--shadow);padding:8px 12px;font-size:12px;color:var(--sub);max-width:min(340px,calc(100% - 70px));backdrop-filter:blur(6px)}
.hint b{color:var(--ink);font-size:13px;display:block;margin-bottom:2px}
.hint kbd{font-family:inherit;background:#f1f3f5;border:1px solid var(--gray20);border-radius:4px;padding:0 5px;font-size:11px}

/* 하단 바: 장소 바로가기(슬라이드) + 보기 설정 */
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:7;background:#fff;border:1px solid var(--gray20);border-radius:8px;box-shadow:var(--shadow);padding:10px 14px 12px;max-width:calc(100% - 24px);width:max-content;min-width:min(520px,calc(100% - 24px))}
.bar-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bar-title{font-weight:700;font-size:14px;white-space:nowrap}
.bar-hint{font-size:12px;color:var(--sub);flex:1;min-width:0}
.bar-opts{display:flex;gap:10px;margin-left:auto;font-size:13px;white-space:nowrap}
.bar-opts label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.bar-opts input{width:15px;height:15px;accent-color:var(--brand)}
.slides{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.slides::-webkit-scrollbar{display:none}
.slide{flex:none;height:34px;padding:0 11px 0 6px;border-radius:6px;border:1px solid var(--gray20);background:#fff;font-size:13px;font-weight:600;color:var(--gray70);display:inline-flex;align-items:center;gap:7px;transition:all .13s}
.slide img{width:34px;height:24px;object-fit:cover;border-radius:4px;background:#e9eef4}
.slide:hover{border-color:var(--brand);color:var(--brand)}
.slide.is-on{background:var(--brand);border-color:var(--brand);color:#fff}
.slide.tour{background:var(--brand-soft);color:var(--brand-hover);border-color:transparent}
.slide.tour.is-on{background:var(--brand);color:#fff}
.slides:empty+.bar-empty{display:block}
.bar-empty{display:none;font-size:12px;color:var(--faint)}

/* 로딩·오류 덮개 */
.cover{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#e9f0f7,#dfe8f2);transition:opacity .35s}
.cover.hide{opacity:0;pointer-events:none}
.cover .box{background:#fff;border:1px solid var(--gray20);border-radius:12px;box-shadow:var(--shadow);padding:22px 26px;max-width:min(420px,calc(100% - 32px));text-align:center}
.cover .box b{display:block;font-size:16px;margin-bottom:6px}
.cover .box p{font-size:13px;color:var(--sub);line-height:1.6}
.cover .box a,.cover .box button{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin:12px 4px 0;padding:9px 14px;border-radius:6px;font-size:13px;font-weight:700;text-decoration:none}
.cover .box .go{background:var(--brand);color:#fff}
.cover .box .alt{border:1px solid var(--gray20);color:var(--gray70)}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid #dbe4ee;border-top-color:var(--brand);margin:0 auto 12px;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cover.err .spin{display:none}

/* 팝업 카드 — 테마지도 infocard 와 같은 구성 (네이버 길찾기 제외) */
.infocard{position:absolute;left:12px;top:12px;width:min(360px,calc(100% - 24px));max-height:calc(100% - 150px);overflow-y:auto;
  background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 26px rgba(34,48,63,.18);z-index:12;display:none;
  --accent:#018058;--accent-soft:#0180581A;font-size:13px;line-height:1.5}
.infocard.open{display:block;animation:up .2s ease}
.main.card-open .hint{display:none}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.infocard .hd{padding:13px 15px 10px;color:#fff;position:relative;background:var(--accent)}
.infocard .hd .cat{font-size:11px;font-weight:800;opacity:.92}
.infocard .hd .nm{font-size:17px;font-weight:800;margin-top:2px;padding-right:26px;word-break:keep-all}
.infocard .close{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,.25);color:#fff;font-size:13px;display:grid;place-items:center}
.infocard .bd{padding:12px 15px 14px}
.infocard .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.infocard .pchip{font-size:11px;font-weight:700;border-radius:6px;padding:3px 9px;background:#EEF2F0;color:#4A5A53}
.infocard .st{display:inline-flex;align-items:center;height:auto;padding:4px 11px;border-radius:4px;font-size:10.5px;font-weight:800;white-space:nowrap}
.st.live{background:#fde8ec;color:#b3234a}.st.soon{background:#FCF1DC;color:#B77410}.st.plan{background:#EEF1F4;color:#5b6770}.st.done,.st.off{background:var(--line);color:var(--sub)}
.infocard .pgal{display:flex;gap:7px;overflow-x:auto;margin-bottom:9px;padding-bottom:3px;scrollbar-width:thin}
.infocard .pgal img{height:170px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:#EEF2F0}
.infocard .pgal img:only-child{width:100%}
.infocard .guide{border-radius:6px;padding:11px 13px;font-size:12.5px;font-weight:700;line-height:1.55;text-align:center;margin-bottom:9px;word-break:keep-all;background:var(--accent-soft);color:var(--accent)}
.infocard .pcard{background:#F5F8F6;border-radius:6px;padding:11px 13px;margin-bottom:9px}
.infocard .pcard .ttl{font-size:11.5px;font-weight:800;color:var(--sub);margin-bottom:7px;display:flex;gap:5px;align-items:center}
.infocard .kv{display:flex;gap:9px;font-size:13px;line-height:1.55;margin-bottom:4px}
.infocard .kv .k{flex:none;min-width:52px;color:var(--faint);font-size:12px;font-weight:700}
.infocard .kv .v{flex:1;color:var(--ink);word-break:break-word}
.infocard .kv:last-child{margin-bottom:0}
.infocard .row-tel{font-size:15px;font-weight:800;text-decoration:none;color:var(--accent)}
.infocard .copy-btn{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 8px;margin-left:6px}
.infocard .btnstack{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.infocard .btnstack a{text-align:center;font-size:14px;font-weight:800;border-radius:6px;padding:12px 0;text-decoration:none}
.infocard .btn-tel{background:var(--accent);color:#fff}
.infocard .btn-alt{background:#fff;border:1.5px solid var(--line);color:var(--sub)}
.infocard .foot{font-size:11px;color:var(--faint);text-align:center;margin-top:9px;line-height:1.5}

@media (max-width:640px){
  .hint{display:none}
  .infocard{left:8px;right:8px;width:auto;top:8px;max-height:calc(100% - 130px)}
  .bar{left:8px;right:8px;transform:none;width:auto;max-width:none;min-width:0;bottom:8px;padding:8px 10px 10px}
  .bar-hint{display:none}
  .bar-opts{margin-left:0;font-size:12px}
  .slide{height:32px;font-size:12px}
  .map-toast{bottom:120px}
  .map-ctl{top:auto;bottom:130px}
}
</style>
</head>
<body>

<header class="service-header map topbar"><div class="service-header-inner"><a class="service-brand" href="/" aria-label="G-MAP 구리시 시민생활지도 홈"><img src="/images/guri-emblem.png" alt="" width="50" height="41"><span><b>G-MAP</b><small>구리시 시민생활지도</small></span></a><span class="service-page-name">3D 지도</span><nav class="service-nav" aria-label="주 메뉴"><a href="/maps/theme.html?group=%EC%97%AC%EB%A6%84" >테마지도</a><a href="/maps/animal.html" >유기동물 찾기</a><a href="/maps/scene.html" aria-current="page">3D 지도</a><a href="/maps/aerial.html" >시계열 항공사진</a><a href="/#about">G-MAP 소개</a></nav><a class="service-search" href="/#search">테마 찾기 <span aria-hidden="true">↗</span></a><details class="service-mobile"><summary aria-label="메뉴 열기·닫기"><span></span><span></span></summary><nav aria-label="모바일 주 메뉴"><a href="/maps/theme.html?group=%EC%97%AC%EB%A6%84" >테마지도</a><a href="/maps/animal.html" >유기동물 찾기</a><a href="/maps/scene.html" aria-current="page">3D 지도</a><a href="/maps/aerial.html" >시계열 항공사진</a><a href="/#about">G-MAP 소개</a><a href="/#search">테마 찾기</a></nav></details></div></header>

<div class="main" id="main">
  <div id="map"></div>
  <div class="hint" id="hint"><b>3D 구리 둘러보기</b>드래그로 이동 · 마우스 휠로 확대 · <kbd>우클릭 드래그</kbd> 또는 <kbd>Ctrl</kbd>+드래그로 회전·기울이기</div>
  <div class="map-ctl">
    <button type="button" title="확대" aria-label="확대" onclick="zoomBy(1)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
    <button type="button" title="축소" aria-label="축소" onclick="zoomBy(-1)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <div class="sep"></div>
    <button type="button" id="btnTilt" title="위에서 보기 / 비스듬히 보기" aria-label="위에서 보기 / 비스듬히 보기" onclick="toggleTilt()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l9 4 9-4"/><path d="M3 12l9 4 9-4"/><path d="M12 3l9 4-9 4-9-4z"/></svg></button>
    <button type="button" title="북쪽 맞추기" aria-label="북쪽 맞추기" onclick="faceNorth()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v3"/><path d="M14.5 14.5L12 7l-2.5 7.5 2.5-1.5z" fill="currentColor"/></svg></button>
    <button type="button" title="내 위치" aria-label="내 위치" onclick="locate()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M20 12h2"/><path d="M2 12h2"/></svg></button>
    <button type="button" title="처음 화면" aria-label="처음 화면" onclick="goHome()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></svg></button>
    <button type="button" title="공유하기" aria-label="공유하기" onclick="shareUrl()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.7 10.7l6.6 -3.4"/><path d="M8.7 13.3l6.6 3.4"/></svg></button>
  </div>

  <div class="bar" id="bar" role="group" aria-label="장소 바로가기와 보기 설정">
    <div class="bar-head">
      <span class="bar-title">3D 구리</span>
      <span class="bar-hint" id="barHint">장소를 누르면 그곳으로 날아가요</span>
      <span class="bar-opts">
        <label><input type="checkbox" id="optShadow" checked> 그림자</label>
        <label><input type="checkbox" id="optEvening"> 저녁 빛</label>
      </span>
    </div>
    <div class="slides" id="slides"></div>
    <div class="bar-empty">저장된 장소가 없어요. 지도를 직접 돌려가며 둘러보세요.</div>
  </div>

  <div class="cover" id="cover"><div class="box"><div class="spin"></div><b id="coverTitle">3D 지도를 불러오는 중…</b><p id="coverText">건물과 지형 자료를 준비하고 있어요. 잠시만 기다려 주세요.</p><div id="coverActions"></div></div></div>
  <div class="infocard" id="infocard" role="dialog" aria-label="장소 정보"></div>
  <div class="map-toast" id="mapToast"></div>
</div>

<script src="https://js.arcgis.com/4.29/"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   구리시 G-MAP · 3D 지도
   구리시 포털 웹씬(b5e573a0…)을 SceneView 로 열고, 시민이 보기 좋게 조명·그림자·대기 효과를 더한다.
   ═══════════════════════════════════════════════════════════ */
const SCENE={
  portalUrl:'https://www.guri.go.kr/gmap',
  itemId:'b5e573a06e7f4195bb2f092aad19b253',
  viewerUrl:'https://www.guri.go.kr/gmap/home/webscene/viewer.html?webscene=b5e573a06e7f4195bb2f092aad19b253',
  city:{center:[127.1396,37.5943],tilt:62,heading:20,scale:60000},   /* 웹씬에 시작 화면이 없을 때 */
  /* 웹씬에 슬라이드가 없을 때 '장소 바로가기'로 쓸 구리 명소 레이어 */
  spotsUrl:'https://www.guri.go.kr/gmapsvr/rest/services/Hosted/autumn_foliage/FeatureServer/0',
  spotsMax:12
};
let PLACES=[];   /* [{title, thumb, go:()=>Promise}] — 웹씬 슬라이드 또는 명소 */
let overlayDefs=[];   /* 스냅샷에서 떼어 낸 명소·축제 레이어 정의 (페이지가 직접 그린다) */
let overlayLayers=[];  /* 얹은 FeatureLayer 들 */
const overlayRows={spot:[],fest:[]};   /* 팝업 링크 판단용 전체 행 캐시 */
let view=null, scene=null, tourTimer=null, tilted=true;
const $=id=>document.getElementById(id);
function toast(msg,ms=2200){ const t=$('mapToast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms); }
function showError(title,text){
  const c=$('cover'); c.classList.add('err'); c.classList.remove('hide');
  $('coverTitle').textContent=title; $('coverText').textContent=text;
  $('coverActions').innerHTML=`<button type="button" class="go" onclick="location.reload()">다시 시도</button><a class="alt" href="${SCENE.viewerUrl}" target="_blank" rel="noopener">구리시 3D 뷰어에서 열기 ↗</a>`;
}

if(!window.WebGLRenderingContext){ showError('이 브라우저에서는 3D를 볼 수 없어요','최신 크롬·엣지·사파리 브라우저로 열어 주세요.'); }

require(["esri/config","esri/WebScene","esri/views/SceneView","esri/core/reactiveUtils","esri/layers/FeatureLayer","esri/PopupTemplate"],
(esriConfig,WebScene,SceneView,reactiveUtils,FeatureLayer,PopupTemplate)=>{
  esriConfig.request.useIdentity=false;
  esriConfig.portalUrl=SCENE.portalUrl;

  (async()=>{
    /* ① 배포 때 받아 둔 웹씬 스냅샷(같은 서버) → 브라우저가 포털에 직접 접근하지 않아도 된다
       ② 없으면 포털에서 직접 읽기 */
    let source='portal';
    try{
      const r=await fetch('data/scene.json',{cache:'no-store'});
      if(r.ok){ const j=await r.json();
        if(j&&(j.operationalLayers||j.baseMap)){ absolutizeIcons(j); overlayDefs=takeOverlayDefs(j); scene=WebScene.fromJSON(j); source='snapshot'; console.log('[3D] 스냅샷 사용',j._snapshot||''); } }
    }catch(e){}
    if(!scene){ scene=new WebScene({portalItem:{id:SCENE.itemId}}); console.log('[3D] 스냅샷 없음 — 포털에서 직접 읽습니다'); }

    view=new SceneView({container:'map',map:scene,qualityProfile:'high',
      ui:{components:['attribution']},popup:{dockEnabled:true,dockOptions:{buttonEnabled:false,breakpoint:false,position:'bottom-right'}},
      environment:{atmosphereEnabled:true,starsEnabled:true,atmosphere:{quality:'high'}}});
    view.ui.move('attribution','bottom-right');

    const failTimer=setTimeout(()=>{ if(!scene.loaded) showError('3D 지도 불러오기가 늦어지고 있어요','네트워크가 느리거나 서버가 응답하지 않아요. 잠시 후 다시 시도해 주세요.'); },45000);
    try{
      await scene.load(); await view.when();
      clearTimeout(failTimer);
      beautify();
      addOverlays(FeatureLayer,PopupTemplate);
      await buildPlaces();
      renderSlides();
      $('cover').classList.add('hide');

function shortLabelArcade(field){
  const pairs=Object.entries(LABEL_SHORT).flatMap(([k,v])=>[JSON.stringify(k),JSON.stringify(v)]).join(',');
  return `var m=Dictionary(${pairs}); var v=Trim(Text($feature.${field}));
if(HasKey(m,v)){ return m[v] }
var s=v; var p=Find('(',s); if(p>0){ s=Left(s,p) } s=Trim(s);
var parts=Split(s,' '); var out='';
for(var i in parts){ var t=Trim(parts[i]); if(t==''){ continue }
  if(Left(t,1)=='제' && Right(t,1)=='회' && Count(t)<=5){ continue }
  if(Count(t)==4 && !IsNan(Number(t)) && Number(t)>1900){ continue }
  if(t=='구리'){ continue }
  out=IIf(out=='',t,out+' '+t) }
return IIf(out=='',v,out)`;
}
function shortLabelJs(v){

}

function pv(r,cands){ if(!r) return null; const m={}; Object.keys(r).forEach(k=>{ m[k.toLowerCase().replace(/[_\s]/g,'')]=k; });
  for(const c of [].concat(cands)){ const n=String(c).toLowerCase().replace(/[_\s]/g,''); if(m[n]&&valOK(r[m[n]])) return r[m[n]]; } return null; }
function briefText(s,maxLen,maxSent){
  if(!valOK(s)) return null;
  let t=String(s).replace(/\s+/g,' ').trim();
  const sents=t.split(/(?<=[.!?요다])\s+/).filter(Boolean); let out='';
  for(const x of sents){ if(out&&(out.length+x.length)>maxLen) break; out=out? out+' '+x : x; if(maxSent&&out.split(/(?<=[.!?요다])\s+/).length>=maxSent) break; }
  if(!out) out=t;
  if(out.length>maxLen){ out=out.slice(0,maxLen); const sp=out.lastIndexOf(' '); if(sp>maxLen*0.6) out=out.slice(0,sp); }
  if(out.length<t.length) out=out.replace(/[,·\s]+$/,'')+'…';

}

function toDate(v){ if(!valOK(v)) return null; if(typeof v==='number') return new Date(v); const s=String(v).trim();
  if(/^\d{8}$/.test(s)) return new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));

  const d=new Date(s.replace(/\./g,'-').replace(/(\d)T(\d)/,'$1 $2')); return isNaN(d.getTime())? null : d; }

const festFmtD=d=>{ const W='일월화수목금토'; return `${d.getMonth()+1}.${d.getDate()}(${W[d.getDay()]})`; };
function festPeriod(r){ const s=toDate(pv(r,['시작일','시작','개최일'])); if(!s) return null; const e=toDate(pv(r,['종료일','종료'])); const a=festFmtD(s), b=e? festFmtD(e) : a; return a===b? a : `${a} ~ ${b}`; }

  const t=CARD[kind]; const el=$('infocard'); if(!t||!el) return;
  try{
    const name=String(pv(row,t.name)||'-'), addr=pv(row,t.addr), tel=pv(row,t.tel), telClean=tel? String(tel).replace(/[^\d]/g,'') : '';
    const st=t.status(row), chips=t.chips(row), guide=t.guide(row);
    let photo=''; const raw=pv(row,t.photos);
    if(valOK(raw)){ const list=String(raw).split(/[\n;,\s]+/).map(x=>x.trim()).filter(x=>/^https?:\/\//.test(x)).slice(0,8).map(u=>u.replace(/^http:\/\//,'https://'));
      if(list.length) photo=`<div class="pgal">`+list.map(u=>`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.style.display='none'">`).join('')+`</div>`; }
    let kv=''; t.pop.forEach(([ic,k,fn])=>{ let v=null; try{ v=fn(row); }catch(e){} if(!valOK(v)) return; const sv=String(v);
      if(/^https?:\/\//.test(sv)) return; if([name,addr,tel].some(x=>valOK(x)&&String(x).trim()===sv.trim())) return;
      kv+=`<div class="kv"><span class="k">${ic} ${esc(k)}</span><span class="v">${esc(sv)}</span></div>`; });
    const links=t.links(row).map(([label,u])=>`<a class="btn-alt" target="_blank" rel="noopener" href="${esc(u)}">${esc(label)}</a>`).join('');
    const soft=t.accent+'1A';
    el.style.setProperty('--accent',t.accent); el.style.setProperty('--accent-soft',soft);
    el.innerHTML=`
    <div class="hd"><div class="cat">${esc(t.cat(row))}</div><div class="nm">${esc(name)}</div>
      <button class="close" onclick="hideCard()" aria-label="닫기">✕</button></div>
    <div class="bd">
      ${photo}
      ${st||chips?`<div class="chips">${st?`<span class="st ${st.k}">${st.t}</span>`:''}${chips}</div>`:''}
      ${guide?`<div class="guide">💡 ${guide}</div>`:''}
      ${(addr||tel||kv)?`<div class="pcard">
        ${addr?`<div class="ttl">📍 주소</div><div>${esc(shortAddr(String(addr)))}${looksAddr(addr)?`<button class="copy-btn" onclick="copyAddr(this,'${esc(String(addr)).replace(/'/g,"\\'")}')">복사</button>`:''}</div>`:''}
        ${tel?`<div class="ttl" style="margin-top:${addr?'10px':'0'}">📞 전화</div><a class="row-tel" href="tel:${telClean}">${esc(String(tel))}</a>`:''}
        ${kv?`<div style="margin-top:${(addr||tel)?'10px':'0'}">${kv}</div>`:''}
      </div>`:''}
      ${(telClean||links)?`<div class="btnstack">${telClean?`<a class="btn-tel" href="tel:${telClean}">📞 ${esc(t.telLabel)}</a>`:''}${links}</div>`:''}
      ${t.foot?`<div class="foot">${esc(t.foot)}</div>`:''}
    </div>`;
    el.classList.add('open'); $('main').classList.add('card-open'); el.scrollTop=0;
  }catch(err){ console.warn('[3D 팝업 오류]',err); el.innerHTML=`<div class="hd"><div class="nm">${esc(String(pv(row,t.name)||'-'))}</div><button class="close" onclick="hideCard()">✕</button></div><div class="bd">정보를 표시하는 중 문제가 있었어요.</div>`; el.classList.add('open'); }
}
function hideCard(){ const el=$('infocard'); if(!el) return; el.classList.remove('open'); $('main').classList.remove('card-open'); }

/* 웹씬 JSON 의 아이콘 href 가 '/maps/…' 처럼 루트 상대 주소면 ArcGIS 가 포털 기준으로 풀어 못 찾는다 → 이 페이지 기준 절대 주소로 */
function absolutizeIcons(j){
  let n=0;
  const fix=sym=>{ (sym&&sym.symbolLayers||[]).forEach(sl=>{ const h=sl.resource&&sl.resource.href;
    if(h&&!/^(https?:)?\/\//i.test(h)&&!/^data:/i.test(h)){ sl.resource.href=new URL(h,location.href).href; n++; } }); };
  (j.operationalLayers||[]).forEach(l=>{ const r=l.layerDefinition&&l.layerDefinition.drawingInfo&&l.layerDefinition.drawingInfo.renderer; if(!r) return;
    (r.uniqueValueInfos||[]).forEach(u=>fix(u.symbol)); (r.classBreakInfos||[]).forEach(u=>fix(u.symbol)); fix(r.defaultSymbol); fix(r.symbol); });
  if(n) console.log('[3D] 아이콘 주소',n,'개를 절대 주소로 변환');
}
/* ── 장소 바로가기: 웹씬 슬라이드가 있으면 그것을, 없으면 구리 명소 레이어에서 만든다 ── */
function slideList(){ try{ return scene.presentation&&scene.presentation.slides? scene.presentation.slides.toArray() : []; }catch(e){ return []; } }
async function buildPlaces(){
  PLACES=slideList().map((s,i)=>({title:(s.title&&s.title.text)||('장소 '+(i+1)),thumb:s.thumbnail&&s.thumbnail.url,
    go:()=>s.applyTo(view,{duration:1400,easing:'in-out-cubic'})}));
  if(PLACES.length) return;
  try{
    const u=`${SCENE.spotsUrl}/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&resultRecordCount=${SCENE.spotsMax}&f=json`;
    const j=await (await fetch(u,{signal:AbortSignal.timeout(10000)})).json();
    const name=a=>{ for(const k of ['이름','명칭','관광지명','장소명','name','NAME']){ if(a[k]) return String(a[k]); } return null; };
    (j.features||[]).forEach((f,i)=>{
      if(!f.geometry||f.attributes==null) return; const t=name(f.attributes); if(!t) return;
      const x=f.geometry.x, y=f.geometry.y;
      PLACES.push({title:t,thumb:null,
        go:()=>view.goTo({center:[x,y],scale:2600,tilt:60,heading:(i*40)%360},{duration:1600,easing:'in-out-cubic'})});
    });
    console.log('[3D] 명소 바로가기',PLACES.length,'곳');
  }catch(e){ console.warn('[3D] 명소를 불러오지 못해 장소 바로가기를 생략합니다',String((e&&e.message)||e)); }
}
function renderSlides(){
  const host=$('slides'); host.innerHTML='';
  if(PLACES.length){
    const tour=document.createElement('button'); tour.type='button'; tour.className='slide tour'; tour.id='btnTour';
    tour.innerHTML='▶ 한 바퀴 둘러보기'; tour.onclick=toggleTour; host.appendChild(tour);
  }
  PLACES.forEach((p,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='slide'; b.dataset.i=i;
    b.innerHTML=(p.thumb? `<img src="${esc(p.thumb)}" alt="">` : '<span aria-hidden="true">📍</span>')+'<span>'+esc(p.title)+'</span>';
    b.onclick=()=>{ stopTour(); flyToSlide(i); };
    host.appendChild(b);
  });
  $('barHint').textContent=PLACES.length? '장소를 누르면 그곳으로 날아가요' : '마우스로 지도를 돌려가며 둘러보세요';
}
function flyToSlide(i){
  const p=PLACES[i]; if(!p||!view) return Promise.resolve();
  document.querySelectorAll('.slide').forEach(b=>b.classList.toggle('is-on',b.dataset.i==i));
  return Promise.resolve().then(()=>p.go()).catch(()=>{});
}
async function toggleTour(){ if(tourTimer) return stopTour(); startTour(); }
async function startTour(){
  const list=PLACES; if(!list.length) return;
  $('btnTour').classList.add('is-on'); $('btnTour').innerHTML='■ 둘러보기 멈춤';
  let i=0; tourTimer=true;
  while(tourTimer){
    await flyToSlide(i%list.length);
    for(let k=0;k<30&&tourTimer;k++) await new Promise(r=>setTimeout(r,120));   /* 3.6초 머문다 */
    i++;
  }
}
function stopTour(){ tourTimer=null; const b=$('btnTour'); if(b){ b.classList.remove('is-on'); b.innerHTML='▶ 한 바퀴 둘러보기'; } }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── 도구 ── */
function hasInitialView(){ try{ return !!(scene&&scene.initialViewProperties&&scene.initialViewProperties.viewpoint); }catch(e){ return false; } }
function goHome(){
  if(!view) return; stopTour();
  document.querySelectorAll('.slide').forEach(b=>b.classList.remove('is-on'));
  if(hasInitialView()) view.goTo(scene.initialViewProperties.viewpoint,{duration:1200}).catch(()=>{});
  else view.goTo({center:SCENE.city.center,scale:SCENE.city.scale,tilt:SCENE.city.tilt,heading:SCENE.city.heading},{duration:1200}).catch(()=>{});
}
function zoomBy(n){ if(view) view.goTo({zoom:view.zoom+n},{duration:300}).catch(()=>{}); }
function toggleTilt(){
  if(!view) return; stopTour();
  const cam=view.camera.clone();
  if(tilted){ cam.tilt=0; view.goTo(cam,{duration:700}).catch(()=>{}); toast('위에서 내려다보는 화면이에요',1600); }
  else{ cam.tilt=62; view.goTo(cam,{duration:700}).catch(()=>{}); toast('비스듬히 보는 3D 화면이에요',1600); }
}
function faceNorth(){ if(!view) return; const cam=view.camera.clone(); cam.heading=0; view.goTo(cam,{duration:600}).catch(()=>{}); }
function locate(){
  if(!navigator.geolocation){ toast('이 브라우저는 위치 기능을 지원하지 않아요'); return; }
  navigator.geolocation.getCurrentPosition(p=>{
    if(view) view.goTo({center:[p.coords.longitude,p.coords.latitude],scale:4000,tilt:55},{duration:1000}).catch(()=>{});
  },()=>toast('현재 위치를 확인하지 못했어요'),{enableHighAccuracy:true,timeout:8000});
}
async function shareUrl(){
  const label='구리시 G-MAP 3D 지도';
  const httpish=/^https?:/i.test(location.href);
  if(navigator.share){
    try{ await navigator.share(httpish? {title:label,url:location.href} : {title:label,text:label}); return; }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(location.href); toast('주소를 복사했어요'); }
  catch(e){ toast('주소 복사가 안 됐어요. 주소창에서 복사해 주세요'); }
}
$('optShadow').addEventListener('change',e=>{ const L=view&&view.environment&&view.environment.lighting; if(L&&L.type==='sun') L.directShadowsEnabled=e.target.checked; });
$('optEvening').addEventListener('change',()=>{ if(window.applyLightTime) applyLightTime(); });
</script>
