name: NGII drawing-restore-1110
on:
  push:
    branches: [codex/ngiiseum-drawing-restore-1110-20261109]
    paths: [.github/workflows/ngiiseum-drawing-restore-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: drawing-restore-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $root='D:\services\ngiiseum\drawing-ingest-20261110'
          foreach($name in @('restore-expansion.mjs','wait-restore.mjs')){if(Test-Path -LiteralPath (Join-Path $root $name)){throw 'EXISTING_RESTORE_INSPECT_FIRST'}}
          [IO.File]::WriteAllBytes((Join-Path $root 'restore-expansion.mjs'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $root 'wait-restore.mjs'),[Convert]::FromBase64String(''))
          if((Get-FileHash (Join-Path $root 'restore-expansion.mjs')).Hash.ToLowerInvariant() -ne '056ad87257715332d37b9992ba9298485c216b0baab85dc026b6a75d2b7ef105'){throw 'SCRIPT_HASH'}
          $startup=New-CimInstance -ClassName Win32_ProcessStartup -ClientOnly -Property @{ShowWindow=[UInt16]0}
          $r=Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{CommandLine=('"'+(Get-Command node.exe).Source+'" "'+(Join-Path $root 'wait-restore.mjs')+'"');CurrentDirectory=$root;ProcessStartupInformation=$startup}
          if($r.ReturnValue -ne 0){throw 'RESTORE_WAIT_START_FAILED'}
          @{started=$true;pid=$r.ProcessId;waitingForVerifiedExtraction=$true;automaticFailedRestoreRetry=$false}|ConvertTo-Json -Compress
          
