name: kgeoScan deployment
on:
  push:
    branches: [codex/3dscan-deploy]
    paths: [.github/workflows/3dscan-deploy.yml]
permissions:
  contents: read
concurrency:
  group: 3dscan-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: 3dscan_payload
      - name: Install kgeoScan (site, upload CGI, worker, venv)
        shell: powershell
        env:
          KGEOSCAN_PORTAL_PASSWORD: ${{ secrets.KGEOSCAN_PORTAL_PASSWORD }}
          KGEOSCAN_SPLAT_TOKEN: ${{ secrets.KGEOSCAN_SPLAT_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($env:COMPUTERNAME -ne 'KGO-GIS') { throw 'Unexpected server' }

          $src = Join-Path $env:GITHUB_WORKSPACE '3dscan_payload'
          $expected = [ordered]@{
            'site/3dscan/index.html' = '621a709b52c0879c526d101bb520b546cac97a66bbf5b75d6fcddc9174943c29'
            'site/3dscan/viewer.js' = '4c89e007c76ae14113bfb59a373618704b5ea38cc784908386481a432aa6b28b'
            'site/3dscan/viewer.css' = '414ff47ca031c5dfc2bb3ff6b42750a88db52fe24fe74a5b30dac45abcb9ca2c'
            'site/3dscan/splat.html' = '43eb24761772fb52bd271afe86a4e3381f587c29636cfc089b5f2507648938ba'
            'site/3dscan/ortho.html' = '123ae7a46fc70ca7a312338a70f2045135654c06628fadd978c996a5306938ee'
            'site/3dscan/utility.html' = '807d30ed9367a42c97949c11365d39059c70282ee69d37fc2e6039fd2ac5f7fd'
            'site/3dscan/walk.js' = '0981c0752e74c4a99e69a6578b7c826dd47e0f4d460cfe7ab65738c349fbeb83'
            'site/3dscan/capture_ar.html' = 'f7d74a7eb64752fe485bcd1a64695e615f0f88ded38267045ebad56d887b21e2'
            'site/3dscan/capture_pano.html' = '49532c6229ffc0476ec06896486b690b7d27cd257708f07447116a065b3427a0'
            'site/3dscan/pano.html' = '8b5f32fe23866d19248edec4cfa5e91a900ef52d09ed2f217cb00bcdaf07687f'
            'site/3dscan/targets/trench_board.pdf' = 'a1f0af16b6d7effbe722ec97e746bdf6014f0a906162b00e9a8ff60ea311f06f'
            'site/3dscan/capture.html' = '8e8e8be943994c6964cf64a97d56346f172fb4519c8bc8ab477c9ddd22342e3c'
            'site/3dscan/glb.web.config' = '40f7eadd4d140ac1ad31fe5543f165d51f4e83fd2cf4af96acb308ef6bd77273'
            '3dupload/common.py' = '4dbae79f8a4da75942c7783da799e0b52e8bb56875b6856fd37b925d4d3673bc'
            '3dupload/upload.py' = '6286537967e55530e8ac7055df1d999d09a50647e455adfdc20eeede28c9acd7'
            '3dupload/status.py' = 'a12b23ee7fd3c13d41fbb32e85852ba22acfbccd5aafc6d74e6a5e308c4b87ac'
            '3dupload/check_title.py' = 'a27fc6fdd49535cffc57ce4fbd917220406f28c68b247edc5cf5076b88181c3c'
            '3dupload/retry.py' = '867ee3d6b5cdfa37ee6db144249e966f667a8e4c97e728fe97a1ea2c0e8ed442'
            '3dupload/splat_jobs.py' = 'c904a3e614dca333c6d94b7d3990aac6e5a53d135f1bc15372781ee0c977e386'
            '3dupload/find_job.py' = 'a2401d53dd90dcb76513a990407e648f846e94739b4beb0554145feeb45ee0f0'
            '3dupload/sites.py' = 'e608c6942a68535b2a024b4ca367c09122f3423fb5654858080760c1ff5bf1a7'
            '3dupload/edit.py' = 'ba015b435f916e2f02ded13096f12bcaf96957ea99dd5e0d3af307d18a74c91f'
            '3dupload/web.config' = '2a580379b9269a6b083a8e6f71ccbad4aef2e29e7afef32d8d1454d6503d8b48'
            'tools/queue_runner.py' = 'c3eff407ce2f360f942062fbe604c6dbaaf3b60d71b9944fc11cfc2db0b24f74'
            'tools/pipeline.py' = '1980cbf67f26d58f9201bfd65395f69ff8f2fdcf7be8a35cc6da9a2f642c3de5'
            'tools/slpk_step.py' = 'a76ee0bc029538ce8b9d93904ce06cd9294842f0a119d5f3565294b2a0e30b95'
            'tools/register_task.ps1' = 'f715092ec71960880a80d5aa18ebad602786209b229a194d22095e40e0c394ae'
            'tools/maintenance.py' = 'c49d2ced7e2dbe61e49e1a6806a7bbc5ea38df3032a581a051f47e3a3b9015d2'
            'tools/config_patch.py' = '8a17bc868075356ce46f94e2c07eca8f715a6fbbebe376db6b6d120c398777a9'
            'maintenance.json' = 'a8caf77d149afffb8aa9df3833052fdc76fc06a0312b6d783018bc2ba8f4c5d5'
            'worker/process_scan.py' = '221a2487ab6aa3b3602fdeab6e2371a9cebd012cda869ffe6e499a8154fee746'
            'worker/stray_to_mesh.py' = 'e683cfabd91a067ddef3f6a3e6ccbb8d352033432a6041cd4ae7481914a9b6b8'
            'worker/video_rows.py' = '42c99ebc490d037c22a5a9103d006c4449fe20525576acae89d019c42a542d11'
            'worker/texture_fast.py' = '113ec9fc60a109b42354331a674f54eb7381eb322f4b23a737079ff76d056bef'
            'worker/glb_to_obj.py' = 'dc396620d222b1082586c873b25bd092425db4a213432ce9108e5f3e4e825f22'
            'worker/thumbnail.py' = '8aee29e5a83b03eb09271cac5f3fe86f9d6d74454344340064fd12783d2726ed'
            'worker/object_region.py' = 'e37361174ebdd4a57f8ad3035fe1f7fe2a3eb43dabf4f1ee6bad8d52ca3c4893'
            'worker/process_objcap.py' = '79b917aba9fdd44f582599f5be9e74d2c029772443018385b10454bccf19c7dc'
            'worker/orthophoto.py' = 'f4dba04e33c91509ce6565e54342e2daad8aa7c7308fa74ae8613b1a94670a98'
            'worker/floorplan.py' = '5974a11b6d4d1d9c92b5e32d0498489db141c3f75ccfeb20524c7e419fcebff0'
            'worker/crack_analysis.py' = '8d9d8a4ec8367c37d32567d8f3e61a08698d5bea26057da5bb3fafa7d183930f'
            'worker/scale_target.py' = 'ef7ca3b7c65c7016d8506d9065803304961623c3cc86087672575ea1db233dc2'
            'worker/crack_card.json' = 'c0853bb054559a0e457790933092967321c58d1c0971941b7ca19e92e922935f'
            'worker/hazard_detect.py' = '2184cee1b2a1d118bb8001c2dc800bc906a5293c1da9617493dacac25fd51c0f'
            'worker/hazard_change.py' = 'cd0456f43ab892eb763fab6164987e1affd3fd89009f3695383329e06f037471'
            'worker/media_check.py' = '083044d78af7dfdd5e3118b37ca2e4ceb28b47132b2ecef6971969e5c1f68896'
            'worker/utility_extract.py' = '5dd63a4aee15ee6ac79613bbb4ce8551eef70d5f72f354cae0fa1634741b77de'
            'worker/utility_report.py' = '50df2a31e359ceca0fa4f5ca541bb096c0a71a7bef720e1d556cf19f24f770b0'
            'worker/pano_stitch.py' = 'a47da44dff288d243ecb173a76bf635c8c1e2d004b155294e7eb72cb6666523f'
            'worker/pano_video.py' = 'ad1775a8df9ee69bb183436f94c9befedf01fc7547c227c49fde08caba1a1f15'
            'config/kgeoscan.example.json' = 'bf94b0186dc4eb33a29e43fb9b9b9132ec13b85ace6a1915c065737bfa95c964'
            'requirements.txt' = '4703521a52b31751fac24f008578a24cbad28d3ba1bd7c95351184a6e75cfc5c'
          }
          foreach ($k in $expected.Keys) {
            $p = Join-Path $src ($k -replace '/', '\')
            if (-not (Test-Path -LiteralPath $p)) { throw "source missing: $k" }
            $h = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($h -ne $expected[$k]) { throw "source hash mismatch: $k" }
          }
          "SOURCE OK ($($expected.Count) files)"

          $site     = 'D:\codesolution\kgeodata\3dscan'
          $upload   = 'D:\codesolution\kgeodata\3dupload'
          $tools    = 'D:\kgeoHub\tools\3dscan'
          $cfgDir   = 'D:\kgeoHub\config'
          $dataRoot = 'D:\kgeoHub\data\3dscan'
          $bkRoot   = 'D:\codesolution\_deploy_backup\3dscan'
          $stamp    = Get-Date -Format 'yyyyMMdd-HHmmss'

          # ── 백업 (3dscan 웹 폴더, 3dupload, tools)
          $bk = Join-Path $bkRoot $stamp
          New-Item -ItemType Directory -Force -Path $bk | Out-Null
          foreach ($pair in @(@($site,'3dscan'), @($upload,'3dupload'), @($tools,'tools'))) {
            if (Test-Path -LiteralPath $pair[0]) {
              robocopy $pair[0] (Join-Path $bk $pair[1]) /E /R:2 /W:2 /NFL /NDL /NJH /NJS /NP | Out-Null
              if ($LASTEXITCODE -ge 8) { throw ('backup failed: ' + $pair[0]) }
            }
          }
          "BACKUP=$bk"
          Get-ChildItem -LiteralPath $bkRoot -Directory | Sort-Object Name -Descending | Select-Object -Skip 10 | Remove-Item -Recurse -Force

          # ── 웹 루트 정리: 보조 스크립트를 웹 밖으로 (IIS 가 .py 를 CGI 로 실행하므로)
          New-Item -ItemType Directory -Force -Path (Join-Path $tools 'legacy'), (Join-Path $tools 'worker'), $cfgDir, (Join-Path $dataRoot 'jobs'), (Join-Path $dataRoot 'logs') | Out-Null
          if (Test-Path -LiteralPath $site) {
            $moved = 0; $stuck = @()
            Get-ChildItem -LiteralPath $site -File | Where-Object { $_.Extension -in '.py','.bat','.ps1','.log','.pyc' } | ForEach-Object {
              try { Move-Item -LiteralPath $_.FullName -Destination (Join-Path $tools ('legacy\' + $_.Name)) -Force; $moved++ } catch { $stuck += $_.Name }
            }
            "LEGACY MOVED=$moved" + $(if ($stuck) { "  (이동 실패: $($stuck -join ', '))" } else { '' })
          }
          try { cmd /c 'schtasks /delete /tn kgeoScanQueueRunner /f 2>nul' | Out-Null; "OLD TASK: 삭제 시도 (exit $LASTEXITCODE)" } catch { "OLD TASK: 삭제 생략" }

          # ── 파일 설치
          New-Item -ItemType Directory -Force -Path $site, $upload | Out-Null
          foreach ($f in 'index.html','viewer.js','viewer.css','splat.html','ortho.html','utility.html','capture.html','walk.js','capture_ar.html','capture_pano.html','pano.html') { Copy-Item -LiteralPath (Join-Path $src ('site\3dscan\' + $f)) -Destination (Join-Path $site $f) -Force }
          if (Test-Path -LiteralPath (Join-Path $src 'site\3dscan\targets')) {
            New-Item -ItemType Directory -Force -Path (Join-Path $site 'targets') | Out-Null
            Copy-Item -Path (Join-Path $src 'site\3dscan\targets\*') -Destination (Join-Path $site 'targets') -Force
          }
          # 스플랫 파일(.splat/.spz/.json) MIME 매핑: glb\web.config (이 폴더에만 적용). 아래 'SPLAT MIME' 검사에서 실패하면 제거한다
          New-Item -ItemType Directory -Force -Path (Join-Path $site 'glb') | Out-Null
          Copy-Item -LiteralPath (Join-Path $src 'site\3dscan\glb.web.config') -Destination (Join-Path $site 'glb\web.config') -Force
          robocopy (Join-Path $src '3dupload') $upload /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw 'copy 3dupload failed' }
          foreach ($f in Get-ChildItem -LiteralPath (Join-Path $src 'tools') -File) { Copy-Item -LiteralPath $f.FullName -Destination (Join-Path $tools $f.Name) -Force }
          foreach ($f in Get-ChildItem -LiteralPath (Join-Path $src 'worker') -File) { Copy-Item -LiteralPath $f.FullName -Destination (Join-Path $tools ('worker\' + $f.Name)) -Force }
          Copy-Item -LiteralPath (Join-Path $src 'requirements.txt') -Destination (Join-Path $tools 'requirements.txt') -Force
          "FILES INSTALLED"

          # ── Python venv (3.10+ 필요). 후보: py -3.11, python, ArcGIS Pro python
          $venvPy = 'D:\kgeoHub\tools\3dscan\venv\Scripts\python.exe'
          $probe = 'import sys; print(sys.version_info[0]*100+sys.version_info[1]); print(sys.executable)'
          if (-not (Test-Path -LiteralPath $venvPy)) {
            $base = $null
            $cands = @(
              @{ exe = 'py'; args = @('-3.11') }, @{ exe = 'py'; args = @('-3.12') }, @{ exe = 'python'; args = @() },
              @{ exe = 'D:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe'; args = @() }
            )
            foreach ($c in $cands) {
              try {
                $v = cmd /c ('"' + $c.exe + '" ' + ($c.args -join ' ') + ' -c "' + $probe + '" 2>nul')
                if ($LASTEXITCODE -eq 0 -and $v -and [int]$v[0] -ge 310) { $base = $v[1].Trim(); break }
              } catch {}
            }
            if (-not $base) { throw 'Python 3.10+ 를 찾지 못했습니다. 서버에 Python 3.11 을 설치하세요.' }
            "VENV BASE=$base"
            cmd /c ('"' + $base + '" -m venv "' + (Join-Path $tools 'venv') + '" 2>&1')
            if ($LASTEXITCODE -ne 0) { throw 'venv 생성 실패' }
          }
          cmd /c ('"' + $venvPy + '" -m pip install --upgrade pip --quiet --disable-pip-version-check 2>&1') | Select-Object -Last 3
          cmd /c ('"' + $venvPy + '" -m pip install -r "' + (Join-Path $tools 'requirements.txt') + '" --quiet --disable-pip-version-check 2>&1') | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { throw 'pip install 실패' }
          cmd /c ('"' + $venvPy + '" -I -c "import open3d, cv2, trimesh, laspy, pyproj, numpy; print(''PY OK open3d'', open3d.__version__)" 2>&1')
          if ($LASTEXITCODE -ne 0) { throw 'worker 패키지 import 실패' }

          # ── 설정 파일 (없을 때만 생성). 비밀번호: GitHub secret KGEOSCAN_PORTAL_PASSWORD 가 있으면 넣음
          $cfgPath = Join-Path $cfgDir 'kgeoscan.json'
          if (-not (Test-Path -LiteralPath $cfgPath)) {
            Copy-Item -LiteralPath (Join-Path $src 'config\kgeoscan.example.json') -Destination $cfgPath -Force
            "CONFIG CREATED=$cfgPath"
          } else { "CONFIG EXISTS=$cfgPath (kept)" }
          # Portal 비밀번호: GitHub secret KGEOSCAN_PORTAL_PASSWORD 가 있으면 자리표시자를 채운다 (이미 채워져 있으면 그대로)
          $cfgNow = Get-Content -LiteralPath $cfgPath -Raw -Encoding UTF8
          if ($env:KGEOSCAN_PORTAL_PASSWORD) {
            # secret 이 있으면 항상 덮어쓴다 (틀린 비밀번호를 secret 재등록으로 고칠 수 있게). JSON 문자열 이스케이프.
            $pwJson = $env:KGEOSCAN_PORTAL_PASSWORD.Replace('\', '\\').Replace('"', '\"')
            $cfgNew = [regex]::Replace($cfgNow, '"portal_password":\s*"[^"]*"', ('"portal_password": "' + $pwJson.Replace('$', '$$') + '"'))
            [System.IO.File]::WriteAllText($cfgPath, $cfgNew, (New-Object System.Text.UTF8Encoding($false)))
            "CONFIG: portal password applied from secret (len $($env:KGEOSCAN_PORTAL_PASSWORD.Length))"
          } elseif ($cfgNow -match '<PORTAL_PASSWORD>') { "CONFIG: portal password STILL PLACEHOLDER (set GitHub secret KGEOSCAN_PORTAL_PASSWORD)" } else { "CONFIG: portal password kept" }
          # 토큰 발급 테스트 (비밀번호 검증)
          try {
            $c = Get-Content -LiteralPath $cfgPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $tok = Invoke-RestMethod -Method Post -Uri ($c.portal_url + '/sharing/rest/generateToken') -Body @{ username = $c.portal_user; password = $c.portal_password; referer = $c.portal_url; expiration = 5; f = 'json' } -TimeoutSec 30
            if ($tok.token) { "PORTAL LOGIN: OK ($($c.portal_user))" } else { "PORTAL LOGIN: FAILED - $($tok.error.message) $($tok.error.details)" }
          } catch { "PORTAL LOGIN: test error - $($_.Exception.Message)" }
          # 설정 보강: 예제에만 있는 키(splat 등)를 추가하고 스플랫 워커 토큰(secret KGEOSCAN_SPLAT_TOKEN)을 넣는다. 있는 값은 안 바꿈
          try {
            $cp = cmd /c ('"' + $venvPy + '" -I "' + (Join-Path $tools 'config_patch.py') + '" "' + $cfgPath + '" "' + (Join-Path $src 'config\kgeoscan.example.json') + '" 2>&1')
            foreach ($l in $cp) { "$l" }
          } catch { "CONFIG PATCH: failed - $($_.Exception.Message)" }
          # ArcGIS Pro python 경로 보정 (C:/D: 어느 쪽에 설치돼 있든)
          $proCands = @('D:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe', 'C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe')
          $proFound = $proCands | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          $cfgTxt = Get-Content -LiteralPath $cfgPath -Raw -Encoding UTF8
          $m = [regex]::Match($cfgTxt, '"arcgis_python":\s*"([^"]*)"')
          $current = if ($m.Success) { $m.Groups[1].Value.Replace('\\', '\') } else { '' }
          if ($proFound -and ($current -ne $proFound)) {
            $cfgTxt = [regex]::Replace($cfgTxt, '"arcgis_python":\s*"[^"]*"', ('"arcgis_python": "' + $proFound.Replace('\', '\\') + '"'))
            [System.IO.File]::WriteAllText($cfgPath, $cfgTxt, (New-Object System.Text.UTF8Encoding($false)))
            "ARCGIS PYTHON: config updated -> $proFound"
          }

          # ── IIS: CGI 실행 허용 목록에 venv python 등록 (실패해도 계속)
          try {
            $appcmd = Join-Path $env:windir 'system32\inetsrv\appcmd.exe'
            $proc = $venvPy + ' -I %s %s'
            $list = & $appcmd list config /section:system.webServer/security/isapiCgiRestriction /text:*
            if ($list -match [regex]::Escape($proc)) { "CGI RESTRICTION: already allowed" }
            else { & $appcmd set config /section:system.webServer/security/isapiCgiRestriction /+"[path='$proc',allowed='True',description='kgeoScan CGI']" /commit:apphost | Out-Null; "CGI RESTRICTION: added" }
          } catch { "CGI RESTRICTION: 자동 등록 실패 ($($_.Exception.Message)) — SERVER_POWERSHELL.md 3번 참고" }

          # ── 설치 확인
          foreach ($k in $expected.Keys) {
            $dest = switch -Wildcard ($k) {
              'site/3dscan/glb.web.config' { Join-Path $site 'glb\web.config'; break }
              'site/3dscan/*' { Join-Path $site ($k.Substring(12)) }
              '3dupload/*'    { Join-Path $upload ($k.Substring(9)) }
              'tools/*'       { Join-Path $tools ($k.Substring(6)) }
              'worker/*'      { Join-Path $tools ('worker\' + $k.Substring(7)) }
              default         { $null }
            }
            if ($dest) {
              $h = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($h -ne $expected[$k]) { throw "installed hash mismatch: $k" }
            }
          }
          "INSTALL VERIFIED"

          # ── 큐 러너 작업 등록 (kgo 계정, '로그온한 동안 실행' 방식이라 비밀번호 불필요). 기존 작업은 교체.
          try {
            $action    = New-ScheduledTaskAction -Execute $venvPy -Argument ('-I "' + (Join-Path $tools 'queue_runner.py') + '"') -WorkingDirectory $tools
            $trigger   = New-ScheduledTaskTrigger -AtLogOn -User 'kgo'
            $principal = New-ScheduledTaskPrincipal -UserId 'kgo' -LogonType Interactive -RunLevel Highest
            $settings  = New-ScheduledTaskSettingsSet -ExecutionTimeLimit ([TimeSpan]::Zero) -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1) -MultipleInstances IgnoreNew
            Register-ScheduledTask -TaskName 'kgeoScanQueueRunner' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force | Out-Null
            "TASK: registered (kgo, at logon, interactive)"
            try { Start-ScheduledTask -TaskName 'kgeoScanQueueRunner' } catch { "TASK START: $($_.Exception.Message)" }
            Start-Sleep -Seconds 4
            $st = Get-ScheduledTask -TaskName 'kgeoScanQueueRunner'
            "TASK STATE: $($st.State)"
            $rl = Join-Path $dataRoot 'logs\queue_runner.log'
            if (Test-Path -LiteralPath $rl) { "RUNNER LOG: " + ((Get-Content -LiteralPath $rl -Tail 2 -Encoding UTF8) -join ' | ') }
          } catch { "TASK: registration failed - $($_.Exception.Message) (run register_task.ps1 on the server)" }
          try { $who = cmd /c 'whoami 2>nul'; "RUNNER ACCOUNT: $who" } catch {}
          try { $t = cmd /c ('"' + $proFound + '" -c "import arcpy; print(arcpy.GetInstallInfo()[''Version''])" 2>&1'); "ARCPY UNDER RUNNER ACCOUNT: $($t -join ' ' | Select-Object -First 1)" } catch { "ARCPY UNDER RUNNER ACCOUNT: test failed" }
          if ($proFound) { "ARCGIS PYTHON: $proFound" } else { "ARCGIS PYTHON: NOT FOUND (C:/D: Program Files\ArcGIS\Pro) -> SLPK step will be skipped" }
          try { $cgiTest = (Invoke-WebRequest -Uri 'https://kgeodata.com/app/3dupload/check_title.py?title=zz_deploy_probe' -UseBasicParsing -TimeoutSec 30).Content; "CGI TEST: $cgiTest" } catch { "CGI TEST FAILED: $($_.Exception.Message)" }
          # 진단: 사이트의 .py 핸들러 정의와 CGI 허용 목록 (다음 배포에서 핸들러를 맞추기 위함)
          try {
            $appcmd = Join-Path $env:windir 'system32\inetsrv\appcmd.exe'
            $sites = & $appcmd list sites /text:name
            foreach ($s in $sites) { $h = & $appcmd list config "$s/app" -section:system.webServer/handlers /text:* 2>$null; foreach ($line in ($h | Select-String -Pattern '\.py|python' )) { "HANDLER[$s/app]: $($line.Line.Trim())" } }
            foreach ($line in ((& $appcmd list config -section:system.webServer/security/isapiCgiRestriction /text:*) | Select-String -Pattern 'python')) { "CGI ALLOWED: $($line.Line.Trim())" }
          } catch { "HANDLER DIAG FAILED: $($_.Exception.Message)" }
          try { $r = Invoke-WebRequest -Uri 'https://kgeodata.com/app/3dupload/upload.py' -Method POST -Body 'x=1' -UseBasicParsing -TimeoutSec 30; "UPLOAD POST TEST: $($r.StatusCode) $($r.Content)" } catch { $resp = $_.Exception.Response; $code = if ($resp) { [int]$resp.StatusCode } else { '?' }; "UPLOAD POST TEST: HTTP $code (400 = CGI reached, 405/404 = handler problem)" }
          # 스플랫 MIME 확인: glb\web.config 로 .splat 이 200 으로 나오고 기존 .glb 도 그대로 나오는지. 실패하면 web.config 제거
          try {
            $probe = Join-Path $site 'glb\_probe.splat'
            [System.IO.File]::WriteAllBytes($probe, (New-Object byte[] 32))
            $r1 = Invoke-WebRequest -Uri 'https://kgeodata.com/app/3dscan/glb/_probe.splat' -UseBasicParsing -TimeoutSec 30
            $glbName = (Get-ChildItem -LiteralPath (Join-Path $site 'glb') -Filter *.glb | Select-Object -First 1).Name
            $r2 = if ($glbName) { Invoke-WebRequest -Uri ('https://kgeodata.com/app/3dscan/glb/' + $glbName) -Method Head -UseBasicParsing -TimeoutSec 30 } else { $null }
            "SPLAT MIME: probe $($r1.StatusCode) $($r1.Headers['Content-Type']); glb $(if ($r2) { $r2.StatusCode } else { 'n/a' })"
          } catch {
            "SPLAT MIME: FAILED ($($_.Exception.Message)) -> removing glb\web.config"
            Remove-Item -LiteralPath (Join-Path $site 'glb\web.config') -Force -ErrorAction SilentlyContinue
          }
          # 유지보수 작업 (maintenance.json 의 once_id 가 새것일 때만 실행됨)
          try {
            $mout = cmd /c ('"' + $venvPy + '" -I "' + (Join-Path $tools 'maintenance.py') + '" --actions "' + (Join-Path $src 'maintenance.json') + '" 2>&1')
            foreach ($l in $mout) { "MAINT: $l" }
          } catch { "MAINT: failed - $($_.Exception.Message)" }
          exit 0
