name: Architectural drawing application operation
on:
  push:
    branches: [codex/archdrawing-deploy]
permissions:
  contents: read
concurrency:
  group: archdrawing-deploy
  cancel-in-progress: false
jobs:
  operation:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 8
    steps:
      - name: Start drawing application independently of deployment console
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\services\archdrawing'
          if((Get-Content -LiteralPath (Join-Path $root '.archdrawing-owned') -Raw).Trim() -ne 'archdrawing'){throw 'Unexpected application root'}
          $python=Join-Path $root 'venv\Scripts\python.exe'
          $program=@'
          from pathlib import Path
          import os,subprocess,json,urllib.request,time
          root=Path(r'D:\services\archdrawing')
          config=json.loads((root/'config.json').read_text(encoding='utf-8-sig'))
          environment=dict(os.environ)
          environment.pop('RUNNER_TRACKING_ID',None)
          stop=root/'stop.request'
          if stop.exists(): raise SystemExit('Application stop marker present; inspect before starting')
          http=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          try:
              value=json.load(http.open('http://127.0.0.1:4193/api/health',timeout=3))
              if value.get('application')=='archdrawing':
                  print('ARCHDRAWING_ALREADY_RUNNING',json.dumps(value),flush=True)
                  raise SystemExit(0)
          except (OSError,ValueError): pass
          with (root/'logs/detached.stdout.log').open('ab') as out,(root/'logs/detached.stderr.log').open('ab') as err:
              process=subprocess.Popen([config['python'],'-X','utf8',str(root/'supervisor.py')],cwd=root,env=environment,stdin=subprocess.DEVNULL,stdout=out,stderr=err,creationflags=subprocess.DETACHED_PROCESS|subprocess.CREATE_NEW_PROCESS_GROUP,close_fds=True)
          print('ARCHDRAWING_DETACHED',json.dumps({'launcher_pid':process.pid,'runner_tracking_inherited':bool(environment.get('RUNNER_TRACKING_ID'))}),flush=True)
          for attempt in range(45):
              try:
                  value=json.load(http.open('http://127.0.0.1:4193/api/health',timeout=3))
                  if value.get('ready'):
                      print('ARCHDRAWING_READY',json.dumps(value),flush=True)
                      break
              except (OSError,ValueError): pass
              time.sleep(2)
          else: raise SystemExit('Application did not become ready')
          '@
          & $python -X utf8 -c $program
          if($LASTEXITCODE -ne 0){throw 'Application start failed'}
          
