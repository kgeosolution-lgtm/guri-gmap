name: Architectural drawing application operation
on:
  push:
    branches: [codex/archdrawing-deploy]
permissions:
  contents: read
concurrency:
  group: archdrawing-deploy
  cancel-in-progress: false
jobs:
  operation:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 8
    steps:
      - name: Verify registered drawing startup task and service health
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\services\archdrawing'
          if((Get-Content -LiteralPath (Join-Path $root '.archdrawing-owned') -Raw).Trim() -ne 'archdrawing'){throw 'Unexpected application root'}
          $result=[ordered]@{checked_at=[DateTime]::UtcNow.ToString('o')}
          $receipt=Get-Content -LiteralPath (Join-Path $root 'deployment_receipt.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $result.recorded_startup=$receipt.startup
          try{
            $task=Get-ScheduledTask -TaskName 'KGEO Architectural Drawing Classifier' -ErrorAction Stop
            $result.task=@{
              name=$task.TaskName
              state=[string]$task.State
              enabled=[bool]$task.Settings.Enabled
              actions=@($task.Actions | ForEach-Object {@{execute=$_.Execute;arguments=$_.Arguments;working_directory=$_.WorkingDirectory}})
              triggers=@($task.Triggers | ForEach-Object {@{type=$_.CimClass.CimClassName;enabled=[bool]$_.Enabled}})
              principal=@{user=$task.Principal.UserId;logon_type=[string]$task.Principal.LogonType;run_level=[string]$task.Principal.RunLevel}
              execution_time_limit=$task.Settings.ExecutionTimeLimit
              restart_count=$task.Settings.RestartCount
              restart_interval=$task.Settings.RestartInterval
              multiple_instances=[string]$task.Settings.MultipleInstances
            }
            $result.startup_configuration_verified=([bool]$task.Settings.Enabled -and @($task.Triggers | Where-Object {$_.CimClass.CimClassName -eq 'MSFT_TaskBootTrigger' -and $_.Enabled}).Count -eq 1 -and @($task.Actions | Where-Object {$_.Execute -eq (Join-Path $root 'venv\Scripts\python.exe') -and $_.Arguments -eq '-X utf8 "D:\services\archdrawing\supervisor.py"'}).Count -eq 1)
          }catch{$result.task_read_error=$_.Exception.GetType().Name;$result.startup_configuration_verified=$false}
          $program=@'
          import json,urllib.request
          client=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with client.open('http://127.0.0.1:4193/api/health',timeout=5) as response:
              print(json.dumps(json.load(response)))
          '@
          $health=& (Join-Path $root 'venv\Scripts\python.exe') -X utf8 -c $program
          if($LASTEXITCODE -ne 0){throw 'Application health check failed'}
          $result.health=$health | ConvertFrom-Json
          $result.reboot_performed=$false
          Write-Output ('ARCHDRAWING_STARTUP_VERIFIED '+($result|ConvertTo-Json -Depth 8 -Compress))
          
