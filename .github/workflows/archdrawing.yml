name: Architectural drawing application operation
on:
  push:
    branches: [codex/archdrawing-deploy]
permissions:
  contents: read
concurrency:
  group: archdrawing-deploy
  cancel-in-progress: false
jobs:
  operation:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 8
    steps:
      - name: Check drawing backend and route with bounded requests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\services\archdrawing'
          Write-Output 'ARCHDRAWING_PHASE process-check'
          foreach($name in @('supervisor','app')){
            $number=[int](Get-Content -LiteralPath (Join-Path $root ($name+'.pid')) -Raw)
            $process=Get-Process -Id $number -ErrorAction SilentlyContinue
            Write-Output ('ARCHDRAWING_PROCESS '+(@{name=$name;pid=$number;running=[bool]$process;process_name=$process.ProcessName}|ConvertTo-Json -Compress))
          }
          Write-Output 'ARCHDRAWING_PHASE backend-check'
          $program=@'
          import urllib.request,json,socket
          http=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          try:
              r=http.open('http://127.0.0.1:4193/api/health',timeout=5)
              print('ARCHDRAWING_BACKEND',r.status,r.read().decode(),flush=True)
          except Exception as e:
              print('ARCHDRAWING_BACKEND_ERROR',type(e).__name__,str(e),flush=True)
          '@
          & (Join-Path $root 'venv\Scripts\python.exe') -X utf8 -c $program
          Write-Output 'ARCHDRAWING_PHASE proxy-configuration'
          foreach($path in @('D:\codesolution\web.config','D:\codesolution\kgeodata\web.config','D:\codesolution\kgeodata\archdrawing\web.config')){
            if(Test-Path -LiteralPath $path){
              [xml]$xml=Get-Content -LiteralPath $path -Raw
              $rules=@($xml.SelectNodes('//system.webServer/rewrite/rules/rule')|ForEach-Object{@{name=$_.name;match=$_.match.url;type=$_.action.type;url=$_.action.url}})
              Write-Output ('ARCHDRAWING_ROUTING '+(@{path=$path;rules=$rules}|ConvertTo-Json -Depth 5 -Compress))
            }
          }
          foreach($name in @('supervisor.stderr.log','app.stderr.log')){
            $path=Join-Path $root ('logs\'+$name)
            if(Test-Path -LiteralPath $path){
              $lines=@(Get-Content -LiteralPath $path -Tail 15 | Where-Object {$_ -match '^INFO:|^ERROR:|^WARNING:|^[A-Za-z]+Error:'})
              Write-Output ('ARCHDRAWING_LOG '+(@{name=$name;lines=$lines}|ConvertTo-Json -Compress))
            }
          }
          Write-Output ('ARCHDRAWING_HTTP_PLATFORM '+(Test-Path -LiteralPath 'C:\Windows\System32\inetsrv\httpPlatformHandler.dll'))
          Write-Output 'ARCHDRAWING_PHASE done'
          
