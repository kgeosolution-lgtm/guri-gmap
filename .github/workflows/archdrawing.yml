name: Architectural drawing server deployment
on:
  push:
    branches: [codex/archdrawing-deploy]
permissions:
  contents: read
concurrency:
  group: archdrawing-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 30
    steps:
      - name: Receive and install requested private application
        shell: powershell
        env:
          ARCHDRAWING_TRANSFER: ${{ secrets.ARCHDRAWING_TRANSFER }}
          ARCHDRAWING_RELEASE: server-beta-20261123-r1
          ARCHDRAWING_ARCHIVE_SHA256: 5ec644d420c262679a14f60f9ecc1b10916c9b29061a93eb5ef714ba59685fd4
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $release = $env:ARCHDRAWING_RELEASE
          if($release -notmatch '^[a-z0-9-]+$'){throw 'Invalid release identifier'}
          $transfer = $env:ARCHDRAWING_TRANSFER | ConvertFrom-Json
          $env:ARCHDRAWING_TRANSFER = $null
          $temporary = Join-Path $env:RUNNER_TEMP ('archdrawing-'+$release+'-'+[Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temporary | Out-Null
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $temporary /inheritance:r /grant:r "*$($sid):(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Private transfer permissions failed'}
          foreach($part in $transfer.parts){
            if($part.name -notmatch '^part-[0-9]{2}\.bin$'){throw 'Invalid package chunk'}
            if(([Uri]$part.url).Host -ne 'raw.githubusercontent.com'){throw 'Unexpected package source'}
            $target = Join-Path $temporary $part.name
            try { Invoke-WebRequest -UseBasicParsing -Uri $part.url -OutFile $target } catch { throw 'Private package download failed. Refresh its temporary transfer capability.' }
            if((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $part.sha256){throw 'Private package chunk integrity failed'}
          }
          $archive = Join-Path $temporary 'package.zip'
          $combined = [IO.File]::OpenWrite($archive)
          try{
            foreach($part in $transfer.parts){
              $inputFile = [IO.File]::OpenRead((Join-Path $temporary $part.name))
              try{$inputFile.CopyTo($combined)}finally{$inputFile.Dispose()}
            }
          }finally{$combined.Dispose()}
          $transfer = $null
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ARCHDRAWING_ARCHIVE_SHA256){throw 'Private application archive integrity failed'}
          $payload = Join-Path $temporary 'payload'
          Expand-Archive -LiteralPath $archive -DestinationPath $payload
          Write-Output 'Private drawing application received and verified.'
          & (Join-Path $payload 'install-server.ps1') -PackageDirectory $payload
          
