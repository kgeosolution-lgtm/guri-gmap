name: Architectural drawing application operation
on:
  push:
    branches: [codex/archdrawing-deploy]
permissions:
  contents: read
concurrency:
  group: archdrawing-deploy
  cancel-in-progress: false
jobs:
  operation:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 8
    steps:
      - name: Inspect architectural drawing proxy connection
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $result=[ordered]@{}
          $root='D:\services\archdrawing'
          foreach($name in @('supervisor','app')){
            $pidFile=Join-Path $root ($name+'.pid')
            if(Test-Path -LiteralPath $pidFile){
              $number=[int](Get-Content -LiteralPath $pidFile -Raw)
              $process=Get-Process -Id $number -ErrorAction SilentlyContinue
              $result[$name]=@{pid=$number;running=[bool]$process;name=$process.ProcessName}
            }
          }
          $result.listener=@(Get-NetTCPConnection -LocalPort 4193 -State Listen -ErrorAction SilentlyContinue | Select-Object LocalAddress,LocalPort,OwningProcess)
          try{$result.backend=Invoke-RestMethod -Uri 'http://127.0.0.1:4193/api/health' -TimeoutSec 5}catch{$result.backend_error=$_.Exception.Message}
          foreach($test in @(@{name='iis_loopback';uri='http://127.0.0.1/app/archdrawing/api/health';host='kgeodata.com'},@{name='public';uri='https://kgeodata.com/app/archdrawing/api/health';host='kgeodata.com'})){
            try{$r=Invoke-WebRequest -UseBasicParsing -Uri $test.uri -Headers @{Host=$test.host} -TimeoutSec 10;$result[$test.name]=@{status=$r.StatusCode;body=$r.Content}}catch{$result[$test.name]=@{error=$_.Exception.Message;status=[int]$_.Exception.Response.StatusCode}}
          }
          $result.log_tail=@{}
          foreach($name in @('supervisor.stderr.log','app.stderr.log')){
            $file=Join-Path $root ('logs\'+$name)
            if(Test-Path -LiteralPath $file){$result.log_tail[$name]=@(Get-Content -LiteralPath $file -Tail 16)}
          }
          $result.http_platform_installed=Test-Path -LiteralPath 'C:\Windows\System32\inetsrv\httpPlatformHandler.dll'
          $result.rewrite_files=@(Get-ChildItem -LiteralPath 'D:\codesolution\kgeodata\archdrawing' | Select-Object Name,Length)
          Write-Output ('ARCHDRAWING_DIAGNOSTIC '+($result|ConvertTo-Json -Depth 9 -Compress))
          
