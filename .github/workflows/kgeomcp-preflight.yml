name: Verify remote repair script and directory access
on:
  push:
    branches: [codex/kgeomcp-server-bootstrap]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 5
    steps:
      - name: Verify remote repair script and directory access
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\services\kgeo-mcp-remote'
          $paths=@((Join-Path $root 'repair-proxy.ps1'),(Join-Path $root 'releases\95baa19ea84e9e60\deploy\remote\repair-proxy.ps1'))
          $files=@()
          foreach($p in $paths){$exists=Test-Path -LiteralPath $p -PathType Leaf;$entry=[ordered]@{Path=$p;Exists=$exists};if($exists){$entry.Bytes=(Get-Item -LiteralPath $p).Length;$entry.Sha256=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()};$files+=$entry}
          $acl=(Get-Acl -LiteralPath $root).Access | ForEach-Object {[ordered]@{Identity=$_.IdentityReference.Value;Rights=$_.FileSystemRights.ToString();Type=$_.AccessControlType.ToString()}}
          [ordered]@{Computer=$env:COMPUTERNAME;Files=$files;DirectoryAcl=$acl;Task=(Get-ScheduledTask -TaskName 'KGEO-MCP-Remote' | Select-Object TaskName,State)} | ConvertTo-Json -Depth 6
          
