name: kgeoMCP account check
on:
  push:
    branches: [codex/kgeomcp-server-bootstrap]
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 3
    steps:
      - name: Verify portaladmin access on the running server without changing configuration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $operatorConfig = Get-Content -LiteralPath 'D:\services\kgeo-mcp-remote\config.json' -Raw | ConvertFrom-Json
          $activeConfig = Get-Content -LiteralPath 'D:\services\kgeo-mcp-remote\active-config.json' -Raw | ConvertFrom-Json
          if ($operatorConfig.app.portal -ne 'https://kgeodata.com/portal' -or $activeConfig.app.portal -ne 'https://kgeodata.com/portal') { throw 'Unexpected Portal connection' }
          if (-not (@($operatorConfig.allowedUsers) -ccontains 'portaladmin') -or -not (@($activeConfig.allowedUsers) -ccontains 'portaladmin')) { throw 'Requested account is not in both configured and active allowlists' }
          $health = Invoke-RestMethod 'http://127.0.0.1:4187/app/kgeomcp/health.json'
          if ($health.health -ne 'ready' -or $health.version -ne '0.23.1' -or $health.releaseId -ne '66e32c0fddebba6c') { throw 'Expected release is not ready' }
          Write-Output 'portaladmin is allowed in the configured and active account lists; v0.23.1 is ready. No configuration or data was changed. OAuth user login remains to be tested.'
