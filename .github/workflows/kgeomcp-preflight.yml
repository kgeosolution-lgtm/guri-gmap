name: kgeoMCP proxy diagnosis
on:
  push:
    branches: [codex/kgeomcp-server-bootstrap]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 3
    steps:
      - name: Inspect new endpoint response only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach($url in @('http://127.0.0.1:4187/app/kgeomcp/health.json','http://127.0.0.1/app/kgeomcp/health.json')) {
            try { $r=Invoke-WebRequest -UseBasicParsing -Uri $url -Headers @{Host='kgeodata.com'} -MaximumRedirection 0; Write-Output ($url+' HTTP '+$r.StatusCode); Write-Output $r.Content } catch { Write-Output ('Local proxy error: '+$_.Exception.Message); if($_.ErrorDetails.Message){Write-Output ($_.ErrorDetails.Message -replace '<[^>]+>',' ')} }
          }
