name: kgeoMCP prepare Git startup
on:
  push:
    branches: [codex/kgeomcp-server-bootstrap]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 3
    steps:
      - name: Prepare administrator startup command
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script = @'
          param([switch]$Apply)
          $ErrorActionPreference='Stop'
          $runnerRoot='D:\actions-runner-kgeomcp'
          $gate='D:\services\kgeo-mcp-deploy-gate\runner-job-gate.ps1'
          $taskName='KGEO-MCP-GitRunner'
          $runner=Get-Content -LiteralPath (Join-Path $runnerRoot '.runner') -Raw | ConvertFrom-Json
          if($runner.gitHubUrl -ne 'https://github.com/kgeosolution-lgtm/kgeoMCP' -or $runner.agentName -ne 'kgeodata-kgeomcp'){throw 'Unexpected registered runner'}
          if(!(Test-Path -LiteralPath $gate)){throw 'Production workflow gate is missing'}
          $listener=Join-Path $runnerRoot 'bin\Runner.Listener.exe'
          if(!(Test-Path -LiteralPath $listener)){throw 'Runner application is missing'}
          if((Get-Content -LiteralPath (Join-Path $runnerRoot '.env') -Raw).Trim() -ne ('ACTIONS_RUNNER_HOOK_JOB_STARTED='+$gate)){throw 'Runner gate configuration mismatch'}
          if(Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue){throw 'Task already exists; inspect before repeating setup'}
          Write-Output 'Impact: create only KGEO-MCP-GitRunner at startup as NETWORK SERVICE. Existing connector, ArcGIS, IIS and static sites are preserved.'
          Write-Output 'Recovery: Stop-ScheduledTask -TaskName KGEO-MCP-GitRunner; Disable-ScheduledTask -TaskName KGEO-MCP-GitRunner'
          if(!$Apply){Write-Output 'Preflight passed. Run with -Apply from Administrator PowerShell.';exit 0}
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          if(!(New-Object Security.Principal.WindowsPrincipal($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){throw 'Administrator PowerShell is required to register the startup task'}
          $action=New-ScheduledTaskAction -Execute $listener -Argument 'run' -WorkingDirectory $runnerRoot
          $trigger=New-ScheduledTaskTrigger -AtStartup
          $principal=New-ScheduledTaskPrincipal -UserId 'NT AUTHORITY\NETWORK SERVICE' -LogonType ServiceAccount -RunLevel Limited
          $settings=New-ScheduledTaskSettingsSet -ExecutionTimeLimit ([TimeSpan]::Zero) -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1) -MultipleInstances IgnoreNew -StartWhenAvailable
          Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal -Settings $settings | Out-Null
          Start-ScheduledTask -TaskName $taskName
          Start-Sleep -Seconds 5
          Get-ScheduledTask -TaskName $taskName | Select-Object TaskName,State
          Write-Output 'Task created. Next verify the private GitHub runner is online and run the production workflow; Running alone is not deployment acceptance.'
          '@
          $file='D:\services\kgeo-mcp-remote\enable-git-deploy.ps1'
          [IO.File]::WriteAllText($file,$script,(New-Object Text.UTF8Encoding($false)))
          & $file
