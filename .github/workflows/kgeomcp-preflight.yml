name: kgeoMCP private runner bootstrap
on:
  push:
    branches: [codex/kgeomcp-server-bootstrap]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 12
    steps:
      - name: Register isolated private repository runner
        shell: powershell
        env:
          KGEO_RUNNER_REGISTRATION: ${{ secrets.KGEOMCP_RUNNER_REGISTRATION }}
        run: |
          $ErrorActionPreference='Stop'
          $temporary=Join-Path $env:RUNNER_TEMP 'kgeomcp-private-runner-bootstrap'
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null
          $script = @'
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $runnerRoot='D:\actions-runner-kgeomcp'
          $gateRoot='D:\services\kgeo-mcp-deploy-gate'
          if(Test-Path -LiteralPath $runnerRoot){throw 'Private runner directory already exists; inspect before repeating installation'}
          if(!$env:KGEO_RUNNER_REGISTRATION){throw 'Short-lived runner registration token is required'}
          Write-Output 'Impact: add one private-repository deployment runner service. Existing ArcGIS and connector tasks are not restarted.'
          foreach($directory in @($runnerRoot,$gateRoot)){
           New-Item -ItemType Directory -Path $directory -Force | Out-Null
           & icacls.exe $directory /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-20:(OI)(CI)F' | Out-Null
           if($LASTEXITCODE -ne 0){throw 'Private runner ACL setup failed'}
          }
          $archive=Join-Path $runnerRoot 'runner.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/actions/runner/releases/download/v2.337.0/actions-runner-win-x64-2.337.0.zip' -OutFile $archive
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1150692afa94e71f872017e254ea55b6eece1eece3fe7e3a6d4c93d0a1b85cfc'){throw 'Official runner archive checksum mismatch'}
          Expand-Archive -LiteralPath $archive -DestinationPath $runnerRoot
          $gatePath=Join-Path $gateRoot 'runner-job-gate.ps1'
          Copy-Item -LiteralPath (Join-Path $PSScriptRoot 'runner-job-gate.ps1') -Destination $gatePath
          # The job account may read the gate but may not rewrite it.
          & icacls.exe $gateRoot /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-20:(OI)(CI)RX' | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Runner gate ACL setup failed'}
          [IO.File]::WriteAllText((Join-Path $runnerRoot '.env'),('ACTIONS_RUNNER_HOOK_JOB_STARTED='+$gatePath+[Environment]::NewLine),(New-Object Text.UTF8Encoding($false)))
          Push-Location $runnerRoot
          try {
           & .\config.cmd --unattended --url 'https://github.com/kgeosolution-lgtm/kgeoMCP' --token $env:KGEO_RUNNER_REGISTRATION --name 'kgeodata-kgeomcp' --labels 'kgeomcp-production' --work '_work' --runasservice --windowslogonaccount 'NT AUTHORITY\NETWORK SERVICE'
           if($LASTEXITCODE -ne 0){throw 'Private runner registration failed'}
          } finally {$env:KGEO_RUNNER_REGISTRATION=$null;Pop-Location}
          $service=@(Get-Service -Name 'actions.runner.kgeosolution-lgtm-kgeoMCP.kgeodata-kgeomcp' -ErrorAction Stop)
          if($service.Count -ne 1){throw 'Expected one private runner service'}
          if($service[0].Status -ne 'Running'){Start-Service -Name $service[0].Name}
          Write-Output ('Private deployment runner installed. Recovery: Stop-Service -Name '+$service[0].Name)
          '@
          [IO.File]::WriteAllText((Join-Path $temporary 'install-private-runner.ps1'),$script,(New-Object Text.UTF8Encoding($false)))
          $script = @'
          $ErrorActionPreference='Stop'
          # Installed outside the runner checkout. Reject jobs before any workflow steps run.
          if($env:GITHUB_REPOSITORY -cne 'kgeosolution-lgtm/kgeoMCP' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_REF -cne 'refs/heads/codex/production' -or
             $env:GITHUB_WORKFLOW -cne 'kgeoMCP production' -or
             $env:GITHUB_WORKFLOW_REF -cne 'kgeosolution-lgtm/kgeoMCP/.github/workflows/deploy-remote.yml@refs/heads/codex/production'){
           Write-Error 'This runner accepts only the private kgeoMCP production push workflow.'
           exit 1
          }
          Write-Output 'Private production workflow gate passed.'
          '@
          [IO.File]::WriteAllText((Join-Path $temporary 'runner-job-gate.ps1'),$script,(New-Object Text.UTF8Encoding($false)))
          & (Join-Path $temporary 'install-private-runner.ps1')
