name: kgeoMCP health-only proxy diagnosis
on:
  push:
    branches: [codex/kgeomcp-server-bootstrap]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 5
    steps:
      - name: kgeoMCP health-only proxy diagnosis
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $file='D:\codesolution\kgeodata\kgeomcp\web.config'
          $private='D:\services\kgeo-mcp-remote'
          Copy-Item -LiteralPath $file -Destination (Join-Path $private 'proxy-before-diagnosis.config')
          $original=Get-Content -LiteralPath $file -Raw
          $healthOnly='<?xml version="1.0" encoding="UTF-8"?><configuration><system.webServer><rewrite><rules><clear /><rule name="KGEO health diagnosis" stopProcessing="true"><match url="^health.json$"/><action type="Rewrite" url="http://127.0.0.1:4187/app/kgeomcp/health.json" /></rule><rule name="KGEO temporary maintenance" stopProcessing="true"><match url=".*"/><action type="CustomResponse" statusCode="503" statusReason="Maintenance" statusDescription="Setup verification" /></rule></rules></rewrite><httpErrors existingResponse="PassThrough" /></system.webServer></configuration>'
          [IO.File]::WriteAllText($file,$healthOnly,(New-Object Text.UTF8Encoding($false)))
          try{$r=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1/app/kgeomcp/health.json' -Headers @{Host='kgeodata.com'};Write-Output ('Health-only proxy HTTP '+$r.StatusCode);Write-Output $r.Content}catch{Write-Output ('Health-only proxy failed: '+$_.Exception.Message)}
          Write-Output 'OAuth and MCP remain disabled by the maintenance rule.'
          
