name: kgeoMCP approved Esri maintenance
on:
  push:
    branches: [codex/kgeomcp-server-bootstrap]
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: Verify elevation and apply prepared installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          $elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          [ordered]@{machine=$env:COMPUTERNAME;administrator=$elevated;operation='approved_esri_maintenance'} | ConvertTo-Json -Compress
          & 'D:\services\kgeo-mcp-remote\inspect-esri-host.ps1'
          if(!$elevated){throw 'ELEVATED_ADMINISTRATOR_CONSOLE_REQUIRED: installation and restart not attempted.'}
          & 'D:\services\kgeo-mcp-remote\enable-esri-mcp.ps1' -Apply
          Invoke-RestMethod 'https://kgeodata.com/server/rest/info?f=json' | Select-Object currentVersion | ConvertTo-Json -Compress
