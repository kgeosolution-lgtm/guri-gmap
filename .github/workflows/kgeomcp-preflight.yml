name: kgeoMCP read-only TLS diagnosis
on:
  push:
    branches: [codex/kgeomcp-server-bootstrap]
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 3
    steps:
      - name: Inspect certificate names and validated routes
        shell: powershell
        run: |
          @'
          const https=require('node:https'),tls=require('node:tls');
          const socket=tls.connect({host:'KGO-GIS',port:7443,rejectUnauthorized:false},()=>{const c=socket.getPeerCertificate();console.log(JSON.stringify({operation:'certificate_metadata_only',host:'KGO-GIS',subject:c.subject,subjectAltName:c.subjectaltname,issuer:c.issuer,validTo:c.valid_to,hostnameMatches:!tls.checkServerIdentity('KGO-GIS',c)}));socket.end()});
          socket.setTimeout(10000,()=>socket.destroy());socket.on('error',e=>console.log(JSON.stringify({operation:'certificate_metadata_only',error:e.code})));
          for(const url of ['https://kgeodata.com:7443/arcgis/sharing/rest/portals/self?f=json','https://kgeodata.com/portal/sharing/rest/portals/self?f=json']){
            const req=https.get(url,{timeout:12000,rejectUnauthorized:true},res=>{let body='';res.on('data',d=>{if(body.length<100000)body+=d});res.on('end',()=>{let value;try{value=JSON.parse(body)}catch{value={nonJson:true}};console.log(JSON.stringify({operation:'strict_tls_read_only',url,status:res.statusCode,portalId:value.id,isPortal:value.isPortal,errorCode:value.error?.code,nonJson:value.nonJson}));});});req.on('timeout',()=>req.destroy(new Error('timeout')));req.on('error',e=>console.log(JSON.stringify({operation:'strict_tls_read_only',url,error:e.code||e.message})));
          }
          '@ | node
