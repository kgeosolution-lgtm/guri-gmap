name: NGII remaining-extract-start-1111
on:
  push:
    branches: [codex/ngiiseum-remaining-extract-start-1111-20261109]
    paths: [.github/workflows/ngiiseum-remaining-extract-start-1111-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: remaining-extract-start-1111
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $root='D:\services\ngiiseum\data\remaining-drawings-20261111'
          if(Test-Path (Join-Path $root 'extract-progress.json')){throw 'EXISTING_EXTRACTION_INSPECT_FIRST'}
          [IO.File]::WriteAllBytes((Join-Path $root 'extract.py'),[Convert]::FromBase64String(''))
          $py='D:\services\ngiiseum\data\real50-20261109\python\python.exe'
          $env:RUNNER_TRACKING_ID=''
          $p=Start-Process -FilePath $py -ArgumentList @((Join-Path $root 'extract.py')) -WorkingDirectory $root -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $root 'extract.stdout.log') -RedirectStandardError (Join-Path $root 'extract.stderr.log')
          Start-Sleep -Seconds 2
          if($p.HasExited){throw 'EXTRACT_EXITED'}
          [ordered]@{started=$true;pid=$p.Id;databaseChanged=$false}|ConvertTo-Json -Compress
          
