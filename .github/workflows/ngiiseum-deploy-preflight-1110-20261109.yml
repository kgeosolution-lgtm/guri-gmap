name: NGII deploy-preflight-1110
on:
  push:
    branches: [codex/ngiiseum-deploy-preflight-1110-20261109]
    paths: [.github/workflows/ngiiseum-deploy-preflight-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: deploy-preflight-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'Host boundary'}
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=New-Object Security.Principal.WindowsPrincipal($identity)
          $services=@(Get-CimInstance Win32_Service | Where-Object {$_.Name -like 'actions.runner.*'} | Select-Object Name,State,StartName)
          $runnerBase=[IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP '..\..'))
          $newRoot='D:\services\ngiiseum-runner'
          [pscustomobject]@{host=$env:COMPUTERNAME;identity=$identity.Name;administrator=$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator);services=$services;node=(& node.exe --version);git=(& git.exe --version);runnerBase=$runnerBase;newRootExists=(Test-Path -LiteralPath $newRoot);current=(Get-Content -LiteralPath 'D:\services\ngiiseum\current.json' -Raw|ConvertFrom-Json).commit} | ConvertTo-Json -Depth 5 -Compress
          
