name: NGII drawing-bounded-progress-1110
on:
  push:
    branches: [codex/ngiiseum-drawing-bounded-progress-1110-20261109]
    paths: [.github/workflows/ngiiseum-drawing-bounded-progress-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: drawing-bounded-progress-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $work='D:\services\ngiiseum\data\review-expansion-20261110\preview-preparation'
          if(Test-Path (Join-Path $work 'render-progress.json')){Get-Content (Join-Path $work 'render-progress.json') -Raw}
          @{receipt=(Test-Path (Join-Path $work 'render-receipt.json'));generated=@(Get-ChildItem (Join-Path $work 'generated-bounded') -Directory).Count;checkedAt=[DateTime]::UtcNow.ToString('o')}|ConvertTo-Json -Compress
          if(Test-Path (Join-Path $work 'render-bounded.private.log')){Get-Content (Join-Path $work 'render-bounded.private.log') -Tail 8}
          
