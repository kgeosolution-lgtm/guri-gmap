name: NGII drawing-preview-diagnose-1110
on:
  push:
    branches: [codex/ngiiseum-drawing-preview-diagnose-1110-20261109]
    paths: [.github/workflows/ngiiseum-drawing-preview-diagnose-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: drawing-preview-diagnose-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $work='D:\services\ngiiseum\data\review-expansion-20261110\preview-preparation'
          Get-Content -LiteralPath (Join-Path $work 'render.private.log') -Tail 22
          @{generatedDirectories=@(Get-ChildItem (Join-Path $work 'generated') -Directory -ErrorAction SilentlyContinue).Count;resultPresent=(Test-Path (Join-Path $work 'render-results.json'))}|ConvertTo-Json -Compress
          
