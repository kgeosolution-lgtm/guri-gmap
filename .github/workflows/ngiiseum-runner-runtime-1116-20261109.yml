name: NGII runner-runtime-1116
on:
  push:
    branches: [codex/ngiiseum-runner-runtime-1116-20261109]
    paths: [.github/workflows/ngiiseum-runner-runtime-1116-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: runner-runtime-1116
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'Host boundary'}
          $r='D:\services\ngiiseum-runner'
          $p=Get-CimInstance Win32_Process -Filter 'ProcessId=11612'
          $owner=Invoke-CimMethod -InputObject $p -MethodName GetOwner
          $super=Get-CimInstance Win32_Process -Filter 'ProcessId=1084'
          $superOwner=Invoke-CimMethod -InputObject $super -MethodName GetOwner
          $v=& (Join-Path $r 'bin\Runner.Listener.exe') --version 2>&1|ForEach-Object {[string]$_}
          [pscustomobject]@{owner=[pscustomobject]@{code=$owner.ReturnValue;user=$owner.User;domain=$owner.Domain};supervisorOwner=[pscustomobject]@{code=$superOwner.ReturnValue;user=$superOwner.User;domain=$superOwner.Domain};listenerVersion=$v;exit=$LASTEXITCODE;taskPrincipal=(Get-ScheduledTask -TaskName 'NGII-Seumter-Gateway').Principal.UserId;workerPresent=@(Get-CimInstance Win32_Process -Filter "Name='Runner.Worker.exe'"|Select-Object ProcessId,ParentProcessId)}|ConvertTo-Json -Depth 4 -Compress
          
