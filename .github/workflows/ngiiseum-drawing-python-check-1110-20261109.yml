name: NGII drawing-python-check-1110
on:
  push:
    branches: [codex/ngiiseum-drawing-python-check-1110-20261109]
    paths: [.github/workflows/ngiiseum-drawing-python-check-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: drawing-python-check-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $python=(Get-Content 'D:\services\ngiiseum\real-review.local.json' -Raw|ConvertFrom-Json).python
          & $python -c 'import sys,json,importlib.util;print(json.dumps(dict(python=list(sys.version_info[:3]),modules={n:importlib.util.find_spec(n) is not None for n in ["pip","ezdxf","fontTools","numpy","pyparsing","typing_extensions","shapely"]})))'
          if($LASTEXITCODE -ne 0){throw 'PYTHON_CHECK_FAILED'}
          
