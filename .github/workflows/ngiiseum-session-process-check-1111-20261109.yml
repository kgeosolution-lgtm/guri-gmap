name: NGII session-process-check-1111
on:
  push:
    branches: [codex/ngiiseum-session-process-check-1111-20261109]
    paths: [.github/workflows/ngiiseum-session-process-check-1111-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: session-process-check-1111
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $root='D:\services\ngiiseum'
          $s=Get-Content (Join-Path $root 'process.json') -Raw|ConvertFrom-Json
          $c=Get-CimInstance Win32_Process -Filter ('ProcessId='+[int]$s.childPid)
          $p=Get-CimInstance Win32_Process -Filter ('ProcessId='+[int]$s.supervisorPid)
          [ordered]@{runtime=$s.commit;childName=$c.Name;childParent=$c.ParentProcessId;supervisorPid=$s.supervisorPid;supervisorName=$p.Name;childEntryMatches=($c.CommandLine.Replace('/','\') -like ('*'+$root+'\releases\'+$s.commit+'\server\online.mjs*'));supervisorEntryMatches=($p.CommandLine.Replace('/','\') -like ('*'+$root+'\run-gateway.ps1*'));socketOwner=@(Get-NetTCPConnection -LocalPort 4190 -State Listen|ForEach-Object {$_.OwningProcess});childPid=$s.childPid;encryptedStore=(Test-Path (Join-Path $root 'auth-sessions/sessions.enc'))}|ConvertTo-Json -Compress
