name: NGII review-runner-state-two-1110
on:
  push:
    branches: [codex/ngiiseum-review-runner-state-two-1110-20261109]
    paths: [.github/workflows/ngiiseum-review-runner-state-two-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: review-runner-state-two-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'Host boundary'}
          $root='D:\services\ngiiseum-runner'
          $registration=Get-Content -LiteralPath (Join-Path $root '.runner') -Raw | ConvertFrom-Json
          $processes=@(Get-CimInstance Win32_Process | Where-Object {($_.ExecutablePath -like ($root+'\*')) -or ($_.Name -eq 'powershell.exe' -and $_.CommandLine -like '*\ngiiseum\start-review-runner.ps1*')} | Select-Object Name,ProcessId,ParentProcessId,ExecutablePath)
          $state=Get-Content -LiteralPath (Join-Path $root 'supervisor.json') -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          [pscustomobject]@{registration=[pscustomobject]@{name=$registration.agentName;url=$registration.gitHubUrl};processes=$processes;supervisor=$state;stop=(Test-Path -LiteralPath (Join-Path $root 'stop.request'));stdout=@(Get-Content -LiteralPath (Join-Path $root 'listener.stdout.log') -Tail 12 -ErrorAction SilentlyContinue | ForEach-Object {[string]$_});stderr=@(Get-Content -LiteralPath (Join-Path $root 'listener.stderr.log') -Tail 12 -ErrorAction SilentlyContinue | ForEach-Object {[string]$_});helperErrors=@(Get-Content -LiteralPath 'D:\services\ngiiseum\review-runner.stderr.log' -Tail 12 -ErrorAction SilentlyContinue | ForEach-Object {[string]$_})}|ConvertTo-Json -Depth 5 -Compress
          
          Get-CimInstance Win32_Process -Filter "ProcessId=29224" | Select-Object Name,ProcessId,ParentProcessId,ExecutablePath | ConvertTo-Json -Compress
          
