name: NGII drawing-python-file-check-1110
on:
  push:
    branches: [codex/ngiiseum-drawing-python-file-check-1110-20261109]
    paths: [.github/workflows/ngiiseum-drawing-python-file-check-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: drawing-python-file-check-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $file='D:\services\ngiiseum\drawing-ingest-20261110\python-check.py'
          [IO.File]::WriteAllBytes($file,[Convert]::FromBase64String(''))
          $python=(Get-Content 'D:\services\ngiiseum\real-review.local.json' -Raw|ConvertFrom-Json).python
          & $python $file
          if($LASTEXITCODE -ne 0){throw 'PYTHON_CHECK_FAILED'}
          
