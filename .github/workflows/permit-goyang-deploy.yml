name: Permit Goyang deployment
on:
  push:
    branches: [codex/permit-goyang-deploy]
    paths: [.github/workflows/permit-goyang-deploy.yml]
permissions:
  contents: read
concurrency:
  group: permit-goyang-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: permit_goyang
      - name: Verify and install into IIS folder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($env:COMPUTERNAME -ne 'KGO-GIS') { throw 'Unexpected server' }
          $target = 'D:\codesolution\kgeodata\permit_goyang'
          $backupRoot = 'D:\codesolution\_deploy_backup\permit_goyang'
          New-Item -ItemType Directory -Force -Path $backupRoot | Out-Null

          $src = Join-Path $env:GITHUB_WORKSPACE 'permit_goyang'
          $expected = [ordered]@{
            'assets/app.css' = '673afe222abeca6b44359a767a003849c5a7e97061ec826580787cfb6d391ef5'
            'assets/app.js' = '18bb46f1c28e0093cd90281065be2672d911e640404f9ae71a5820eaf45d497f'
            'assets/gy_data.js' = '5d7e33cf0fd17fb0ff62934802a2c443f1459b1caba3ae87cb4b21016d647718'
            'assets/rules.js' = '90c672d9e10c607e3017c0d39741bd19365b1b1b77510168efbcfef3f136c351'
            'index.html' = '22b410ebdc0c8fd346cc443979af89df6acaad740ed23e00f4a9b6d644adbbd0'
            'web.config' = '216e727d9ae34fdf499be4fa06b962ef68f91cd3e8a1a7c1003c6f840e9af398'
          }
          function Test-Tree($root, $label) {
            foreach ($k in $expected.Keys) {
              $p = Join-Path $root ($k -replace '/', '\')
              if (-not (Test-Path -LiteralPath $p)) { throw "$label missing: $k" }
              $h = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($h -ne $expected[$k]) { throw "$label hash mismatch: $k" }
            }
            $actual = Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\', '/') }
            foreach ($f in $actual) { if (-not $expected.Contains($f)) { throw "$label unexpected file: $f" } }
          }
          Test-Tree $src 'source'
          if (Test-Path -LiteralPath $target) {
            $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
            $bk = Join-Path $backupRoot $stamp
            New-Item -ItemType Directory -Force -Path $bk | Out-Null
            robocopy $target $bk /E /R:2 /W:2 /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw 'backup failed' }
            "BACKUP=$bk"
          }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          robocopy $src $target /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw 'copy failed' }
          Test-Tree $target 'installed'
          Get-ChildItem -LiteralPath $backupRoot -Directory | Sort-Object Name -Descending | Select-Object -Skip 15 | Remove-Item -Recurse -Force
          "DEPLOYED files=$($expected.Count)"
          exit 0
