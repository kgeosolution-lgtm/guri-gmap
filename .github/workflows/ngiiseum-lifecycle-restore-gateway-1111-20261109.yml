name: NGII lifecycle-restore-gateway-1111
on:
  push:
    branches: [codex/ngiiseum-lifecycle-restore-gateway-1111-20261109]
    paths: [.github/workflows/ngiiseum-lifecycle-restore-gateway-1111-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: lifecycle-restore-gateway-1111
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $root='D:\services\ngiiseum'
          $pointer=Get-Content (Join-Path $root 'current.json') -Raw|ConvertFrom-Json
          if($pointer.commit -ne '397824e1741749befd202e45f5f2d6077d0517f1'){throw 'POINTER_CHANGED'}
          $owned=@(Get-CimInstance Win32_Process|Where-Object {$_.Name -eq 'powershell.exe' -and $_.CommandLine -like '*D:\services\ngiiseum\run-gateway.ps1*'})
          if($owned.Count -or (Get-NetTCPConnection -LocalPort 4190 -State Listen -ErrorAction SilentlyContinue)){throw 'ALREADY_ACTIVE'}
          if(Test-Path (Join-Path $root 'stop.request')){throw 'STOP_REQUEST_PRESENT'}
          $task=Get-ScheduledTask -TaskName 'NGII-Seumter-Gateway'
          if(-not ($task.Actions.Arguments -like '*D:\services\ngiiseum\run-gateway.ps1*')){throw 'TASK_PATH_MISMATCH'}
          Start-ScheduledTask -TaskName 'NGII-Seumter-Gateway'
          $live=$null
          for($i=0;$i -lt 25;$i++){Start-Sleep -Seconds 2;try{$live=Invoke-RestMethod 'https://kgeodata.com/app/ngiiseum/deployment.json' -TimeoutSec 3;if($live.commit -eq $pointer.commit){break}}catch{}}
          if($live.commit -ne $pointer.commit){throw 'GATEWAY_RECOVERY_UNVERIFIED'}
          [ordered]@{restored=$true;commit=$live.commit;drawings=$live.reviewPilot.drawings;positions=$live.reviewPilot.withPosition;writesEnabled=$live.writesEnabled;catalogDatabaseMigrated=$live.catalogDatabaseMigrated;checkedAt=[DateTime]::UtcNow.ToString('o')}|ConvertTo-Json -Compress
          
