name: NGII Seumter content deployment 959d083476e4
on:
  push:
    branches: [codex/ngiiseum-959d083476e4]
    paths: [.github/workflows/ngiiseum-959d083476e4.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: Install the verified NGII Seumter archive in its separate IIS folder
        shell: powershell
        env:
          NGIISEUM_ARCHIVE_URL: ${{ secrets.NGII_SEUMTER_ARCHIVE_959D083476E4 }}
          NGIISEUM_READ_BRIDGE_TOKEN: ${{ secrets.NGII_SEUMTER_READ_959D083476E4 }}

        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          if ($env:COMPUTERNAME -ne 'KGO-GIS') { throw 'Unexpected server' }
          $tempRoot=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $work=[IO.Path]::GetFullPath((Join-Path $tempRoot ('ngiiseum-'+[Guid]::NewGuid().ToString('N'))))
          if (-not $work.StartsWith($tempRoot+'\',[StringComparison]::OrdinalIgnoreCase)) { throw 'Temporary path boundary failed' }
          New-Item -ItemType Directory -Path $work | Out-Null
          try {
            $zip=Join-Path $work 'source.zip'
            try { Invoke-WebRequest -UseBasicParsing -Uri $env:NGIISEUM_ARCHIVE_URL -OutFile $zip -TimeoutSec 60 } catch { throw 'Private archive download failed; no address logged' }
            $env:NGIISEUM_ARCHIVE_URL=$null
            if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '17d43194ebd320a3e474f099d7e778ed5d0110aba7bb379b01fd63e93a56133c') { throw 'Source archive checksum mismatch' }
            $expanded=Join-Path $work 'source'
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive=[IO.Compression.ZipFile]::OpenRead($zip)
            try {
              foreach ($entry in $archive.Entries) {
                $dest=[IO.Path]::GetFullPath((Join-Path $expanded $entry.FullName))
                if (-not $dest.StartsWith($expanded+'\',[StringComparison]::OrdinalIgnoreCase)) { throw 'Archive path escape' }
              }
            } finally { $archive.Dispose() }
            Expand-Archive -LiteralPath $zip -DestinationPath $expanded
            $roots=@(Get-ChildItem -LiteralPath $expanded -Directory)
            if ($roots.Count -ne 1) { throw 'Unexpected archive layout' }
            & (Join-Path $roots[0].FullName 'deploy\install-iis.ps1') -SourceRoot $roots[0].FullName -SourceCommit '959d083476e4be9e98a9ec2ac5fd8e598376d9b6' -Apply
          } finally {
            $env:NGIISEUM_ARCHIVE_URL=$null
            if ($work.StartsWith($tempRoot+'\',[StringComparison]::OrdinalIgnoreCase) -and (Test-Path -LiteralPath $work)) { Remove-Item -LiteralPath $work -Recurse -Force }
          }
