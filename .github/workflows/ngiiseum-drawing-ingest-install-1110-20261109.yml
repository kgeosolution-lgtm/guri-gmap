name: NGII drawing-ingest-install-1110
on:
  push:
    branches: [codex/ngiiseum-drawing-ingest-install-1110-20261109]
    paths: [.github/workflows/ngiiseum-drawing-ingest-install-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: drawing-ingest-install-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $service='D:\services\ngiiseum'
          $root=Join-Path $service 'drawing-ingest-20261110'
          $web='D:\codesolution\kgeodata\ngiiseum\web.config'
          $lock=[IO.File]::Open((Join-Path $service 'install.lock'),[IO.FileMode]::OpenOrCreate,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)
          try{
           if(Test-Path -LiteralPath $root){throw 'EXISTING_INGEST_INSPECT_FIRST'}
           if(@(Get-NetTCPConnection -LocalPort 4193 -State Listen -ErrorAction SilentlyContinue).Count){throw 'PORT_OCCUPIED'}
           if((Get-FileHash $web -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0dc85233bae785022f6b634b1f3d7fb6ed086d1a4b30db61769d14c3c3043d5a'){throw 'IIS_CHANGED'}
           $before=Invoke-RestMethod 'https://kgeodata.com/app/ngiiseum/deployment.json'
           $current=Get-Content (Join-Path $service 'current.json') -Raw|ConvertFrom-Json
           if($before.commit -ne $current.commit -or -not $before.catalogDatabaseMigrated -or $before.reviewPilot.drawings -ne 50){throw 'LIVE_BOUNDARY_CHANGED'}
           $configHash=(Get-FileHash (Join-Path $service 'online.local.json') -Algorithm SHA256).Hash
           New-Item -ItemType Directory -Path $root|Out-Null
           $release=Join-Path $service ('releases\'+$current.commit+'\server')
           foreach($file in @('data-transfer.mjs','data-transfer-batch.mjs','read-bridge.mjs')){Copy-Item -LiteralPath (Join-Path $release $file) -Destination (Join-Path $root $file)}
           [IO.File]::WriteAllBytes((Join-Path $root 'manifest.json'),[Convert]::FromBase64String(''))
           if((Get-FileHash (Join-Path $root 'manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b9948b59ba0e9992702f3c803888835962e91ee1954eb079aafba100158f5ada'){throw 'MANIFEST_HASH'}
           [IO.File]::WriteAllBytes((Join-Path $root 'ingest.mjs'),[Convert]::FromBase64String(''))
           $env:RUNNER_TRACKING_ID=''
           $child=Start-Process -FilePath (Get-Command node.exe).Source -ArgumentList @((Join-Path $root 'ingest.mjs')) -WorkingDirectory $root -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $root 'stdout.log') -RedirectStandardError (Join-Path $root 'stderr.log')
           $ready=$false
           for($i=0;$i -lt 15;$i++){try{Invoke-WebRequest 'http://127.0.0.1:4193/_drawing-ingest/status' -UseBasicParsing|Out-Null}catch{if($_.Exception.Response.StatusCode.value__ -eq 401){$ready=$true;break}};Start-Sleep -Seconds 1}
           if(-not $ready){throw 'INGEST_NOT_READY'}
           [xml]$xml=[IO.File]::ReadAllText($web)
           $rules=$xml.configuration.'system.webServer'.rewrite.rules
           $rule=$xml.CreateElement('rule');$rule.SetAttribute('name','NGII dedicated drawing intake 20261110');$rule.SetAttribute('stopProcessing','true')
           $match=$xml.CreateElement('match');$match.SetAttribute('url','^_drawing-ingest/(.*)$');[void]$rule.AppendChild($match)
           $action=$xml.CreateElement('action');$action.SetAttribute('type','Rewrite');$action.SetAttribute('url','http://127.0.0.1:4193/_drawing-ingest/{R:1}');$action.SetAttribute('appendQueryString','true');[void]$rule.AppendChild($action)
           [void]$rules.PrependChild($rule)
           $temp=$web+'.drawing-ingest.tmp';$xml.Save($temp)
           [IO.File]::Replace($temp,$web,(Join-Path $root 'web.config.before'))
           try{
            $unauth=$false;try{Invoke-WebRequest 'https://kgeodata.com/app/ngiiseum/_drawing-ingest/status' -UseBasicParsing|Out-Null}catch{if($_.Exception.Response.StatusCode.value__ -eq 401){$unauth=$true}}
            if(-not $unauth){throw 'HTTPS_AUTH_BOUNDARY'}
            $after=Invoke-RestMethod 'https://kgeodata.com/app/ngiiseum/deployment.json'
            if($before.commit -ne $after.commit -or $after.reviewPilot.drawings -ne 50 -or -not $after.writesEnabled -or (Get-FileHash (Join-Path $service 'online.local.json') -Algorithm SHA256).Hash -ne $configHash){throw 'EXISTING_SERVICE_CHANGED'}
           }catch{Copy-Item -LiteralPath (Join-Path $root 'web.config.before') -Destination $web -Force;Stop-Process -Id $child.Id;throw}
           [ordered]@{ready=$true;pid=$child.Id;manifestSha256='b9948b59ba0e9992702f3c803888835962e91ee1954eb079aafba100158f5ada';files=22;bytes=21502004301;existingGatewayPreserved=$true;databaseChanged=$false;unauthenticatedStatus=401;dedicatedPath='/app/ngiiseum/_drawing-ingest/';checkedAt=[DateTime]::UtcNow.ToString('o')}|ConvertTo-Json -Compress
          }finally{$lock.Dispose()}
          
