name: NGII drawing-preview-detail-1110
on:
  push:
    branches: [codex/ngiiseum-drawing-preview-detail-1110-20261109]
    paths: [.github/workflows/ngiiseum-drawing-preview-detail-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: drawing-preview-detail-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $work='D:\services\ngiiseum\data\review-expansion-20261110\preview-preparation'
          @{processes=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Select-Object ProcessId,ParentProcessId,CreationDate,KernelModeTime,UserModeTime,WorkingSetSize,ReadTransferCount,WriteTransferCount);files=@(Get-ChildItem (Join-Path $work 'generated-recovery') -File -Recurse|Select-Object Name,Length,LastWriteTime);receipt=(Test-Path (Join-Path $work 'render-receipt.json'));failureLog=(Test-Path (Join-Path $work 'render-recovery.private.log'))}|ConvertTo-Json -Depth 5 -Compress
          if(Test-Path (Join-Path $work 'render-recovery.private.log')){Get-Content (Join-Path $work 'render-recovery.private.log') -Tail 12}
          
