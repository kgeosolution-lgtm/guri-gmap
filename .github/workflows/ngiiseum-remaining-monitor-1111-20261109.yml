name: NGII remaining-monitor-1111
on:
  push:
    branches: [codex/ngiiseum-remaining-monitor-1111-20261109]
    paths: [.github/workflows/ngiiseum-remaining-monitor-1111-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: remaining-monitor-1111
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $root='D:\services\ngiiseum\data\remaining-drawings-20261111'
          $live=Invoke-RestMethod 'https://kgeodata.com/app/ngiiseum/deployment.json'
          $extract=$null
          if(Test-Path (Join-Path $root 'extract-progress.json')){$extract=Get-Content (Join-Path $root 'extract-progress.json') -Raw|ConvertFrom-Json}
          [ordered]@{checkedAt=[DateTime]::UtcNow.ToString('o');runtime=$live.commit;drawings=$live.reviewPilot.drawings;writesEnabled=$live.writesEnabled;extract=$extract;freeBytes=(Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='D:'").FreeSpace}|ConvertTo-Json -Depth 6 -Compress
          
