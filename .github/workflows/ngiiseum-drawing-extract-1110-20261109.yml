name: NGII drawing-extract-1110
on:
  push:
    branches: [codex/ngiiseum-drawing-extract-1110-20261109]
    paths: [.github/workflows/ngiiseum-drawing-extract-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: drawing-extract-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $root='D:\services\ngiiseum\drawing-ingest-20261110'
          $dest='D:\services\ngiiseum\data\review-expansion-20261110'
          if(Test-Path -LiteralPath $dest){throw 'EXISTING_DATASET_INSPECT_FIRST'}
          $script=Join-Path $root 'extract-expansion.py'
          if(Test-Path -LiteralPath $script){throw 'EXISTING_SCRIPT_INSPECT_FIRST'}
          [IO.File]::WriteAllBytes($script,[Convert]::FromBase64String(''))
          if((Get-FileHash -LiteralPath $script).Hash.ToLowerInvariant() -ne 'c6f47e9058ecbf60953d1382cdd28deca34f7b70c8c84617e66a0fb1294614ac'){throw 'SCRIPT_HASH'}
          $cfg=Get-Content 'D:\services\ngiiseum\real-review.local.json' -Raw|ConvertFrom-Json
          $startup=New-CimInstance -ClassName Win32_ProcessStartup -ClientOnly -Property @{ShowWindow=[UInt16]0}
          $r=Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{CommandLine=('"'+$cfg.python+'" "'+$script+'"');CurrentDirectory=$root;ProcessStartupInformation=$startup}
          if($r.ReturnValue -ne 0){throw 'EXTRACT_START_FAILED'}
          @{started=$true;pid=$r.ProcessId;scriptSha256='c6f47e9058ecbf60953d1382cdd28deca34f7b70c8c84617e66a0fb1294614ac';existingDatabaseChanged=$false}|ConvertTo-Json -Compress
          
