name: NGII map-release-observe-1111
on:
  push:
    branches: [codex/ngiiseum-map-release-observe-1111-20261109]
    paths: [.github/workflows/ngiiseum-map-release-observe-1111-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: map-release-observe-1111
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $processes=@(Get-CimInstance Win32_Process|Where-Object {$_.Name -in @('node.exe','powershell.exe','python.exe') -and $_.CommandLine -match 'ngiiseum|gateway.test|persistent-session|npm-cli|vite'}|ForEach-Object{[ordered]@{pid=$_.ProcessId;parent=$_.ParentProcessId;name=$_.Name;started=$_.CreationDate;kind=$(if($_.CommandLine -match 'gateway.test'){'gateway-test'}elseif($_.CommandLine -match 'npm-cli.*ci'){'npm-ci'}elseif($_.CommandLine -match 'review-release.ps1'){'release'}elseif($_.CommandLine -match 'extract-resume'){'extractor'}elseif($_.CommandLine -match 'online.mjs'){'online'}else{'other'})}})
          [ordered]@{checkedAt=[DateTime]::UtcNow.ToString('o');processes=$processes;releaseCreated=(Test-Path 'D:/services/ngiiseum/releases/644770638e58d45a0a87033ff6a9bb3454b93b37')}|ConvertTo-Json -Depth 5 -Compress
