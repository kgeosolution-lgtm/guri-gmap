name: NGII drawing-ingest-preflight-1110
on:
  push:
    branches: [codex/ngiiseum-drawing-ingest-preflight-1110-20261109]
    paths: [.github/workflows/ngiiseum-drawing-ingest-preflight-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: drawing-ingest-preflight-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $service='D:\services\ngiiseum'
          $current=Get-Content (Join-Path $service 'current.json') -Raw|ConvertFrom-Json
          $config=Get-Content (Join-Path $service 'online.local.json') -Raw|ConvertFrom-Json
          $web='D:\codesolution\kgeodata\ngiiseum\web.config'
          $listeners=@(Get-NetTCPConnection -LocalPort 4193 -State Listen -ErrorAction SilentlyContinue)
          [ordered]@{commit=$current.commit;dataTransfer=[bool]$config.dataTransfer;port4193Free=($listeners.Count -eq 0);disk=(Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='D:'"|Select-Object Size,FreeSpace);webConfigHash=(Get-FileHash $web -Algorithm SHA256).Hash.ToLowerInvariant();webConfig=(Get-Content $web -Raw);serviceAccount='NETWORK SERVICE';verifiedAt=[DateTime]::UtcNow.ToString('o')}|ConvertTo-Json -Depth 5 -Compress
          
