name: NGII remaining-independent-start-1111
on:
  push:
    branches: [codex/ngiiseum-remaining-independent-start-1111-20261109]
    paths: [.github/workflows/ngiiseum-remaining-independent-start-1111-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: remaining-independent-start-1111
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $ingest='D:/services/ngiiseum/drawing-ingest-20261111'
          $archive='D:/services/ngiiseum/data/remaining-drawings-20261111'
          $startup=New-CimInstance -ClassName Win32_ProcessStartup -ClientOnly -Property @{ShowWindow=[uint16]0}
          $old=Get-Content (Join-Path $ingest 'process.json') -Raw|ConvertFrom-Json
          if(Get-Process -Id $old.pid -ErrorAction SilentlyContinue){throw 'INGEST_ALREADY_ALIVE'}
          if(Get-NetTCPConnection -LocalPort 4193 -State Listen -ErrorAction SilentlyContinue){throw 'PORT_OCCUPIED'}
          $node=(Get-Command node.exe).Source
          $r=Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{CommandLine=('"'+$node+'" "'+$ingest+'/ingest.mjs"');CurrentDirectory=$ingest;ProcessStartupInformation=$startup}
          if($r.ReturnValue -ne 0){throw 'DETACHED_START_FAILED'}
          $state=Get-Content (Join-Path $archive 'extract-progress.json') -Raw|ConvertFrom-Json
          $alive=[bool](Get-Process -Id $state.pid -ErrorAction SilentlyContinue)
          if(-not $alive){
           if($state.phase -ne 'waiting_for_upload' -or $state.files -ne 0){throw 'EXTRACT_STATE_REQUIRES_REVIEW'}
           $e=Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{CommandLine=('"D:/services/ngiiseum/data/real50-20261109/python/python.exe" "'+$archive+'/extract.py"');CurrentDirectory=$archive;ProcessStartupInformation=$startup}
           if($e.ReturnValue -ne 0){throw 'EXTRACT_DETACHED_START_FAILED'}
          }
          [ordered]@{ingestPid=$r.ProcessId;extractPreviouslyAlive=$alive;extractPid=$e.ProcessId;databaseChanged=$false;gatewayChanged=$false;hidden=$true}|ConvertTo-Json -Compress
          
