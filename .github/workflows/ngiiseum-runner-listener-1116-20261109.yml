name: NGII runner-listener-1116
on:
  push:
    branches: [codex/ngiiseum-runner-listener-1116-20261109]
    paths: [.github/workflows/ngiiseum-runner-listener-1116-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: runner-listener-1116
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'Host boundary'}
          $r='D:\services\ngiiseum-runner'
          $f=Get-ChildItem (Join-Path $r '_diag') -Filter 'Runner_*.log'|Sort-Object LastWriteTime -Descending|Select-Object -First 1
          $p=@(Get-CimInstance Win32_Process|Where-Object {$_.ParentProcessId -in @(11612,16312,1084)}|Select-Object Name,ProcessId,ParentProcessId,ExecutablePath)
          [pscustomobject]@{file=$f.Name;modified=$f.LastWriteTime;children=$p;messages=@(Get-Content $f.FullName -Tail 120|Where-Object {$_ -match 'INFO JobDispatcher|ERR|WARN|Exception|Worker|process|cancel'}|ForEach-Object {$_ -replace '(?i)(token|password|authorization|secret)[=: ].*','$1=[redacted]'});stdout=@(Get-Content (Join-Path $r 'listener.stdout.log') -Tail 8)}|ConvertTo-Json -Depth 6 -Compress
          
