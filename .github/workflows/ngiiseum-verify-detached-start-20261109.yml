name: NGII verify-detached-start
on:
  push:
    branches: [codex/ngiiseum-verify-detached-start-20261109]
    paths: [.github/workflows/ngiiseum-verify-detached-start-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: verify-detached-start
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'Server identity'}
          $release='D:\services\ngiiseum\releases\96f63d01c6d793111217e48d9acfff52218a3c5b'
          Push-Location $release
          try{
           $source=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
           $source | & node.exe --input-type=module
           if($LASTEXITCODE -ne 0){throw 'Detached startup verification failed'}
           $source | & node.exe --input-type=module
           if($LASTEXITCODE -ne 0){throw 'Existing instance reuse verification failed'}
           @'
          import fs from 'node:fs/promises';import pg from 'pg';
          const cfg=JSON.parse(await fs.readFile('D:/services/ngiiseum/postgres.local.json','utf8'));
          const c=new pg.Client({...cfg,database:'postgres'});await c.connect();
          try{const n=(await c.query("select count(*)::int n from pg_database where datname='ngiiseum_review_real50_20261109'")).rows[0].n;console.log(JSON.stringify({reviewDatabaseExists:n===1,checkedAt:new Date().toISOString()}));}finally{await c.end();}
          '@ | & node.exe --input-type=module
           if($LASTEXITCODE -ne 0){throw 'Empty import state verification failed'}
          }finally{Pop-Location}
          
