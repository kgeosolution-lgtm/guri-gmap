name: NGII drawing-source-compare-1110
on:
  push:
    branches: [codex/ngiiseum-drawing-source-compare-1110-20261109]
    paths: [.github/workflows/ngiiseum-drawing-source-compare-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: drawing-source-compare-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $code=@'
          import fs from 'node:fs/promises';
          import {createRequire} from 'node:module';
          const service='D:/services/ngiiseum';
          const sha=JSON.parse(await fs.readFile(service+'/current.json','utf8')).commit;
          const require=createRequire(service+'/releases/'+sha+'/package.json'),pg=require('pg');
          const config=JSON.parse(await fs.readFile(service+'/real-review.local.json','utf8'));
          if(config.database.database!=='ngiiseum_review_real50_20261109'||config.database.port!==49326)throw Error('IDENTITY');
          const db=new pg.Client({...config.database,options:'-c default_transaction_read_only=on'});
          try{await db.connect();await db.query('begin isolation level repeatable read read only');for(const t of ['job','drawing','permit'])console.log(JSON.stringify({table:t,...(await db.query("select count(*)::int n,md5(string_agg(md5(to_jsonb(t)::text),'' order by id::text)) digest from local_flow."+t+' t')).rows[0]}));await db.query('rollback');}finally{await db.end();}
          '@
          $code | & node.exe --input-type=module
          if($LASTEXITCODE -ne 0){throw 'READ_COMPARE_FAILED'}
          
