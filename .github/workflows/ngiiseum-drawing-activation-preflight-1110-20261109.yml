name: NGII drawing-activation-preflight-1110
on:
  push:
    branches: [codex/ngiiseum-drawing-activation-preflight-1110-20261109]
    paths: [.github/workflows/ngiiseum-drawing-activation-preflight-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: drawing-activation-preflight-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $root='D:\services\ngiiseum\data\review-expansion-20261110'
          $p=Get-Content (Join-Path $root 'activation-prepared\proof.json') -Raw|ConvertFrom-Json
          @{claim=(Test-Path (Join-Path $root 'activation-claim.json'));failure=(Test-Path (Join-Path $root 'activation-failure.json'));reviewUnchanged=((Get-FileHash $p.files.review.path -Algorithm SHA256).Hash.ToLowerInvariant() -eq $p.files.review.before);catalogUnchanged=((Get-FileHash $p.files.catalog.path -Algorithm SHA256).Hash.ToLowerInvariant() -eq $p.files.catalog.before)}|ConvertTo-Json -Compress
          
