name: NGII catalog-meta-1110
on:
  push:
    branches: [codex/ngiiseum-catalog-meta-1110-20261109]
    paths: [.github/workflows/ngiiseum-catalog-meta-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: catalog-meta-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'HOST_REJECTED'}
          $service='D:\services\ngiiseum'
          if(-not (Test-Path -LiteralPath $service -PathType Container) -or ((Get-Item -LiteralPath $service).Attributes -band [IO.FileAttributes]::ReparsePoint)){throw 'SERVICE_BOUNDARY_REJECTED'}
          $payload=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))|ConvertFrom-Json
          if(@($payload).Count -ne 2){throw 'METADATA_COUNT_REJECTED'}
          function Hash-Bytes([byte[]]$Bytes){$sha=[Security.Cryptography.SHA256]::Create();try{return ([BitConverter]::ToString($sha.ComputeHash($Bytes))).Replace('-','').ToLowerInvariant()}finally{$sha.Dispose()}}
          $prepared=@()
          foreach($entry in $payload){
           if($entry.name -notin @('catalog-transfer-20261110.json','catalog-archive-20261110.json')){throw 'METADATA_NAME_REJECTED'}
           $bytes=[Convert]::FromBase64String($entry.base64)
           if($bytes.Length -ne $entry.bytes -or (Hash-Bytes $bytes) -ne $entry.sha256){throw 'METADATA_PAYLOAD_HASH_REJECTED'}
           $target=Join-Path $service $entry.name
           $exists=Test-Path -LiteralPath $target
           if($exists){
            if((Get-Item -LiteralPath $target).Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'METADATA_LINK_REJECTED'}
            if((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256){throw 'EXISTING_METADATA_DIFFERS_NO_OVERWRITE'}
           }
           $prepared+=@{entry=$entry;target=$target;bytes=$bytes;exists=$exists}
          }
          $readback=@()
          foreach($item in $prepared){
           if(-not $item.exists){
            $temporary=$item.target+'.'+[Guid]::NewGuid().ToString('N')+'.tmp'
            try{
             [IO.File]::WriteAllBytes($temporary,$item.bytes)
             [IO.File]::Move($temporary,$item.target)
            }finally{if(Test-Path -LiteralPath $temporary){Remove-Item -LiteralPath $temporary -Force}}
           }
           $file=Get-Item -LiteralPath $item.target
           $actual=(Get-FileHash -LiteralPath $item.target -Algorithm SHA256).Hash.ToLowerInvariant()
           if($file.Length -ne $item.entry.bytes -or $actual -ne $item.entry.sha256){throw 'METADATA_READBACK_FAILED'}
           $readback+=@{name=$item.entry.name;bytes=$file.Length;sha256=$actual;created=(-not $item.exists)}
          }
          @{metadataReady=$true;id='catalog-20261110';files=$readback;databaseChanged=$false;drawingFilesTransferred=$false;verifiedAt=[DateTime]::UtcNow.ToString('o')}|ConvertTo-Json -Depth 8 -Compress
          
