name: NGII gateway-task-access-1116
on:
  push:
    branches: [codex/ngiiseum-gateway-task-access-1116-20261109]
    paths: [.github/workflows/ngiiseum-gateway-task-access-1116-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: gateway-task-access-1116
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'Host boundary'}
          $service='D:\services\ngiiseum'
          $sched=New-Object -ComObject Schedule.Service
          $sched.Connect()
          $folder=$sched.GetFolder('\')
          $rows=@()
          foreach($name in @('NGII-Seumter-Gateway','NGII-Seumter-ReviewRunner')){
           $t=$folder.GetTask($name)
           $instances=@($t.GetInstances(0)|ForEach-Object {@{enginePid=$_.EnginePID;state=$_.State;currentAction=$_.CurrentAction}})
           $security=try{$t.GetSecurityDescriptor(7)}catch{'unavailable'}
           $st=Get-ScheduledTask -TaskName $name
           $rows+=@{name=$name;security=$security;instances=$instances;principal=@{user=$st.Principal.UserId;runLevel=[string]$st.Principal.RunLevel;logon=[string]$st.Principal.LogonType};actions=@($st.Actions|Select-Object Execute,Arguments,WorkingDirectory)}
          }
          @{tasks=$rows;privileges=@(whoami /priv|ForEach-Object {[string]$_});port=@(Get-NetTCPConnection -LocalPort 4190 -State Listen|Select-Object OwningProcess,State)}|ConvertTo-Json -Depth 7 -Compress
          
