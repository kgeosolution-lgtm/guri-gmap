name: NGII runner-diagnostic-1116
on:
  push:
    branches: [codex/ngiiseum-runner-diagnostic-1116-20261109]
    paths: [.github/workflows/ngiiseum-runner-diagnostic-1116-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: runner-diagnostic-1116
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'Host boundary'}
          $root='D:\services\ngiiseum-runner'
          $processes=@(Get-CimInstance Win32_Process | Where-Object {$_.ExecutablePath -like ($root+'\*')} | Select-Object Name,ProcessId,ParentProcessId,ExecutablePath)
          $files=@(Get-ChildItem -LiteralPath (Join-Path $root '_diag') -Filter '*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 3)
          $patterns='ERROR|Exception|failed|timeout|Starting|Running job|Job completed|Listening for Jobs|Worker process'
          $log=@($files | ForEach-Object {$f=$_; Get-Content -LiteralPath $f.FullName -Tail 100 | Where-Object {$_ -match $patterns} | ForEach-Object {($_ -replace '(?i)(token|password|authorization|secret)[=: ].*','$1=[redacted]')}})
          [pscustomobject]@{at=[DateTime]::UtcNow.ToString('o');processes=$processes;stop=(Test-Path -LiteralPath (Join-Path $root 'stop.request'));diag=@($files|Select-Object Name,LastWriteTime,Length);messages=$log;current=(Get-Content 'D:\services\ngiiseum\current.json' -Raw|ConvertFrom-Json).commit}|ConvertTo-Json -Depth 6 -Compress
          
