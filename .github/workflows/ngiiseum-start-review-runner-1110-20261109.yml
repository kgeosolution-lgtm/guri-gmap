name: NGII start-review-runner-1110
on:
  push:
    branches: [codex/ngiiseum-start-review-runner-1110-20261109]
    paths: [.github/workflows/ngiiseum-start-review-runner-1110-20261109.yml]
permissions:
  contents: read
concurrency:
  group: ngiiseum-server-deploy
  cancel-in-progress: false
jobs:
  task:
    runs-on: [self-hosted, Windows, X64, guri-preview]
    timeout-minutes: 10
    steps:
      - name: start-review-runner-1110
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'KGO-GIS'){throw 'Host boundary'}
          $service='D:\services\ngiiseum'
          $gateway=Join-Path $service 'run-gateway.ps1'
          $original=[IO.File]::ReadAllText($gateway).Replace([char]13+[char]10,[string][char]10)
          $h=[Security.Cryptography.SHA256]::Create()
          $beforeHash=([BitConverter]::ToString($h.ComputeHash([Text.Encoding]::UTF8.GetBytes($original)))).Replace('-','').ToLowerInvariant()
          if($beforeHash -ne 'ccbb648206fc80a340f29438b912d2a3706f834e8ba947cb88771bc630f7c3b8'){throw 'Gateway bootstrap changed; inspect without overwriting'}
          $task=Get-ScheduledTask -TaskName 'NGII-Seumter-Gateway'
          if($task.Actions.Arguments -notmatch [Regex]::Escape($gateway)){throw 'Unexpected startup task'}
          $backup=Join-Path $service 'run-gateway.before-review-runner-20261110.ps1'
          if(Test-Path -LiteralPath $backup){throw 'Bootstrap backup already exists; inspect before retry'}
          Copy-Item -LiteralPath $gateway -Destination $backup
          $helper=Join-Path $service 'start-review-runner.ps1'
          [IO.File]::WriteAllBytes($helper,[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes($gateway,[Convert]::FromBase64String(''))
          foreach($path in @($helper,$gateway)){
           $parseTokens=$null;$parseErrors=$null
           [Management.Automation.Language.Parser]::ParseFile($path,[ref]$parseTokens,[ref]$parseErrors)|Out-Null
           if($parseErrors){Copy-Item -LiteralPath $backup -Destination $gateway -Force;throw 'Bootstrap parse failed; previous gateway script restored'}
          }
          $env:RUNNER_TRACKING_ID='ngiiseum-review-runner-supervisor'
          foreach($name in @('GITHUB_TOKEN','GH_TOKEN','NGII_RUNNER_REGISTRATION')){[Environment]::SetEnvironmentVariable($name,$null,'Process')}
          $p=Start-Process -FilePath (Join-Path $PSHOME 'powershell.exe') -ArgumentList @('-NoProfile','-NonInteractive','-WindowStyle','Hidden','-File',('"'+$helper+'"')) -WorkingDirectory $service -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $service 'review-runner.stdout.log') -RedirectStandardError (Join-Path $service 'review-runner.stderr.log')
          [pscustomobject]@{installed=$true;gatewayRestarted=$false;supervisorPid=$p.Id;startupTask=$task.TaskName;gatewaySha256=(Get-FileHash -LiteralPath $gateway -Algorithm SHA256).Hash.ToLowerInvariant();helperSha256=(Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash.ToLowerInvariant();rebootTested=$false}|ConvertTo-Json -Compress
          
