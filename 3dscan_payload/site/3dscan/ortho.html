<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>kgeoScan 정사영상</title>
<!--
  정사영상 뷰어: ?meta=<서버의 <job>_ortho.json 주소>  (같은 사이트 파일만)
  확대/이동(휠·드래그·두 손가락), 축척 막대, 두 점 거리 재기(mm·cm·m). 바닥은 실제 땅 위 거리, 벽은 벽면 위 거리.
-->
<style>
  :root { --bg:#080b0f; --panel:rgba(13,17,23,.9); --line:rgba(255,255,255,.14); --text:#e6edf6; --muted:#8b98a8; --accent:#38bdf8; --mark:#facc15; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif; overflow:hidden; }
  #cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; }
  #cv.measuring { cursor:crosshair; }
  .bar { position:absolute; display:flex; gap:6px; align-items:center; z-index:2; }
  .tl { top:10px; left:10px; flex-direction:column; align-items:flex-start; }
  .tr { top:10px; right:10px; }
  .bl { bottom:12px; left:10px; }
  .badge { font:600 11px 'IBM Plex Mono',monospace; padding:3px 8px; border:1px solid var(--line); border-radius:3px; background:var(--panel); color:var(--accent); }
  .info { font:11px 'IBM Plex Mono',monospace; color:var(--muted); background:var(--panel); padding:3px 8px; border-radius:3px; }
  button { height:30px; padding:0 10px; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--text); font:12px inherit; cursor:pointer; }
  button.on { border-color:var(--mark); color:var(--mark); }
  #scale { display:flex; flex-direction:column; gap:3px; font:11px 'IBM Plex Mono',monospace; color:var(--text); background:var(--panel); padding:5px 8px 6px; border-radius:3px; }
  #scaleBar { height:6px; border:2px solid var(--text); border-top:none; }
  #measure { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:2; font:600 13px 'IBM Plex Mono',monospace;
             background:var(--panel); color:var(--mark); border:1px solid rgba(250,204,21,.5); padding:5px 10px; border-radius:4px; display:none; }
  /* 사이드바 iframe 안(embedded): 부모가 좌상단(배지·탭)·우상단(버튼)·우하단(전체화면)을 쓰므로 아래쪽으로 옮기고 중복 버튼은 숨긴다 */
  .embedded .tl { top:auto; bottom:48px; }
  .embedded .tl .badge { display:none; }
  .embedded .tr { top:auto; bottom:10px; right:52px; }
  .embedded #btnOpen { display:none; }
  .embedded #measure { left:auto; right:52px; transform:none; bottom:48px; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; z-index:3; }
  /* 높이 지도: 범례(색 막대 + 최소·최대)와 커서 위치 값 */
  #legend { display:none; flex-direction:column; gap:3px; font:11px 'IBM Plex Mono',monospace; color:var(--text);
            background:var(--panel); padding:5px 8px 6px; border-radius:3px; min-width:150px; }
  #legendBar { height:8px; border-radius:2px;
               background:linear-gradient(90deg,#30123b,#4145ab,#4675ed,#39a2fc,#1bcfd4,#24eca6,#61fc6c,#a4fc3b,#d1e834,#f3c63a,#fe9b2d,#f36315,#d93806,#b11901,#7a0402); }
  #legendTicks { display:flex; justify-content:space-between; color:var(--muted); }
  #hval { font:11px 'IBM Plex Mono',monospace; color:var(--accent); background:var(--panel); padding:3px 8px; border-radius:3px; display:none; }
  .bl { flex-direction:column; align-items:flex-start; }
  .embedded .bl { bottom:84px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="bar tl">
  <div class="badge" id="title">정사영상</div>
  <div class="info" id="meta"></div>
</div>
<div class="bar tr">
  <button id="btnHeight" title="높이(바닥) / 벽면 앞뒤(벽) 색 지도" style="display:none">▤ 높이</button>
  <button id="btnMeasure" title="두 점을 눌러 거리 재기 (여러 개 남음)">📏 측정</button>
  <button id="btnClear" title="측정 모두 지우기" style="display:none">✕ 지우기</button>
  <button id="btnSave" title="지금 화면을 측정·축척과 함께 이미지로 저장 (보고서용)">⬇ 저장</button>
  <button id="btnFit" title="전체 보기">⤢ 전체</button>
  <button id="btnOpen" title="원본 이미지 새 탭">↗ 원본</button>
</div>
<div class="bar bl">
  <div id="hval"></div>
  <div id="legend"><span id="legendTitle">높이</span><div id="legendBar"></div><div id="legendTicks"><span id="legendLo"></span><span id="legendMid"></span><span id="legendHi"></span></div></div>
  <div id="scale"><span id="scaleText">—</span><div id="scaleBar"></div></div>
</div>
<div id="measure"></div>
<div id="msg">정사영상 불러오는 중...</div>

<script>
if (window.parent !== window) document.documentElement.classList.add("embedded");   // 사이드바 iframe 안
(function () {
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const metaUrl = params.get("meta");
  let meta = null, img = null, gsd = 0.001;
  let scale = 1, ox = 0, oy = 0;                  // 화면 = 이미지 * scale + (ox, oy)
  let measuring = false, pts = [], segs = [];
  let userMoved = false;                          // 사용자가 움직이기 전에는 창 크기가 바뀔 때마다 전체 보기로 다시 맞춘다
  // 높이 지도: int16 mm (행 우선, -32768 = 없음), 격자 한 칸 = 정사영상 step 픽셀. 바닥 = 기준면(가장 넓은 면) 대비 높이, 벽 = 평면 대비 앞뒤
  let H = null, hImg = null, showHeight = false;

  function heightAt(p) {                          // 정사영상 픽셀 좌표 → mm (없으면 null)
    if (!H || !H.data) return null;
    const hx = Math.floor(p[0] / H.step), hy = Math.floor(p[1] / H.step);
    if (hx < 0 || hy < 0 || hx >= H.width || hy >= H.height) return null;
    const v = H.data[hy * H.width + hx];
    return v === -32768 ? null : v;
  }
  function fmtH(mm, signed) {
    const s = signed && mm > 0 ? "+" : "";
    return Math.abs(mm) >= 1000 ? s + (mm / 1000).toFixed(2) + " m" : Math.abs(mm) >= 100 ? s + (mm / 10).toFixed(1) + " cm" : s + mm.toFixed(0) + " mm";
  }
  function loadHeight() {
    if (H.data || H.loading) return;
    H.loading = true;
    fetch(meta.files.height_bin).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
      .then(buf => { H.data = new Int16Array(buf); })
      .catch(() => { H.failed = true; });
  }

  function sameOrigin(u) { try { return new URL(u, location.href).origin === location.origin; } catch (e) { return false; } }
  function fail(t) { $("msg").textContent = t; $("msg").style.display = "flex"; }
  function fmtLen(m) { return m >= 1 ? m.toFixed(3) + " m" : m >= 0.01 ? (m * 100).toFixed(1) + " cm" : (m * 1000).toFixed(1) + " mm"; }

  function resize() {
    const r = window.devicePixelRatio || 1;
    cv.width = Math.round(cv.clientWidth * r); cv.height = Math.round(cv.clientHeight * r);
    ctx.setTransform(r, 0, 0, r, 0, 0);
    if (!userMoved) fit(); else draw();
  }
  function fit() {
    if (!img) return;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;                         // 숨겨진 iframe 등 크기 0 일 때는 다음 resize 에서 맞춘다
    scale = Math.min(w / img.width, h / img.height) * 0.95;
    ox = (w - img.width * scale) / 2; oy = (h - img.height * scale) / 2;
    draw();
  }
  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.fillStyle = "#080b0f"; ctx.fillRect(0, 0, w, h);
    if (!img) return;
    ctx.imageSmoothingEnabled = scale < 2;
    if (showHeight && hImg && hImg.complete && hImg.naturalWidth) {
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(hImg, ox, oy, hImg.naturalWidth * H.step * scale, hImg.naturalHeight * H.step * scale);
    } else {
      ctx.drawImage(img, ox, oy, img.width * scale, img.height * scale);
    }
    drawMeasures(ctx, p => [p[0] * scale + ox, p[1] * scale + oy]);
    // 축척 막대: 화면 80~160 px 에 맞는 깔끔한 길이
    const mPerScreenPx = gsd / scale;
    const nice = [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50];
    let L = nice[nice.length - 1];
    for (const n of nice) { if (n / mPerScreenPx >= 80) { L = n; break; } }
    $("scaleBar").style.width = Math.round(L / mPerScreenPx) + "px";
    $("scaleText").textContent = fmtLen(L);
  }
  // 측정: 끝난 것은 segs 에 남겨 둔다(번호·값 표시), pts = 지금 찍는 중인 점
  function measureLabel(a, b) {
    let t = fmtLen(Math.hypot(b[0] - a[0], b[1] - a[1]) * gsd);
    const h0 = heightAt(a), h1 = heightAt(b);
    if (h0 !== null && h1 !== null) t += (H.kind === "relief" ? " · 앞뒤 " : " · 높이차 ") + fmtH(h1 - h0, true);
    return t;
  }
  function drawMeasures(c, toScreen) {
    c.save();
    c.lineWidth = 2;
    c.font = "600 12px 'IBM Plex Mono', monospace";
    segs.forEach((s, i) => {
      const a = toScreen(s.a), b = toScreen(s.b);
      c.strokeStyle = "#facc15"; c.fillStyle = "#facc15";
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
      [a, b].forEach(p => { c.beginPath(); c.arc(p[0], p[1], 3.5, 0, Math.PI * 2); c.fill(); });
      const t = (i + 1) + ") " + s.label, tw = c.measureText(t).width;
      const mx = (a[0] + b[0]) / 2 + 8, my = (a[1] + b[1]) / 2 - 8;
      c.fillStyle = "rgba(8,11,15,.82)"; c.fillRect(mx - 4, my - 13, tw + 8, 18);
      c.fillStyle = "#facc15"; c.fillText(t, mx, my);
    });
    pts.forEach(p => { const q = toScreen(p); c.fillStyle = "#facc15"; c.beginPath(); c.arc(q[0], q[1], 4, 0, Math.PI * 2); c.fill(); });
    c.restore();
  }
  function zoomAt(sx, sy, f) {
    userMoved = true;
    const ns = Math.min(Math.max(scale * f, 0.02), 40);
    ox = sx - (sx - ox) * (ns / scale); oy = sy - (sy - oy) * (ns / scale); scale = ns; draw();
  }
  function toImg(sx, sy) { return [(sx - ox) / scale, (sy - oy) / scale]; }

  // ── 입력: 마우스·터치 공통 (pointer events) ──
  const active = new Map(); let lastPinch = 0, moved = 0, downAt = null;
  cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); active.set(e.pointerId, [e.offsetX, e.offsetY]); moved = 0; downAt = [e.offsetX, e.offsetY]; });
  cv.addEventListener("pointermove", e => {
    if (!active.has(e.pointerId)) return;
    const prev = active.get(e.pointerId); active.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (active.size === 1) { userMoved = true; ox += e.offsetX - prev[0]; oy += e.offsetY - prev[1]; moved += Math.abs(e.offsetX - prev[0]) + Math.abs(e.offsetY - prev[1]); draw(); }
    else if (active.size === 2) {
      const [a, b] = [...active.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (lastPinch) zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / lastPinch);
      lastPinch = d; moved += 10;
    }
  });
  const up = e => {
    active.delete(e.pointerId); if (active.size < 2) lastPinch = 0;
    if (measuring && moved < 6 && downAt && active.size === 0) {
      const p = toImg(downAt[0], downAt[1]);
      if (p[0] >= 0 && p[1] >= 0 && p[0] <= img.width && p[1] <= img.height) {
        pts.push(p);
        if (pts.length === 2) {
          const label = measureLabel(pts[0], pts[1]);
          segs.push({ a: pts[0], b: pts[1], label });
          pts = [];
          $("measure").textContent = segs.length + ") 거리 " + label + "  — 다음 측정: 점을 누르세요";
          $("btnClear").style.display = "";
        } else {
          const h0 = heightAt(pts[0]);
          $("measure").textContent = "두 번째 점을 누르세요" + (h0 !== null ? " (첫 점 " + fmtH(h0, true) + ")" : "");
        }
        $("measure").style.display = "block"; draw();
      }
    }
    downAt = null;
  };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.offsetX, e.offsetY, e.deltaY < 0 ? 1.2 : 1 / 1.2); }, { passive: false });
  $("btnFit").onclick = () => { userMoved = false; fit(); };
  $("btnHeight").onclick = () => {
    showHeight = !showHeight;
    $("btnHeight").classList.toggle("on", showHeight);
    $("legend").style.display = showHeight ? "flex" : "none";
    if (showHeight && !hImg) { hImg = new Image(); hImg.onload = draw; hImg.src = meta.files.height_image; }
    loadHeight();
    draw();
  };
  // 마우스 위치의 높이 (터치는 측정 모드의 점 값으로 본다)
  cv.addEventListener("mousemove", e => {
    if (!H || !H.data || active.size) { $("hval").style.display = "none"; return; }
    const v = heightAt(toImg(e.offsetX, e.offsetY));
    if (v === null) { $("hval").style.display = "none"; return; }
    $("hval").textContent = (H.kind === "relief" ? "벽면 기준 " : "기준면 대비 ") + fmtH(v, true) + (H.kind === "relief" ? (v > 0 ? " (앞)" : v < 0 ? " (뒤)" : "") : "");
    $("hval").style.display = "block";
  });
  cv.addEventListener("mouseleave", () => { $("hval").style.display = "none"; });
  $("btnMeasure").onclick = () => {               // 끄더라도 끝난 측정은 화면에 남는다 (지우기로 지움)
    measuring = !measuring; pts = [];
    $("btnMeasure").classList.toggle("on", measuring); cv.classList.toggle("measuring", measuring);
    $("measure").style.display = measuring ? "block" : "none";
    $("measure").textContent = "첫 번째 점을 누르세요"; draw();
  };
  $("btnClear").onclick = () => {
    segs = []; pts = [];
    $("btnClear").style.display = "none";
    if (measuring) $("measure").textContent = "첫 번째 점을 누르세요";
    draw();
  };
  // 보고서용 이미지: 지금 보이는 화면(측정선·값 포함) + 아래 띠(제목·정보·날짜·축척 막대·범례)
  $("btnSave").onclick = () => {
    if (!img) return;
    const r = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight, foot = 58;
    const out = document.createElement("canvas");
    out.width = cv.width; out.height = cv.height + Math.round(foot * r);
    const c = out.getContext("2d");
    c.fillStyle = "#080b0f"; c.fillRect(0, 0, out.width, out.height);
    c.drawImage(cv, 0, 0);
    c.setTransform(r, 0, 0, r, 0, 0);
    c.fillStyle = "#e6edf6"; c.font = "600 14px 'Pretendard', 'Malgun Gothic', sans-serif";
    c.fillText((params.get("title") || "kgeoScan") + " · " + $("title").textContent, 12, h + 22);
    c.fillStyle = "#8b98a8"; c.font = "11px 'IBM Plex Mono', monospace";
    c.fillText($("meta").textContent + " · 저장 " + new Date().toLocaleString("ko-KR"), 12, h + 42);
    const bw = parseFloat($("scaleBar").style.width) || 80, x1 = w - 16, x0 = x1 - bw, y = h + 40;
    c.strokeStyle = "#e6edf6"; c.lineWidth = 2;
    c.beginPath(); c.moveTo(x0, y - 7); c.lineTo(x0, y); c.lineTo(x1, y); c.lineTo(x1, y - 7); c.stroke();
    c.fillStyle = "#e6edf6"; c.textAlign = "right"; c.fillText($("scaleText").textContent, x1, y - 12);
    if (showHeight && H) {                        // 높이 범례
      const gx = x0 - 190, gw = 160, g = c.createLinearGradient(gx, 0, gx + gw, 0);
      ["#30123b", "#4675ed", "#1bcfd4", "#61fc6c", "#d1e834", "#fe9b2d", "#d93806", "#7a0402"].forEach((col, i, arr) => g.addColorStop(i / (arr.length - 1), col));
      c.fillStyle = g; c.fillRect(gx, y - 10, gw, 8);
      c.fillStyle = "#8b98a8"; c.textAlign = "left"; c.fillText($("legendLo").textContent, gx, y + 12);
      c.textAlign = "right"; c.fillText($("legendHi").textContent, gx + gw, y + 12);
    }
    if (meta.surface === "floor") {               // 바닥 정사영상은 위쪽이 북쪽
      c.textAlign = "center"; c.fillStyle = "#e6edf6"; c.font = "600 13px sans-serif";
      c.fillText("N", w - 24, 26); c.beginPath(); c.moveTo(w - 24, 32); c.lineTo(w - 30, 46); c.lineTo(w - 18, 46); c.closePath(); c.fill();
    }
    const d = new Date(), pad = n => String(n).padStart(2, "0");
    const a = document.createElement("a");
    a.href = out.toDataURL("image/png");
    a.download = `kgeoscan_ortho_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  };
  $("btnOpen").onclick = () => { if (meta) window.open(meta.files.image, "_blank"); };
  window.addEventListener("resize", resize);

  if (!metaUrl || !sameOrigin(metaUrl)) { fail("?meta= 가 없거나 다른 사이트 주소입니다"); return; }
  fetch(metaUrl, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(m => {
    meta = m; gsd = m.gsd_m || 0.001;
    const kind = m.surface === "wall" ? "벽 정면" : "바닥·위에서";
    $("title").textContent = "정사영상 · " + kind;
    $("meta").textContent = `${(gsd * 1000).toFixed(2)} mm/px · ${m.extent_m[0].toFixed(2)} × ${m.extent_m[1].toFixed(2)} m · ${m.source === "hires" ? "고해상도 사진" : "영상"} ${m.views_used}장`;
    const src = m.files && m.files.image;
    if (!src || !sameOrigin(src)) throw new Error("이미지 주소 오류");
    // 높이 지도 정보: height_map (2026-10-29~). 그 전 판은 height 에 넣었다 (그때는 height 가 영상 세로 픽셀 수를 덮어씀)
    const hm = m.height_map || (m.height && typeof m.height === "object" ? m.height : null);
    if (hm && m.files.height_bin && m.files.height_image && sameOrigin(m.files.height_bin) && sameOrigin(m.files.height_image)) {
      H = Object.assign({}, hm);
      $("btnHeight").style.display = "";
      $("legendTitle").textContent = H.kind === "relief" ? "벽면 앞뒤 (평면 기준)" : "높이 (가장 넓은 면 기준)";
      $("legendLo").textContent = fmtH(H.display_range_mm[0], true);
      $("legendHi").textContent = fmtH(H.display_range_mm[1], true);
      $("legendMid").textContent = fmtH((H.display_range_mm[0] + H.display_range_mm[1]) / 2, true);
      loadHeight();                               // 측정·커서 값용 (사진 모드에서도 높이차를 보여 준다)
    }
    img = new Image();
    img.onload = () => { $("msg").style.display = "none"; resize(); };
    img.onerror = () => fail("이미지를 불러오지 못했습니다");
    img.src = src;
  }).catch(e => fail("정사영상 정보를 불러오지 못했습니다: " + e.message));
  resize();
})();
</script>
</body>
</html>
