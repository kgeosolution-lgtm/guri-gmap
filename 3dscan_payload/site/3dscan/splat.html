<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kgeoScan Splat Viewer</title>
<!--
  가우시안 스플랫 전용 뷰어 (ES 모듈). 사이트 본문은 three.js r128 전역 스크립트라 최신 three 가 필요한 스플랫 라이브러리를
  섞을 수 없어, 이 페이지를 iframe(사이드바) 또는 새 탭으로 띄운다.
    ?model=<.splat 경로>   같은 사이트(origin)의 파일만 허용. 옆에 <model>.json 이 있으면 그 view(look/pos/up)로 시작
    &look=x,y,z&pos=x,y,z  시점 직접 지정 (json 보다 우선)
    &walk=1                불러온 뒤 바로 걸어보기 / walk=0 걸어보기 버튼 숨김
    &floor=<y>             바닥 높이 직접 지정 (m, ARKit y). 없으면 floorplan.json → 스플랫 점으로 추정
    &floorplan=<url>       평면도(worker/floorplan.py 의 floorplan.json). 없으면 json 의 floorplan_url → <job>_floorplan.json 순으로 찾는다
    &vr=1 | vr=0           '헤드셋으로 보기' 버튼 강제 표시(시험용) / 숨김. 기본: 헤드셋(immersive-vr 지원)일 때만.
                         ('VR' 이라는 말은 화면에 안 쓴다 — 실사 360° 'VR 투어' 탭과 헷갈리지 않게)
  좌표: 스플랫은 GLB 와 같은 ARKit 로컬 프레임(미터, y 위).
  라이브러리: three 0.165 + @mkkellogg/gaussian-splats-3d 0.4.7 (CDN, import map). SharedArrayBuffer 는 쓰지 않음(COOP/COEP 불필요).
  걸어보기: walk.js (메시 뷰어 viewer.js 와 같이 씀). 측정: 스플랫 광선 교차(불투명한 점 중심의 중앙값 깊이).
-->
<style>
  :root { --bg:#080b0f; --text:#e2e8f0; --text2:#94a3b8; --accent:#38bdf8; --acc-o:#fb923c; --yel:#facc15; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 -apple-system, 'Pretendard', system-ui, sans-serif; overflow:hidden; }
  body { position:fixed; inset:0; touch-action:none; }
  canvas { display:block; outline:none; }
  #hud { position:fixed; left:10px; top:10px; z-index:10; pointer-events:none; display:flex; flex-direction:column; gap:4px; }
  .pill { background:rgba(8,11,15,.78); border:1px solid rgba(56,189,248,.25); color:var(--accent); font-family:'IBM Plex Mono',ui-monospace,monospace;
          font-size:10px; letter-spacing:.4px; padding:3px 8px; border-radius:2px; width:fit-content; backdrop-filter:blur(6px); white-space:nowrap; }
  .pill.o { border-color:rgba(251,146,60,.35); color:var(--acc-o); }
  #ctl { position:fixed; right:10px; top:10px; z-index:10; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:5px; max-width:calc(100% - 20px); }
  .btn { height:28px; padding:0 10px; background:rgba(13,17,23,.88); border:1px solid rgba(148,163,184,.35); color:var(--accent);
         font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; font-weight:600; border-radius:3px; cursor:pointer; backdrop-filter:blur(6px); white-space:nowrap; }
  .btn:hover { border-color:var(--accent); background:rgba(56,189,248,.12); }
  .btn.on { border-color:var(--yel); color:var(--yel); background:rgba(250,204,21,.12); }
  .btn.walk { background:rgba(56,189,248,.16); border-color:rgba(56,189,248,.6); color:#e0f2fe; }
  .btn.walk.on { background:rgba(56,189,248,.9); border-color:#38bdf8; color:#04121c; }
  .btn.vr { color:#c4b5fd; border-color:rgba(167,139,250,.55); }
  #help { position:fixed; left:50%; bottom:10px; transform:translateX(-50%); z-index:10; pointer-events:none; background:rgba(0,0,0,.55); color:#ccc;
          font-size:11px; padding:5px 12px; border-radius:20px; white-space:nowrap; max-width:calc(100% - 20px); overflow:hidden; text-overflow:ellipsis; }
  #load { position:fixed; inset:0; z-index:9; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:var(--bg); transition:opacity .4s; }
  #load.done { opacity:0; pointer-events:none; }
  .spin { width:28px; height:28px; border-radius:50%; border:3px solid rgba(56,189,248,.25); border-top-color:var(--accent); animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loadText { font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; color:var(--text2); }
  #bar { width:180px; height:3px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  #err { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:24px; text-align:center; color:#f87171; background:var(--bg); font-size:13px; line-height:1.7; }
  /* 측정 */
  #msvg { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:7; }
  #msvg line { stroke:var(--yel); stroke-width:2.2; filter:drop-shadow(0 0 2px rgba(0,0,0,.7)); }
  #msvg circle { fill:var(--yel); stroke:#111; stroke-width:1.5; }
  #mlabel { position:fixed; z-index:8; transform:translate(-50%,-130%); background:rgba(0,0,0,.78); color:var(--yel); font:700 12px ui-monospace,monospace;
            padding:3px 8px; border-radius:4px; pointer-events:none; display:none; white-space:nowrap; }
  #mbox { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); z-index:10; display:none; align-items:center; gap:8px; background:rgba(13,17,23,.9);
          border:1px solid rgba(250,204,21,.45); color:var(--text); border-radius:6px; padding:6px 10px; font-size:12px; white-space:nowrap; max-width:calc(100% - 20px); }
  #mbox b { color:var(--yel); font-size:14px; } #mbox span { color:var(--text2); font-size:10.5px; }
  #mbox button { height:22px; padding:0 8px; background:transparent; border:1px solid rgba(148,163,184,.45); color:var(--text); border-radius:3px; font-size:11px; cursor:pointer; }
  #VRButton { display:none !important; }   /* 라이브러리 버튼은 숨기고 #btnVR(헤드셋으로 보기)로 누른다 */
  body.walking #hud { display:none; }
  /* 좁은 화면: 보조 버튼은 아이콘만 */
  @media (max-width: 560px) { .btn .lbl { display:none; } .btn.walk .lbl { display:inline; } .btn { padding:0 8px; } #help { font-size:10px; } }
  /* 사이드바 iframe 안(embedded): 부모가 좌상단(배지·탭)·우상단(버튼)·우하단(전체화면)을 쓰므로 겹치지 않게 아래쪽으로 옮기고 중복 버튼은 숨긴다 */
  .embedded #hud { top:auto; bottom:10px; }
  .embedded #hud .pill.o { display:none; }
  .embedded #ctl { top:auto; bottom:10px; right:52px; }
  .embedded #btnFull { display:none; }
  .embedded #help { bottom:auto; top:10px; left:50%; max-width:40%; font-size:10px; }
  .embedded #mbox { bottom:46px; }
  .embedded .kw-map.bl { bottom:46px; }
  @media (max-width: 700px) { .embedded #help { display:none; } }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
} }
</script>

</head>
<body>
<div id="hud"><div class="pill o">Gaussian Splat · 3DGS</div><div class="pill" id="hudInfo">loading…</div></div>
<div id="ctl">
  <button type="button" class="btn walk" id="btnWalk" style="display:none" title="집 안을 눈높이로 걸어 다니기 — 바닥을 누르면 그 자리로 이동"><span class="ic">🚶</span><span class="lbl"> 걸어보기</span></button>
  <button type="button" class="btn" id="btnMeasure" style="display:none" title="두 점을 눌러 거리 재기 (M)"><span class="ic">📏</span><span class="lbl"> 측정</span></button>
  <button type="button" class="btn vr" id="btnVR" style="display:none" title="헤드셋을 쓰고 이 집 안을 걸어 보기">헤드셋으로 보기</button>
  <button type="button" class="btn" id="btnReset" title="처음 시점으로 (R)"><span class="ic">↺</span><span class="lbl"> 시점</span></button>
  <button type="button" class="btn" id="btnFull" title="전체화면 (F)">⤢</button>
</div>
<div id="help">좌클릭·한 손가락: 회전 &nbsp;|&nbsp; 우클릭·두 손가락: 이동·줌 &nbsp;|&nbsp; 휠: 줌 &nbsp;|&nbsp; R: 시점 초기화</div>
<svg id="msvg"></svg><div id="mlabel"></div><div id="mbox"></div>
<div id="load"><div class="spin"></div><div id="loadText">스플랫 불러오는 중...</div><div id="bar"><i id="barFill"></i></div></div>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const vec = (s, d) => { if (!s) return d; const v = s.split(',').map(Number); return v.length === 3 && v.every(Number.isFinite) ? v : d; };
const isMobile = window.matchMedia('(max-width: 768px)').matches || /iPhone|iPad|Android/i.test(navigator.userAgent);
const isTouch = matchMedia('(pointer: coarse)').matches;
const embedded = window.parent !== window;
if (embedded) document.documentElement.classList.add('embedded');   // 사이드바 iframe 안
const post = (msg) => { try { if (embedded) window.parent.postMessage(Object.assign({ type: 'kgeo-splat' }, msg), location.origin); } catch (e) {} };
const HELP = {
  orbit: $('help').innerHTML,
  walk: isTouch ? '바닥 탭: 이동 &nbsp;|&nbsp; 드래그: 둘러보기 &nbsp;|&nbsp; 두 손가락: 확대 &nbsp;|&nbsp; 미니맵 탭: 그 자리로'
                : '바닥 클릭: 이동 &nbsp;|&nbsp; 드래그: 둘러보기 &nbsp;|&nbsp; 휠: 확대 &nbsp;|&nbsp; WASD: 걷기 &nbsp;|&nbsp; Esc: 나가기',
  measure: isTouch ? '두 점을 탭해 거리 재기' : '두 점을 클릭해 거리 재기 &nbsp;|&nbsp; M·Esc: 끄기',
};

function fail(msg) {
  $('load').classList.add('done');
  const e = $('err'); e.style.display = 'flex'; e.textContent = msg;
  $('hudInfo').textContent = 'error';
  post({ state: 'error', message: msg });
}

const modelParam = params.get('model');
let modelUrl = null;
try { modelUrl = modelParam ? new URL(modelParam, location.href) : null; } catch (e) {}
if (!modelUrl) {
  fail('?model=<.splat 경로> 가 필요합니다');
} else if (modelUrl.origin !== location.origin) {
  fail('같은 사이트의 스플랫 파일만 열 수 있습니다');
} else {
  run(modelUrl);
}

async function loadMeta(url) {
  // 워커가 올린 <job>.splat.json: { view: { look, pos, up }, splat_full_url?, object_mode?, floorplan_url? } — 시점과 물체 모드 정보
  try {
    const r = await fetch(url.href + '.json', { cache: 'no-store' });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

// VR 헤드셋인가: immersive-vr 를 지원하고, 헤드셋 브라우저가 아닌 안드로이드 폰은 뺀다
async function detectVR() {
  const f = params.get('vr');
  if (f === '0') return false;
  if (f === '1') return true;
  if (!navigator.xr || !navigator.xr.isSessionSupported) return false;
  const ua = navigator.userAgent;
  if (/Android/i.test(ua) && /Mobile/i.test(ua) && !/OculusBrowser|Quest|Pico|Wolvic|\bVR\b/i.test(ua)) return false;
  try { return !!(await Promise.race([navigator.xr.isSessionSupported('immersive-vr'), new Promise(r => setTimeout(() => r(false), 1500))])); }
  catch (e) { return false; }
}

async function run(url) {
  const name = url.pathname.split('/').pop();
  $('hudInfo').textContent = name;
  const isFull = /_full\.(splat|spz|ksplat)$/.test(url.pathname);
  const metaUrl = isFull ? new URL(url.href.replace(/_full(\.(splat|spz|ksplat))$/, '$1')) : url;
  const [meta, vrOK] = await Promise.all([loadMeta(metaUrl), detectVR()]);
  const view = meta && meta.view ? meta.view : null;
  // 물체 모드: 자른 것(기본) ↔ 전체 전환 버튼
  if (meta && meta.splat_full_url) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn';
    b.textContent = isFull ? '✂ 물체만' : '⧉ 전체';
    b.title = isFull ? '물체 영역으로 자른 스플랫 보기' : '자르기 전 전체 장면 보기';
    b.onclick = () => { const p = new URLSearchParams(location.search); p.set('model', isFull ? meta.splat_url : meta.splat_full_url); location.search = p.toString(); };
    $('ctl').insertBefore(b, $('btnWalk'));
  }
  const look = vec(params.get('look'), view && Array.isArray(view.look) ? view.look : null);
  const pos  = vec(params.get('pos'),  view && Array.isArray(view.pos)  ? view.pos  : null);
  const up   = vec(params.get('up'),   view && Array.isArray(view.up)   ? view.up   : [0, 1, 0]);
  const haveView = !!(look && pos);
  const viewer = new GaussianSplats3D.Viewer({
    cameraUp: up,
    initialCameraPosition: haveView ? pos : [0, 0.6, 1.2],
    initialCameraLookAt: haveView ? look : [0, 0, 0],
    sharedMemoryForWorkers: false,          // 사이트가 COOP/COEP 헤더를 보내지 않으므로 SharedArrayBuffer 불가
    gpuAcceleratedSort: false,
    antialiased: !isMobile,
    sphericalHarmonicsDegree: 0,            // .splat 에는 SH 가 없다
    halfPrecisionCovariancesOnGPU: isMobile,
    inMemoryCompressionLevel: isMobile ? 1 : 0,
    sceneRevealMode: GaussianSplats3D.SceneRevealMode.Instant,
    logLevel: GaussianSplats3D.LogLevel.None,
    // VR 헤드셋일 때만 WebXR VR 모드 (이 모드에선 라이브러리가 돌려 보기 조작을 만들지 않아 아래에서 직접 만든다)
    webXRMode: vrOK ? GaussianSplats3D.WebXRMode.VR : GaussianSplats3D.WebXRMode.None,
  });
  window.__viewer = viewer;
  if (vrOK && !viewer.controls) {
    const c = new GaussianSplats3D.OrbitControls(viewer.camera, viewer.renderer.domElement);
    c.listenToKeyEvents(window);
    c.rotateSpeed = 0.5; c.maxPolarAngle = Math.PI * 0.75; c.minPolarAngle = 0.1; c.enableDamping = true; c.dampingFactor = 0.05;
    c.target.fromArray(haveView ? look : [0, 0, 0]); c.update();
    viewer.controls = viewer.perspectiveControls = c;
  }
  const bar = $('barFill'), lt = $('loadText');
  try {
    await viewer.addSplatScene(url.href, {
      splatAlphaRemovalThreshold: 5,
      showLoadingUI: false,
      progressiveLoad: false,
      onProgress: (pct, label, stage) => {
        if (typeof pct === 'number' && Number.isFinite(pct)) { bar.style.width = Math.max(0, Math.min(100, pct)) + '%'; lt.textContent = `스플랫 불러오는 중... ${Math.round(pct)}%`; }
        else if (label) lt.textContent = String(label);
      },
    });
  } catch (err) {
    fail('스플랫을 불러오지 못했습니다: ' + (err && err.message ? err.message : err));
    console.error(err);
    return;
  }
  viewer.start();
  const mesh = viewer.getSplatMesh();
  const n = mesh && mesh.getSplatCount ? mesh.getSplatCount() : 0;
  if (!haveView) fitCamera(viewer, mesh, n);
  const home = { pos: viewer.camera.position.clone(), target: viewer.controls ? viewer.controls.target.clone() : new THREE.Vector3() };
  $('hudInfo').textContent = `${name} · ${n.toLocaleString()} splats`;
  $('load').classList.add('done');
  window.__loaded = true;
  post({ state: 'loaded', count: n });

  let walk = null;
  const cam = () => viewer.camera;
  const canvas = viewer.renderer.domElement;

  function resetView() {
    if (walk && walk.active) walk.exit();
    viewer.camera.position.copy(home.pos);
    if (viewer.controls) { viewer.controls.target.copy(home.target); viewer.controls.update(); }
  }
  $('btnReset').onclick = resetView;
  $('btnFull').onclick = () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
  };
  // 먼저 받는 키 (capture): 측정 끄기가 걷기 나가기보다 먼저
  window.addEventListener('keydown', e => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.code === 'Escape' && M.on) { setMeasure(false); e.stopImmediatePropagation(); e.preventDefault(); }
  }, true);
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyR') resetView();
    if (e.code === 'KeyF') $('btnFull').onclick();
    if (e.code === 'KeyM') setMeasure(!M.on);
  });

  /* ── 라이브러리 클릭(초점 옮기기)은 돌려 보기에서만 ── */
  const origClick = viewer.onMouseClick.bind(viewer);
  viewer.onMouseClick = (m) => { if (!M.on && !(walk && walk.active)) origClick(m); };

  /* ════ 측정 ════ */
  const M = { on: false, pts: [] };
  const msvg = $('msvg'), mlabel = $('mlabel'), mbox = $('mbox');
  const fmtLen = m => (m >= 1 ? m.toFixed(2) + ' m' : (m * 100).toFixed(1) + ' cm');
  $('btnMeasure').style.display = '';
  $('btnMeasure').onclick = () => setMeasure(!M.on);
  function setMeasure(on) {
    M.on = on; M.pts = [];
    $('btnMeasure').classList.toggle('on', on);
    if (!on) { mbox.style.display = 'none'; msvg.innerHTML = ''; mlabel.style.display = 'none'; }
    else box('첫 번째 점을 ' + (isTouch ? '탭' : '클릭') + '하세요');
    setHelp();
    if (!on) canvas.style.cursor = '';
  }
  function box(html, result) {
    mbox.innerHTML = html + (result ? ' <button type="button" id="mAgain">새로 재기</button>' : '');
    mbox.style.display = 'flex';
    if (result) $('mAgain').onclick = () => { M.pts = []; drawMeasure(); box('첫 번째 점을 ' + (isTouch ? '탭' : '클릭') + '하세요'); };
  }
  // 스플랫 표면 점: 광선이 지나는 불투명한 스플랫들 중 앞쪽 무리의 중심 깊이(중앙값). 트리가 없으면 점유 격자로 대신
  const _rd = new THREE.Vector2(), _c4 = new THREE.Vector4(), _cv = new THREE.Vector3();
  function pickSurface(sx, sy) {
    const rc = viewer.raycaster;
    viewer.getRenderDimensions(_rd);
    if (rc && mesh.getSplatTree && mesh.getSplatTree()) {
      rc.setFromCameraAndScreenPosition(cam(), new THREE.Vector2(sx, sy), _rd);
      const hits = [];
      rc.intersectSplatMesh(mesh, hits);
      const o = rc.ray.origin, d = rc.ray.direction;
      let first = null; const ts = [];
      for (const h of hits) {
        mesh.getSplatColor(h.splatIndex, _c4);
        if (_c4.w < 70) continue;
        if (first == null) first = h.distance;
        if (h.distance > first + 0.06) break;
        mesh.getSplatCenter(h.splatIndex, _cv, false);
        ts.push(_cv.sub(o).dot(d));
        if (ts.length >= 15) break;
      }
      if (ts.length) { ts.sort((a, b) => a - b); return o.clone().addScaledVector(d, ts[ts.length >> 1]); }
      return null;
    }
    if (walk) {
      const S = walk.scene, c = cam();
      const o = new THREE.Vector3().setFromMatrixPosition(c.matrixWorld);
      const d = new THREE.Vector3(sx / _rd.x * 2 - 1, -(sy / _rd.y) * 2 + 1, 0.5).unproject(c).sub(o).normalize();
      const t = S.marchHit(o, d, 30);
      return t != null ? o.addScaledVector(d, t + S.v * 0.5) : null;
    }
    return null;
  }
  let mdown = null;
  canvas.addEventListener('pointerdown', e => { if (M.on) mdown = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener('pointerup', e => {
    if (!M.on || !mdown) return;
    const moved = Math.hypot(e.clientX - mdown.x, e.clientY - mdown.y), dt = performance.now() - mdown.t;
    mdown = null;
    if (moved > 6 || dt > 700) return;
    const r = canvas.getBoundingClientRect();
    const p = pickSurface(e.clientX - r.left, e.clientY - r.top);
    if (!p) { box('그 자리에서 표면을 찾지 못했어요. 조금 옆을 눌러 보세요'); return; }
    if (M.pts.length >= 2) M.pts = [];
    M.pts.push(p);
    if (M.pts.length === 2) {
      const [a, b] = M.pts, dd = a.distanceTo(b), dh = Math.hypot(b.x - a.x, b.z - a.z), dv = Math.abs(b.y - a.y);
      box(`<b>${fmtLen(dd)}</b><span>수평 ${fmtLen(dh)} · 높이차 ${fmtLen(dv)}</span>`, true);
    } else box('두 번째 점을 ' + (isTouch ? '탭' : '클릭') + '하세요');
    drawMeasure();
  });
  const _pv = new THREE.Vector3();
  function proj(p) {
    const c = cam();
    _pv.copy(p).applyMatrix4(c.matrixWorldInverse);
    if (_pv.z > -0.02) return null;
    _pv.applyMatrix4(c.projectionMatrix);
    return [(_pv.x + 1) / 2 * innerWidth, (1 - _pv.y) / 2 * innerHeight];
  }
  function drawMeasure() {
    if (!M.on || !M.pts.length) { if (msvg.firstChild) msvg.innerHTML = ''; mlabel.style.display = 'none'; return; }
    const q = M.pts.map(proj);
    let h = '';
    if (q.length === 2 && q[0] && q[1]) h += `<line x1="${q[0][0]}" y1="${q[0][1]}" x2="${q[1][0]}" y2="${q[1][1]}"/>`;
    for (const p of q) if (p) h += `<circle cx="${p[0]}" cy="${p[1]}" r="5"/>`;
    msvg.innerHTML = h;
    if (q.length === 2 && q[0] && q[1]) {
      mlabel.style.display = 'block'; mlabel.textContent = fmtLen(M.pts[0].distanceTo(M.pts[1]));
      mlabel.style.left = (q[0][0] + q[1][0]) / 2 + 'px'; mlabel.style.top = (q[0][1] + q[1][1]) / 2 + 'px';
    } else mlabel.style.display = 'none';
    if (M.on && !(walk && walk.active)) canvas.style.cursor = 'crosshair';
  }

  function setHelp() {
    $('help').innerHTML = M.on ? HELP.measure : walk && walk.active ? HELP.walk : HELP.orbit;
  }

  /* ── 프레임 고리: 라이브러리 update 앞뒤로 걷기·측정·VR ── */
  const origUpdate = viewer.update.bind(viewer);
  let xrFrame = null;
  viewer.update = function (...a) {
    const xr = viewer.renderer.xr && viewer.renderer.xr.isPresenting;
    if (xr) { if (xrFrame) xrFrame(); return origUpdate(...a); }
    if (walk) walk.tick();
    const r = origUpdate(...a);
    cam().updateMatrixWorld();
    if (walk) walk.draw();
    drawMeasure();
    return r;
  };

  /* ════ 걸어보기 준비 (불러온 뒤 한 번) ════ */
  if (params.get('walk') !== '0') setTimeout(() => prepareWalk().catch(e => console.warn('walk', e)), 30);

  async function prepareWalk() {
    const t0 = performance.now();
    const P = extractPoints(mesh, n);
    // 평면도: ?floorplan= → json.floorplan_url → <job>_floorplan.json (같은 사이트만)
    const job = name.replace(/_full(?=\.)/, '').replace(/\.(splat|spz|ksplat|ply)$/i, '');
    const cands = [params.get('floorplan'), meta && meta.floorplan_url, new URL(job + '_floorplan.json', url).href].filter(Boolean);
    let fp = null;
    for (const c of cands) {
      let u; try { u = new URL(c, location.href); } catch (e) { continue; }
      if (u.origin !== location.origin) continue;
      fp = await KgeoWalk.loadFloorplan(u.href);
      if (fp) break;
    }
    const plan = fp ? KgeoWalk.floorplanWorld(fp) : null;
    const fParam = parseFloat(params.get('floor'));
    const floorY = Number.isFinite(fParam) ? fParam : plan && Number.isFinite(plan.floorY) ? plan.floorY : undefined;
    const S = KgeoWalk.analyze(P, { floorY, floorSrc: Number.isFinite(fParam) ? 'param' : 'floorplan', ceilY: plan ? plan.ceilY : undefined, solidMin: 2, plan });
    window.__walkScene = S;
    console.info('[walk]', S.ok ? `floor ${S.floorY.toFixed(3)} (${S.floorSrc}) ceil ${S.ceilY != null ? S.ceilY.toFixed(2) : '-'} voxel ${S.v.toFixed(3)} footprint ${S.footprintM2.toFixed(1)} m2 walkable ${S.walkable} waypoints ${S.waypoints.length} plan ${!!plan} ${(performance.now() - t0).toFixed(0)} ms` : S.reason);
    // 실내(천장이 보이거나 평면도가 있거나 홈스캔)이고 걸을 만한 바닥이 있을 때만. 굴착·야외·물체 스캔엔 버튼이 없다
    const indoor = S.ok && (S.ceilY != null || !!plan || params.get('home') === '1');
    if (!S.ok || ((!S.walkable || !indoor) && params.get('walk') !== '1')) return;
    walk = KgeoWalk.create({
      THREE, camera: viewer.camera, dom: canvas, container: document.body,
      getControls: () => viewer.controls, scene: S, plan,
      isBusy: () => M.on,
      coverageHint: true,                    // 점이 성긴 쪽을 보면 '이쪽은 촬영이 적어 흐릴 수 있어요' 한 줄
      hintRatio: parseFloat(params.get('hint')) || undefined,
      mapCorner: embedded ? 'bl' : 'tl', mapSize: embedded ? 130 : (innerWidth < 560 ? 120 : 190),
      onChange: on => {
        document.body.classList.toggle('walking', on);
        $('btnWalk').classList.toggle('on', on);
        $('btnWalk').querySelector('.lbl').textContent = on ? ' 둘러보기' : ' 걸어보기';
        $('btnWalk').title = on ? '걸어보기 끝내고 돌려 보기로' : '집 안을 눈높이로 걸어 다니기 — 바닥을 누르면 그 자리로 이동';
        setHelp();
        post({ state: 'walk', active: on });
      },
    });
    window.__walk = walk;
    $('btnWalk').style.display = '';
    $('btnWalk').onclick = () => walk.toggle();
    if (vrOK) setupVR(walk, S);
    if (params.get('walk') === '1') walk.enter();
  }

  /* ════ 헤드셋으로 보기 (WebXR immersive-vr, 헤드셋일 때만) ════ */
  function setupVR(walk, S) {
    const r = viewer.renderer, btn = $('btnVR');
    btn.style.display = '';
    let saved = null, base = null, place = null;
    const scene3 = viewer.threeScene;
    // 바닥 링 + 컨트롤러 광선 (방아쇠 = 그 자리로 순간이동)
    const xrRing = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.26, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
    xrRing.visible = false; scene3.add(xrRing);
    const ctrls = [0, 1].map(i => {
      const c = r.xr.getController(i);
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]), new THREE.LineBasicMaterial({ color: 0x38bdf8 }));
      line.scale.z = 4; c.add(line); scene3.add(c);
      c.addEventListener('select', () => { const t = target(c); if (t) teleport(t); });
      return c;
    });
    const _m = new THREE.Matrix4(), _o = new THREE.Vector3(), _d = new THREE.Vector3();
    function target(c) {
      c.updateMatrixWorld(true);
      _o.setFromMatrixPosition(c.matrixWorld); _d.set(0, 0, -1).applyMatrix4(_m.extractRotation(c.matrixWorld));
      if (_d.y > -0.05) return null;
      const t = (S.floorY - _o.y) / _d.y;
      if (!(t > 0.2 && t < 20)) return null;
      const p = _o.clone().addScaledVector(_d, t);
      if (!S.inFootprint(p.x, p.z) || !S.clearLine(_o, p)) return null;
      const s = S.snap(p.x, p.z, 0.4);
      return s ? { x: s[0], z: s[1] } : null;
    }
    function setPlace(x, z, yaw) {
      place = { x, z, yaw };
      const c = Math.cos(-yaw), s = Math.sin(-yaw);
      const t = { x: -(x * c + z * s), y: -S.floorY, z: -(-x * s + z * c), w: 1 };
      r.xr.setReferenceSpace(base.getOffsetReferenceSpace(new XRRigidTransform(t, { x: 0, y: Math.sin(-yaw / 2), z: 0, w: Math.cos(-yaw / 2) })));
    }
    function teleport(tg) {
      const h = viewer.camera.position;            // 머리 위치(장면 좌표)
      setPlace(place.x + (tg.x - h.x), place.z + (tg.z - h.z), place.yaw);
    }
    xrFrame = () => {
      let hit = null;
      for (const c of ctrls) { if (c.visible) { hit = target(c); if (hit) break; } }
      xrRing.visible = !!hit;
      if (hit) xrRing.position.set(hit.x, S.floorY + 0.02, hit.z);
    };
    r.xr.addEventListener('sessionstart', () => {
      saved = viewer.controls; viewer.controls = null;          // 머리 자세와 다투지 않게
      base = r.xr.getReferenceSpace();
      if (!walk.active) walk.enter({ instant: true });
      setPlace(walk.pos.x, walk.pos.z, walk.yaw);
      btn.classList.add('on'); btn.textContent = '헤드셋 보기 끝내기';
    });
    r.xr.addEventListener('sessionend', () => {
      viewer.controls = saved; xrRing.visible = false;
      if (place) walk.setPose(viewer.camera.position.x, viewer.camera.position.z, null);
      walk.applyCamera();
      btn.classList.remove('on'); btn.textContent = '헤드셋으로 보기';
    });
    btn.onclick = () => {
      if (r.xr.isPresenting) { const s = r.xr.getSession(); if (s) s.end(); return; }
      if (!navigator.xr) { walk.showToast('이 기기·브라우저에서는 헤드셋으로 볼 수 없어요'); return; }
      if (!walk.active) walk.enter({ instant: true });
      const lb = document.getElementById('VRButton');
      if (lb && typeof lb.onclick === 'function') lb.click();
      else navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] })
        .then(s => r.xr.setSession(s)).catch(e => { console.warn('VR', e); walk.showToast('이 기기에서는 헤드셋 보기를 시작할 수 없어요 — 헤드셋(Quest 등) 브라우저에서 열어 주세요', 3200); });
    };
  }
}

// 스플랫 중심(불투명한 것만) → Float32Array xyz
function extractPoints(mesh, n) {
  const step = Math.max(1, Math.ceil(n / 450000));
  const out = new Float32Array(Math.ceil(n / step) * 3);
  const v = new THREE.Vector3(), c = new THREE.Vector4();
  let k = 0;
  for (let i = 0; i < n; i += step) {
    mesh.getSplatColor(i, c);
    if (c.w < 30) continue;
    mesh.getSplatCenter(i, v, false);
    if (!Number.isFinite(v.x) || !Number.isFinite(v.y) || !Number.isFinite(v.z)) continue;
    out[k++] = v.x; out[k++] = v.y; out[k++] = v.z;
  }
  return out.subarray(0, k);
}

function fitCamera(viewer, mesh, n) {
  // 시점 정보가 없을 때: 스플랫 중심을 표본으로 중앙값·반경을 구해 카메라를 놓는다
  if (!mesh || !n || !mesh.getSplatCenter) return;
  const step = Math.max(1, Math.floor(n / 20000));
  const xs = [], ys = [], zs = [];
  const v = new THREE.Vector3();
  for (let i = 0; i < n; i += step) { mesh.getSplatCenter(i, v, false); if (Number.isFinite(v.x)) { xs.push(v.x); ys.push(v.y); zs.push(v.z); } }
  if (!xs.length) return;
  const med = a => { const s = a.slice().sort((p, q) => p - q); return s[Math.floor(s.length / 2)]; };
  const c = new THREE.Vector3(med(xs), med(ys), med(zs));
  const d = xs.map((x, i) => Math.hypot(x - c.x, ys[i] - c.y, zs[i] - c.z)).sort((p, q) => p - q);
  const r = Math.max(0.3, d[Math.floor(d.length * 0.8)] || 1);
  viewer.camera.position.set(c.x + r * 0.5, c.y + r * 0.6, c.z + r * 1.4);
  if (viewer.controls) { viewer.controls.target.copy(c); viewer.controls.update(); }
}
</script>
