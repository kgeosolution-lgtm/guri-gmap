<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>kgeoScan VR 투어</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2338bdf8'/%3E%3C/svg%3E">
<!--
  kgeoScan VR 투어 뷰어 (360° 실사 파노라마) — 계약: docs/pano_contract.md 3·5·5.1·6·7절
  열기: ?job=<job_id> (status.py 의 pano_url) 또는 ?tour=<tour.json URL>
  선택: &spot=s02 &yaw= &pitch= &fov= (처음 보는 곳) · &edit=1 (연결·시작 방향·평면도 위치 편집 → tour.json 내려받기)
        &embed=1 (메인 뷰어의 🥽 VR 투어 탭 iframe: 로고·공유 숨김, postMessage 로 알림 — 5.1절) · &hq=0 (미리보기만, 데이터 아끼기)
  three.js 0.165 (MIT, jsdelivr) — 사이트의 splat.html·utility.html 과 같은 판. 한 파일, 빌드 없음.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" } }</script>
<style>
:root{
  --bg:#080b0f; --s1:#0d1117; --s2:#121820; --s3:#18212d;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --accent:#38bdf8; --acc-g:#34d399; --acc-o:#fb923c; --acc-r:#f87171;
  --text:#f0f6ff; --text2:#94a3b8; --text3:#546880;
  --glass:rgba(13,17,23,.72);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--sans);color:var(--text);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
[hidden]{display:none !important}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#c{width:100%;height:100%;display:block}
#hots{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* 머리 */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 10px) 12px 18px;background:linear-gradient(rgba(8,11,15,.92),rgba(8,11,15,.62) 62%,rgba(8,11,15,0));pointer-events:none}
.bar>*{pointer-events:auto}
.logo{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:7px;text-decoration:none;flex:none}
.logo i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.ttl{min-width:0;flex:1}
.ttl b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ttl small{display:block;font-size:12px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ib{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;
  background:var(--glass);border:1px solid var(--border2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ib svg{width:20px;height:20px}
.ib.on{color:#03131f;background:var(--accent);border-color:var(--accent)}
.ib:active{transform:scale(.96)}

/* 오른쪽 조작 */
.side{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:8px}
/* 나침반 */
.compass{position:fixed;left:12px;top:calc(var(--safe-t) + 64px);z-index:20;width:44px;height:44px;border-radius:50%;
  background:var(--glass);border:1px solid var(--border2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.compass svg{width:100%;height:100%;transition:none}

/* 지점 목록 */
.spots{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:22px 12px calc(var(--safe-b) + 12px);
  background:linear-gradient(rgba(8,11,15,0),rgba(8,11,15,.85) 45%);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;pointer-events:auto}
.spots::-webkit-scrollbar{display:none}
.sp{flex:none;width:112px;border-radius:10px;overflow:hidden;background:var(--s2);border:2px solid transparent;text-align:left;position:relative}
.sp img{display:block;width:100%;height:56px;object-fit:cover;background:var(--s3)}
.sp span{display:block;padding:5px 8px 6px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp.cur{border-color:var(--accent)}
.sp.cur span{color:var(--accent)}
.sp em{position:absolute;top:4px;left:4px;font-style:normal;font-family:var(--mono);font-size:10.5px;background:rgba(8,11,15,.75);border-radius:5px;padding:1px 5px;color:var(--text2)}

/* 미니맵 */
.mini{position:fixed;right:64px;top:calc(var(--safe-t) + 64px);z-index:20;width:220px;border-radius:12px;overflow:hidden;
  background:rgba(240,242,245,.94);border:1px solid var(--border2);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.mini .hd{display:flex;align-items:center;justify-content:space-between;padding:5px 6px 5px 10px;background:var(--glass);color:var(--text);font-size:12px;font-weight:600}
.mini .hd button{width:28px;height:24px;border-radius:6px;color:var(--text2)}
.mini .map{position:relative}
.mini .map img{display:block;width:100%;height:auto}
.mini .map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mini.fold .map{display:none}
.mini.pick .map{cursor:crosshair;outline:3px solid var(--acc-o);outline-offset:-3px}
.mini .hd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .hd span b{color:var(--accent);font-weight:700}
.mini .mlist{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:rgba(240,242,245,.96);border-top:1px solid rgba(0,0,0,.08)}
.mini .mlist button{min-height:28px;padding:0 9px;border-radius:999px;border:1px solid rgba(15,23,42,.18);background:#fff;color:#1e293b;font-size:12px;font-weight:600;cursor:pointer}
.mini .mlist button.cur{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
.mini .mlist button.placed::after{content:' ●';color:#0ea5e9;font-size:9px}
.mini .mlist button.cur.placed::after{color:#fff}
.mini.fold .mlist{display:none}

/* 바닥 원·화살표 */
.hot{position:absolute;left:0;top:0;pointer-events:auto;width:96px;height:96px;margin:-48px 0 0 -48px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hot .ring{width:74px;height:74px;border-radius:50%;border:4px solid rgba(255,255,255,.95);box-shadow:0 0 0 2px rgba(0,0,0,.25),inset 0 0 0 2px rgba(0,0,0,.2),0 0 18px rgba(56,189,248,.55);
  transform:rotateX(66deg);background:radial-gradient(rgba(56,189,248,.25),rgba(56,189,248,0) 70%);transition:transform .15s,border-color .15s}
.hot .arr{position:absolute;top:22px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.hot .lbl{position:absolute;top:70px;white-space:nowrap;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(8,11,15,.72);
  border:1px solid var(--border2)}
.hot:hover .ring,.hot:focus-visible .ring{border-color:var(--accent);transform:rotateX(66deg) scale(1.12)}
.hot:focus-visible{outline:none}
/* 설명 표시 (meta.json hotspots) */
.ihot{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;transform-origin:0 0;padding:0;background:none;border:0;cursor:pointer}
.ihot .dot{width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);color:#0369a1;
  font:800 17px/1 Georgia,serif;box-shadow:0 0 0 3px rgba(56,189,248,.55),0 2px 8px rgba(0,0,0,.45);animation:ipulse 2.4s ease-in-out infinite}
.ihot .tl{margin-top:-17px;white-space:nowrap;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(8,11,15,.72);border:1px solid var(--border2);color:var(--text);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.ihot.on .dot{background:var(--accent);color:#fff}
@keyframes ipulse{0%,100%{box-shadow:0 0 0 3px rgba(56,189,248,.55),0 2px 8px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 7px rgba(56,189,248,.25),0 2px 8px rgba(0,0,0,.45)}}
.icard{position:fixed;left:50%;bottom:calc(var(--safe-b) + 112px);transform:translateX(-50%);z-index:25;width:min(380px,calc(100% - 24px));background:var(--s1);border:1px solid var(--border2);
  border-radius:14px;padding:14px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.icard b{display:block;font-size:16px;padding-right:34px}
.icard p{margin-top:6px;font-size:14px;color:var(--text2);white-space:pre-line;line-height:1.5;max-height:40vh;overflow:auto}
.icard button{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;color:var(--text2);font-size:18px}
#stage.picking{cursor:crosshair}

/* 알림 */
.center{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none}
.box{pointer-events:auto;max-width:min(420px,calc(100% - 32px));background:var(--s1);border:1px solid var(--border2);border-radius:14px;padding:18px 18px 16px;text-align:center}
.box b{display:block;font-size:16px;margin-bottom:6px}
.box p{color:var(--text2);font-size:13.5px}
.box a{display:inline-flex;margin-top:12px;color:var(--accent)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(56,189,248,.2);border-top-color:var(--accent);animation:sp 0.9s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 120px);transform:translateX(-50%) translateY(20px);z-index:40;opacity:0;pointer-events:none;
  background:var(--s1);border:1px solid var(--border2);border-radius:10px;padding:9px 14px;font-size:13.5px;transition:.25s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;
  color:#fff;font-size:13.5px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.7);transition:opacity .6s}
.hint svg{width:54px;height:54px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));animation:sw 2.2s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateX(-16px)}50%{transform:translateX(16px)}}
.fade{position:fixed;inset:0;z-index:12;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}

/* 편집 */
.edit{position:fixed;left:12px;bottom:calc(var(--safe-b) + 112px);z-index:25;width:min(340px,calc(100% - 24px));max-height:calc(100% - 220px);overflow:auto;
  background:var(--s1);border:1px solid var(--border2);border-radius:12px;padding:12px;-webkit-user-select:text;user-select:text}
.edit h3{font-size:13px;color:var(--acc-o);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.edit .row{display:flex;gap:6px;align-items:center;margin-top:6px}
.edit input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--s2);border:1px solid var(--border2);border-radius:7px;padding:7px 9px}
.edit .b{flex:none;font-size:12.5px;font-weight:600;padding:7px 9px;border-radius:7px;background:var(--s2);border:1px solid var(--border2)}
.edit .b.p{background:var(--accent);color:#03131f;border-color:var(--accent)}
.edit .ln{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--border)}
.edit .ln span{flex:1;min-width:0;font-size:13px}
.edit .ln small{display:block;font-family:var(--mono);font-size:11px;color:var(--text3)}
.edit .note{font-size:12px;color:var(--text3);margin-top:8px}
.edit .q{font-size:12px;color:var(--text2);margin-top:4px}

.ib.hqb{font-family:var(--mono);font-size:12px;font-weight:600}
.ib.hqb:not(.on){color:var(--text3)}
body.embed .logo{display:none}
body.embed .bar{padding-top:8px}
@media (max-width:640px){
  .mini{right:auto;left:12px;top:auto;bottom:calc(var(--safe-b) + 108px);width:150px}
  .compass{top:calc(var(--safe-t) + 60px)}
  .side{top:auto;bottom:calc(var(--safe-b) + 108px);transform:none}
  .sp{width:96px}.sp img{height:48px}
  .edit{bottom:auto;top:calc(var(--safe-t) + 60px);max-height:45%}
  .ttl b{font-size:14px}
}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="hots"></div></div>
<div class="fade" id="fade"></div>

<header class="bar">
  <a class="logo" href="/app/3dscan/" title="kgeoScan"><i></i>kgeoScan</a>
  <div class="ttl"><b id="tTitle">VR 투어</b><small id="tSpot">불러오는 중…</small></div>
  <button class="ib" id="bShare" title="이 장면 링크 공유" aria-label="링크 공유"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
</header>

<button class="compass" id="compass" hidden title="북쪽 보기" aria-label="북쪽 보기"><svg viewBox="0 0 44 44"><g id="needle"><path d="M22 6l5 16h-10z" fill="#f87171"/><path d="M22 38l-5-16h10z" fill="#94a3b8"/><text x="22" y="5.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="#f0f6ff" font-family="sans-serif">N</text></g></svg></button>

<div class="side">
  <button class="ib" id="bIn" title="확대" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="bOut" title="축소" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button class="ib hqb on" id="bHQ" title="고화질 (끄면 미리보기만 — 데이터 절약)" aria-label="고화질 켜고 끄기">HD</button>
  <button class="ib" id="bGyro" hidden title="휴대폰을 움직여 둘러보기" aria-label="기울여 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9c-1.3 2-1.3 4 0 6M21 9c1.3 2 1.3 4 0 6"/></svg></button>
  <button class="ib" id="bFull" title="전체 화면" aria-label="전체 화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div class="mini" id="mini" hidden>
  <div class="hd"><span id="miniHd">평면도</span><button id="miniFold" aria-label="평면도 접기">–</button></div>
  <div class="map" id="miniMap"><img id="miniImg" alt="평면도"><svg id="miniSvg" viewBox="0 0 1 1" preserveAspectRatio="none"></svg></div>
  <div class="mlist" id="miniList" hidden></div>
</div>

<nav class="spots" id="spots" aria-label="지점"></nav>

<div class="hint" id="hint" hidden><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 30V14a3 3 0 016 0v10l7.5 1.6a3 3 0 012.4 3.4L32.5 38H21l-6.5-7a2.6 2.6 0 013.5-3.8z"/><path d="M6 14l-3 3 3 3M42 14l3 3-3 3"/></svg><span>끌어서 둘러보세요</span></div>

<div class="center" id="center"><div class="box"><div class="spin"></div><b id="cMain">VR 투어를 불러오는 중…</b><p id="cSub"></p></div></div>
<div class="toast" id="toast"></div>
<div class="icard" id="iCard" hidden role="dialog" aria-live="polite"><b id="iTitle"></b><p id="iText"></p><button id="iClose" aria-label="닫기">×</button></div>

<aside class="edit" id="edit" hidden>
  <h3>✎ 투어 편집</h3>
  <div class="row"><input id="eName" maxlength="30" aria-label="지점 이름"><button class="b" id="eStart">시작 방향 = 지금</button></div>
  <div id="eLinks"></div>
  <div class="row"><button class="b" id="ePlan">평면도에 위치 찍기</button><button class="b" id="eRevert">편집 지우기</button><button class="b p" id="eSave">tour.json 받기</button></div>
  <div class="q" id="eQual"></div>
  <p class="note">편집은 이 브라우저에만 임시 저장됩니다. 받은 tour.json 을 서버 작업 폴더의 pano/ 에 올리면 모두에게 반영됩니다.</p>
</aside>

<script type="module">
import * as THREE from 'three';

const $ = (id) => document.getElementById(id);
const P = new URLSearchParams(location.search);
const API = '/app/3dupload/';
const D2R = Math.PI / 180;
const MOBILE = matchMedia('(pointer:coarse)').matches || /iP(hone|ad|od)|Android/.test(navigator.userAgent);
const EDIT = P.get('edit') === '1';
const EMBED = P.get('embed') === '1' || window.self !== window.top;
// &plan=<png 주소>: 같은 장소의 자동 평면도(worker/floorplan.py)를 미니맵으로 (계약 5절). 같은 출처(또는 상대 주소)만 연다
const PLAN_URL = (() => { const v = P.get('plan'); if (!v) return null; try { const u = new URL(v, location.href); return u.origin === location.origin ? u.href : null; } catch (e) { return null; } })();
// &pos=s01:0.42:0.31[:yaw];s02:...  지점의 평면도 위치(0~1, 왼쪽 위 기준)와 평면도 위 방향(선택) — 지점 놓기 결과를 주소로 넘길 때
const POS = (() => { const o = {}; (P.get('pos') || '').split(';').forEach((t) => { const a = t.split(':'); if (a.length < 3) return; const x = parseFloat(a[1]), y = parseFloat(a[2]), w = parseFloat(a[3]); if (a[0] && isFinite(x) && isFinite(y)) o[a[0]] = { xy: [Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))], yaw: isFinite(w) ? w : null }; }); return o; })();
if (EMBED) document.body.classList.add('embed');
const MAX_TILES = MOBILE ? 6 : 8;            // 동시에 올려 둘 고해상도 조각 (2048² 한 장 ≈ 16 MB GPU)
const R_BASE = 500, R_TILE = 490;

const S = {
  tour: null, tourUrl: '', base: null, spot: null, view: null, old: null,
  yaw: 0, pitch: 0, fov: 75, fovMin: 30, fovMax: 100,
  drag: null, pointers: new Map(), vel: [0, 0], lastMove: 0, interacted: false, auto: true,

async function showSpot(spot, link) {

  const sameFrame = !S.spot || (S.spot.frame || 1) === (spot.frame || 1);
  const fovBefore = S.fov;

    const loadP = nv.loadBase();
    if (link && isFinite(link.yaw)) {               // 그 방향으로 다가가며(확대) 다음 지점을 받는다

    const r = $('miniImg').getBoundingClientRect();
    S.spot.plan_xy = [+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)];
    if (S.spot.yaw_on_plan == null && S.tour.spots.some((o) => isFinite(o.yaw_on_plan))) S.spot.yaw_on_plan = S.tour.spots.find((o) => isFinite(o.yaw_on_plan)).yaw_on_plan;
    S.edit.pick = false; $('mini').classList.remove('pick'); $('ePlan').textContent = '평면도에 위치 찍기';
    saveEdit(); renderMini(); toast('평면도 위치를 정했습니다');
  });
  $('eRevert').onclick = () => { if (!window.confirm('이 브라우저에 저장한 편집을 지우고 원래 투어로 되돌릴까요?')) return; try { localStorage.removeItem(editKey()); } catch (e) { } location.reload(); };
  $('eSave').onclick = () => {
    const blob = new Blob([JSON.stringify(S.tour, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tour.json'; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
}

init();
</script>
</body>
</html>
