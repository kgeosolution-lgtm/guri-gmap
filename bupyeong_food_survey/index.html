<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3a4a">
<title>식품업체 현장조사</title>
<!-- 태블릿 홈 화면에 앱처럼 추가 -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="식품 현장조사">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo&family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="style.css?v=c887805935">
</head>
<body>
  <header class="appbar">
    <div class="appbar__title">부평구 식품업체 현장조사</div>
    <button id="btnShop" class="chip" type="button">
      <span class="chip__label">업소</span>
      <span id="shopLabel" class="chip__value">미입력</span>
    </button>
    <div id="progress" class="appbar__progress">확인 0 / 23</div>
  </header>

  <main id="stage" class="stage">
    <div id="pageWrap" class="page-wrap">
      <div id="page" class="page">
        <svg id="paper" class="paper" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1188" width="840" height="1188"></svg>
        <div id="hotspots" class="hotspots"></div>
      </div>
    </div>
  </main>

  <footer class="actionbar">
    <button id="btnReset" class="btn btn--ghost" type="button">초기화</button>
    <span id="saveState" class="save-state"></span>
    <button id="btnSubmit" class="btn btn--primary" type="button">제출</button>
  </footer>

  <div id="popover" class="popover" hidden></div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet__head">
        <h2 id="sheetTitle" class="sheet__title"></h2>
        <button class="sheet__x" type="button" data-close aria-label="닫기">✕</button>
      </div>
      <div id="sheetBody" class="sheet__body"></div>
      <div id="sheetActions" class="sheet__actions"></div>
    </div>
  </div>

  <script src="form-layout.js?v=8869b80b99"></script>
  <script src="app.js?v=dab161ee76"></script>
</body>
</html>
